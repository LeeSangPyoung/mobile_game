<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>三國 - 메인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ============================================================
       메인 화면 컨테이너 (모바일 프레임 — 데스크톱에서도 폰 비율 유지)
       ============================================================ -->
  <main class="app" id="app">

    <!-- ─────────────────────────────────────────────
         1. 상단바 (TopBar) — 프로필 / 재화 / 액션
         ───────────────────────────────────────────── -->
    <header class="topbar">

      <!-- 1-1 프로필 (좌) -->
      <div class="topbar__profile profile">
        <!-- TODO: 이미지 교체 위치 → assets/avatar_lord.png -->
        <div class="profile__avatar" data-img="avatar_lord">👑</div>
        <div class="profile__info">
          <div class="profile__name">주군 <b class="profile__lv">Lv.<span id="lv">1</span></b></div>
          <div class="profile__bar">
            <div class="profile__bar-fill" style="width: 65%;"></div>
          </div>
        </div>
      </div>

      <!-- 1-2 우측 액션 -->
      <div class="topbar__actions">
        <button class="icon-btn" aria-label="설정" data-click="settings">⚙</button>
        <button class="icon-btn" aria-label="메일" data-click="mail">✉</button>
        <button class="icon-btn" aria-label="메뉴" data-click="menu">☰</button>
      </div>

      <!-- 1-3 재화 (하단 줄) -->
      <div class="topbar__currencies">
        <!-- TODO: 이미지 교체 위치 → assets/icon_gold.png -->
        <div class="currency currency--gold">
          <span class="currency__icon" data-img="icon_gold">💰</span>
          <span class="currency__value" id="gold">12,500</span>
          <button class="currency__plus" data-click="buy-gold">+</button>
        </div>
        <!-- TODO: 이미지 교체 위치 → assets/icon_gem.png -->
        <div class="currency currency--gem">
          <span class="currency__icon" data-img="icon_gem">💎</span>
          <span class="currency__value" id="gem">350</span>
          <button class="currency__plus" data-click="buy-gem">+</button>
        </div>
      </div>
    </header>

    <!-- ─────────────────────────────────────────────
         2. 중앙 캐릭터 영역 + 타이틀 + 출정 CTA
            ATLAS 기반 — 모든 그래픽은 assets/ui_atlas.png 에서 잘라 사용
         ───────────────────────────────────────────── -->
    <section class="stage">
      <!-- 배경 — ATLAS .bg-main 슬롯 -->
      <div class="hero-section atlas bg-main" aria-hidden="true"></div>

      <h1 class="stage__title">삼국</h1>
      <span class="stage__chapter-tag">천하의 시작</span>

      <!-- 캐릭터 박스 (3명) — ATLAS 슬롯 -->
      <div class="characters">
        <div class="character atlas character--guanyu">
          <span class="character__name">관우</span>
        </div>
        <div class="character atlas character--cao">
          <span class="character__name">조조</span>
        </div>
        <div class="character atlas character--zhuge">
          <span class="character__name">제갈량</span>
        </div>
      </div>

      <!-- 출정 버튼 — ATLAS .btn-start 슬롯 -->
      <button class="cta-start atlas btn-start" id="btnStart" data-click="start" aria-label="출정">
        <span class="cta-start__stage" id="stageRange">1-1</span>
      </button>
    </section>

    <!-- ─────────────────────────────────────────────
         3. 우측 카드 패널 (3개 모드) — ATLAS 슬롯 사용
         ───────────────────────────────────────────── -->
    <aside class="side-panel">
      <button class="mode-card atlas panel-pvp" data-click="pvp" aria-label="천하쟁패">
        <div class="mode-card__label">천하쟁패</div>
      </button>
      <button class="mode-card atlas panel-tower" data-click="tower" aria-label="무한의 탑">
        <div class="mode-card__label">무한의 탑</div>
        <div class="mode-card__badge">120F</div>
      </button>
      <button class="mode-card atlas panel-guild" data-click="guild" aria-label="군단전">
        <div class="mode-card__label">군단전</div>
      </button>
    </aside>

    <!-- ─────────────────────────────────────────────
         4. 월드맵 (스테이지 노드 6개 + 곡선 길)
         ───────────────────────────────────────────── -->
    <section class="worldmap">
      <div class="worldmap__chapter">
        <span>1챕터 — 천하의 시작</span>
        <span>진행도 <b id="clearCount">2</b>/20 · ★ <b id="starCount">5</b>/60</span>
      </div>

      <!-- 곡선 길 (SVG) -->
      <svg class="worldmap__path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M 8 88 Q 28 60 26 40 Q 30 20 50 18 Q 70 22 72 42 Q 74 65 92 78"
              stroke="var(--c-path)" stroke-width="3.5" fill="none"
              stroke-dasharray="2.5 2.5" stroke-linecap="round" />
      </svg>

      <!-- 스테이지 노드 — ATLAS 슬롯 (각 80x80) -->
      <div class="worldmap__nodes">
        <button class="node atlas node-cleared" style="left: 10%; top: 88%;" data-click="stage-1">1</button>
        <button class="node atlas node-cleared" style="left: 26%; top: 58%;" data-click="stage-2">2</button>
        <button class="node atlas node-current" style="left: 30%; top: 28%;" data-click="stage-3">3</button>
        <button class="node atlas node-locked"  style="left: 54%; top: 18%;" data-click="stage-4">4</button>
        <button class="node atlas node-locked"  style="left: 74%; top: 42%;" data-click="stage-5">5</button>
        <button class="node atlas node-boss"    style="left: 90%; top: 78%;" data-click="stage-boss">王</button>
      </div>
    </section>

    <!-- ─────────────────────────────────────────────
         5. 하단 네비게이션 (5개 탭)
         ───────────────────────────────────────────── -->
    <nav class="navbar">
      <button class="nav-item" data-click="nav-hero">
        <!-- TODO: 이미지 교체 → assets/nav_hero.png -->
        <span class="nav-item__icon" data-img="nav_hero">🛡</span>
        <span class="nav-item__label">장수</span>
      </button>
      <button class="nav-item" data-click="nav-formation">
        <!-- TODO: 이미지 교체 → assets/nav_formation.png -->
        <span class="nav-item__icon" data-img="nav_formation">📋</span>
        <span class="nav-item__label">편성</span>
      </button>
      <button class="nav-item nav-item--center" id="btnBattleCenter" data-click="nav-battle">
        <!-- TODO: 이미지 교체 → assets/nav_battle.png -->
        <span class="nav-item__icon" data-img="nav_battle">⚔</span>
      </button>
      <button class="nav-item" data-click="nav-territory">
        <!-- TODO: 이미지 교체 → assets/nav_territory.png -->
        <span class="nav-item__icon" data-img="nav_territory">🏯</span>
        <span class="nav-item__label">영지</span>
      </button>
      <button class="nav-item" data-click="nav-bag">
        <!-- TODO: 이미지 교체 → assets/nav_bag.png -->
        <span class="nav-item__icon" data-img="nav_bag">💼</span>
        <span class="nav-item__label">가방</span>
      </button>
    </nav>

    <!-- 토스트 메시지 (JS에서 띄움) -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
