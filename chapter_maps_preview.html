<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter Maps Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #15110d;
      color: #f4dfb4;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 18px;
      background: rgba(21, 17, 13, 0.94);
      border-bottom: 1px solid rgba(244, 223, 180, 0.18);
    }
    h1 {
      margin: 0;
      font-size: 18px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    figure {
      margin: 0;
      min-width: 0;
      background: #211913;
      border: 1px solid rgba(244, 223, 180, 0.16);
      border-radius: 8px;
      overflow: hidden;
    }
    figcaption {
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #0d0a07;
    }
  </style>
</head>
<body>
  <header>
    <h1>챕터 맵 PNG 미리보기</h1>
  </header>
  <main>
    <figure>
      <figcaption>Chapter 1</figcaption>
      <img src="./assets/maps/chapter1.png" alt="Chapter 1 map">
    </figure>
    <figure>
      <figcaption>Chapter 2</figcaption>
      <img src="./assets/maps/chapter2.png" alt="Chapter 2 map">
    </figure>
    <figure>
      <figcaption>Chapter 3</figcaption>
      <img src="./assets/maps/chapter3.png" alt="Chapter 3 map">
    </figure>
    <figure>
      <figcaption>Chapter 4</figcaption>
      <img src="./assets/maps/chapter4.png" alt="Chapter 4 map">
    </figure>
    <figure>
      <figcaption>Chapter 5</figcaption>
      <img src="./assets/maps/chapter5.png" alt="Chapter 5 map">
    </figure>
    <figure>
      <figcaption>Chapter 6</figcaption>
      <img src="./assets/maps/chapter6.png" alt="Chapter 6 map">
    </figure>
    <figure>
      <figcaption>Chapter 7</figcaption>
      <img src="./assets/maps/chapter7.png" alt="Chapter 7 map">
    </figure>
    <figure>
      <figcaption>Chapter 8</figcaption>
      <img src="./assets/maps/chapter8.png" alt="Chapter 8 map">
    </figure>
    <figure>
      <figcaption>Chapter 9</figcaption>
      <img src="./assets/maps/chapter9.png" alt="Chapter 9 map">
    </figure>
    <figure>
      <figcaption>Chapter 10</figcaption>
      <img src="./assets/maps/chapter10.png" alt="Chapter 10 map">
    </figure>
  </main>
</body>
</html>
