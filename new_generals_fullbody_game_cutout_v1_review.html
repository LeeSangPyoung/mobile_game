<style>
* { box-sizing:border-box; }
:root {
  color-scheme:dark;
  --bg:#11100d;
  --panel:#1f1a14;
  --line:rgba(244,223,184,.18);
  --gold:#ffd36a;
  --text:#f4dfb8;
  --muted:#baa886;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:3;
  padding:15px 20px 13px;
  background:rgba(17,16,13,.95);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
h1 {
  margin:0;
  font-size:21px;
  line-height:1.2;
}
.note {
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
}
main { padding:18px 20px 30px; }
.review {
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:var(--panel);
}
.review + .review { margin-top:18px; }
.stage {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:1px;
  background:var(--line);
}
.slot {
  position:relative;
  min-height:560px;
  aspect-ratio:2/3;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}
.slot img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}
.original img { object-fit:cover; object-position:center 45%; }
.dark { background:#070706; }
.light { background:#e8dfcf; }
.checker {
  background-color:#2f2f2f;
  background-image:
    linear-gradient(45deg,#444 25%,transparent 25%),
    linear-gradient(-45deg,#444 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#444 75%),
    linear-gradient(-45deg,transparent 75%,#444 75%);
  background-size:28px 28px;
  background-position:0 0,0 14px,14px -14px,-14px 0;
}
.game {
  background:
    linear-gradient(180deg,rgba(5,10,18,.18),rgba(0,0,0,.58)),
    radial-gradient(circle at 50% 82%,rgba(255,211,106,.22),transparent 34%),
    linear-gradient(135deg,#223022,#161920 46%,#2a1d16);
}
.badge {
  position:absolute;
  left:10px;
  top:10px;
  z-index:1;
  padding:4px 8px;
  border-radius:6px;
  background:rgba(13,9,6,.78);
  border:1px solid rgba(255,211,106,.32);
  color:var(--gold);
  font-size:12px;
  font-weight:850;
}
.meta {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:14px;
  padding:11px 13px 13px;
}
.name {
  margin:0;
  font-size:17px;
  font-weight:850;
}
.paths {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
a {
  color:var(--gold);
  font-size:11px;
  line-height:1.35;
  text-decoration:none;
  overflow-wrap:anywhere;
}
a:hover { text-decoration:underline; }
@media (max-width:1100px) {
  .stage { grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width:620px) {
  header { padding:13px 12px 11px; }
  main { padding:12px; }
  .stage { grid-template-columns:1fr; }
  .slot { min-height:480px; }
  .meta { display:block; }
  .paths { justify-content:flex-start; margin-top:7px; }
}
</style>
</head>
