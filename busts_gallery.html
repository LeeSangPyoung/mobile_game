<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>장수 전신 갤러리</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    background: #17110b;
    color: #f7d56e;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  h1 {
    margin: 0 0 8px;
    font-size: 30px;
  }
  .sub {
    margin: 0 0 22px;
    color: #c5a86b;
    font-size: 15px;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 0 16px;
    background: linear-gradient(180deg, #17110b 70%, rgba(23,17,11,0));
  }
  input {
    width: min(420px, 100%);
    height: 40px;
    padding: 0 14px;
    border: 1px solid #7b5724;
    border-radius: 8px;
    background: #24190f;
    color: #ffe188;
    font-size: 15px;
    outline: none;
  }
  .count {
    color: #a98a50;
    font-size: 14px;
    white-space: nowrap;
  }
  .audit {
    margin-left: auto;
    color: #d2b36b;
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
  }
  .audit.ok { color: #8fd48a; }
  .audit.bad { color: #ff8f75; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }
  .card {
    min-width: 0;
    border: 1px solid #79551f;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(180deg, #24190f, #110b07);
  }
  .name {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 11px 12px;
    border-bottom: 1px solid #664719;
    color: #ffe188;
    font-size: 17px;
    font-weight: 800;
  }
  .name small {
    min-width: 0;
    color: #a98a50;
    font-size: 12px;
    font-weight: 700;
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .art {
    height: 330px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 14px;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(circle at 50% 18%, rgba(255,212,91,0.16), transparent 44%),
      #21170e;
    background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%;
  }
  img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,0.62));
  }
  .file {
    padding: 8px 10px 10px;
    border-top: 1px solid #3d2a12;
    color: #f7d56e;
    font-size: 12px;
    word-break: break-all;
  }
  .missing .art {
    align-items: center;
    color: #ff9a7a;
    font-size: 13px;
    font-weight: 800;
  }
  .missing .file {
    color: #ff9a7a;
  }
  @media (max-width: 720px) {
    body { padding: 18px; }
    h1 { font-size: 24px; }
    .toolbar {
      align-items: flex-start;
      flex-direction: column;
    }
    .audit { margin-left: 0; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
    .art { height: 260px; }
  }
</style>
</head>
<body>
<h1>장수 전신 갤러리</h1>
<p class="sub">battle_faces_gallery.html의 장수 목록에서 전신 이미지만 모아 봅니다.</p>
<div class="toolbar">
  <input id="search" type="search" placeholder="이름 또는 파일명 검색">
  <div class="count" id="count"></div>
  <div class="audit" id="audit">검수 중...</div>
</div>
<main class="grid" id="grid"></main>

<script>
const generals = [
  ['cao_cao', '조조'],
  ['cao_xing', '조흥'],
  ['dian_wei', '전위'],
  ['dong_zhuo', '동탁'],
  ['gan_ning', '감녕'],
  ['guan_yu', '관우'],
  ['guo_jia', '곽가'],
  ['huang_gai', '황개'],
  ['huang_zhong', '황충'],
  ['liu_bei', '유비'],
  ['lu_bu', '여포'],
  ['lu_xun', '육손'],
  ['ma_chao', '마초'],
  ['meng_huo', '맹획'],
  ['pang_tong', '방통'],
  ['sima_yi', '사마의'],
  ['sun_ce', '손책'],
  ['sun_quan', '손권'],
  ['taishi_ci', '태사자'],
  ['wen_chou', '문추'],
  ['xiahou_dun', '하후돈'],
  ['xu_chu', '허저'],
  ['xu_huang', '서황'],
  ['yan_liang', '안량'],
  ['yuan_shao', '원소'],
  ['zhang_fei', '장비'],
  ['zhang_liao', '장료'],
  ['zhao_yun', '조운'],
  ['zhou_yu', '주유'],
  ['zhuge_liang', '제갈량'],
];

const grid = document.getElementById('grid');
const count = document.getElementById('count');
const search = document.getElementById('search');
const audit = document.getElementById('audit');
let loaded = 0;
let failed = 0;

function card([id, name]) {
  const file = `${id}.png`;
  const card = document.createElement('section');
  card.className = 'card';
  card.dataset.key = `${id} ${name}`.toLowerCase();
  card.innerHTML = `
    <div class="name">
      <span>${name}</span>
      <small>${file}</small>
    </div>
    <div class="art"><img src="assets/generals/busts/${file}" alt="${name} 전신"></div>
    <div class="file">busts/${file}</div>
  `;
  return card;
}

const cards = generals.map(card);
cards.forEach(card => grid.appendChild(card));

function updateAudit() {
  const checked = loaded + failed;
  audit.textContent = failed
    ? `이미지 ${checked}/${generals.length}, 누락 ${failed}`
    : `이미지 ${checked}/${generals.length}`;
  audit.className = `audit ${checked === generals.length && !failed ? 'ok' : failed ? 'bad' : ''}`;
}

grid.querySelectorAll('img').forEach(img => {
  img.addEventListener('load', () => {
    loaded++;
    updateAudit();
  });
  img.addEventListener('error', () => {
    failed++;
    const card = img.closest('.card');
    card.classList.add('missing');
    img.closest('.art').textContent = '이미지 누락';
    updateAudit();
  });
});
updateAudit();

function filterCards() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  cards.forEach(card => {
    const ok = !q || card.dataset.key.includes(q);
    card.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  count.textContent = `${shown} / ${generals.length}`;
}

search.addEventListener('input', filterCards);
filterCards();
</script>
</body>
</html>
