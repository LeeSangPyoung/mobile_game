<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>새 파이널 반신 게임용 컷아웃 샘플</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg: #120f0b;
  --panel: #211913;
  --line: rgba(244,223,184,.18);
  --gold: #ffd36a;
  --text: #f4dfb8;
  --muted: #bfa986;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
header {
  position: sticky;
  top: 0;
  z-index: 2;
  padding: 16px 20px 13px;
  background: rgba(18,15,11,.94);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(10px);
}
h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 850;
  letter-spacing: 0;
}
.note {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.45;
}
main { padding: 18px 20px 30px; }
.sheet {
  display: block;
  width: min(100%, 1300px);
  margin: 0 auto 18px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #18120d;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
article {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
}
.art {
  position: relative;
  display: grid;
  place-items: end center;
  aspect-ratio: 4 / 3;
  overflow: hidden;
  background: url("./assets/battle/bg_battle_01_grass.jpg") center / cover no-repeat;
}
.art img {
  display: block;
  width: 108%;
  max-width: none;
  max-height: 120%;
  object-fit: contain;
  object-position: center bottom;
}
.meta { padding: 10px 11px 12px; }
.name {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin: 0;
  font-size: 16px;
  font-weight: 850;
}
.name small {
  color: #9e8a67;
  font-size: 11px;
  font-weight: 750;
}
@media (max-width: 720px) {
  main { padding: 12px; }
  header { padding: 14px 12px 12px; }
}
</style>
</head>
<body>
<header>
  <h1>새 파이널 반신 게임용 컷아웃 샘플</h1>
  <div class="note">기준: new_generals_halfbody_recovered_200_v6_progress.html의 새 파이널 반신. 배경/불꽃 제거 후 실제 전투 배경 위 합성.</div>
</header>
<main>
  <img class="sheet" src="./assets/generals/new_characters/upper_body_200_redraw_v6_game_cutout_sample/game_cutout_sample_contact_sheet.png" alt="게임용 컷아웃 샘플 컨택트시트">
  <section id="grid" class="grid"></section>
</main>
<script>
const items = [
  ["liu_bei", "유비"],
  ["guan_yu", "관우"],
  ["zhang_fei", "장비"],
  ["zhao_yun", "조운"],
  ["lu_bu", "여포"],
  ["cao_cao", "조조"],
  ["zhuge_liang", "제갈량"],
  ["sima_yi", "사마의"],
  ["sun_quan", "손권"],
  ["zhou_yu", "주유"]
];
const grid = document.getElementById("grid");
items.forEach(([id, ko]) => {
  const article = document.createElement("article");
  article.innerHTML = `
    <div class="art">
      <img src="./assets/generals/new_characters/upper_body_200_redraw_v6_game_cutout_sample/${id}_halfbody_game_cutout_v1.png" alt="${ko} 게임용 컷아웃">
    </div>
    <div class="meta">
      <p class="name"><span>${ko}</span><small>${id}</small></p>
    </div>
  `;
  grid.appendChild(article);
});
</script>
</body>
</html>
