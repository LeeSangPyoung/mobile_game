<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일기토 — 결투</title>
<!--
  duel_v2.html — 일기토 1:1 격투 액션 (신규, 기존 duel*.html 과 독립)

  기존안이 '장난' 처럼 보인 원인은 규칙이 아니라 프레이밍이었다.
  장수가 화면 높이의 15%짜리 콩알로 그려지면 창이 부딪혀도 무게가 안 실린다.
  그래서 이 버전의 1순위 설계는 카메라다:
    · 장수 키 = 화면 높이의 52~72% (기존 대비 3.5배)
    · 무대 폭을 좁혀(1400px) 항상 상대 사정거리 안 — 배회 구간 제거
    · 거리에 따라 줌이 붙었다 떨어지는 격투게임 카메라

  전투는 사무라이 쇼다운 계열의 '한 방이 무거운' 병기전:
    약베기 / 강베기 / 찌르기 3종 + 가드 + 저스트가드(패링) + 대시/백스텝 + 기력.
    같은 프레임에 서로의 칼이 닿으면 합(合) — 화면이 멎고 클로즈업이 들어간다.

  스프라이트는 assets/arcade_duel/* 재활용. 프레임 사각형 좌표는
  arcade_duel_test.html 에서 손으로 맞춘 값이라 그대로 가져왔다.
  화웅은 공격 시트가 없어 포즈 시트 프레임(2→3→4)을 조합해 공격을 만든다.
-->
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{
  --safe-b:env(safe-area-inset-bottom,0px);
  --gold:#ffd45c; --paper:#fff0b5; --ink:#0a0705;
  --u:1px;   /* 캔버스 1 설계px = 화면 몇 px 인가. JS 가 매 리사이즈마다 갱신 */
}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;
  background:#070503;color:#ffe9b0;font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
body{display:grid;place-items:stretch}

/* 세로 전용. 갤럭시(폭 360~412, 19.5:9~20:9)를 기준으로 잡되 고정 비율을 쓰지 않는다 —
   기기마다 비율이 달라서 aspect-ratio 를 박으면 어딘가에는 반드시 검은 여백이 생긴다.
   화면을 그대로 채우고, 캔버스 논리 해상도(H)를 화면 비율에 맞춰 JS 가 정한다. */
#wrap{position:relative;width:100vw;height:100dvh;max-width:min(100vw,560px);margin:0 auto;
  background:#000;overflow:hidden;box-shadow:0 0 0 2px #2a1c10}
#wrap:fullscreen{max-width:none}
canvas{display:block;width:100%;height:100%;touch-action:none;background:#120b06}

/* ── HUD ───────────────────────────────────────────────────────────
   --u = 캔버스 설계 해상도(960x540) 1px 이 실제 화면에서 차지하는 크기.
   HUD를 vw 로 잡으면 '넓고 낮은' 창(가로 모바일)에서 글자가 화면을 잡아먹는다.
   캔버스와 같은 단위를 쓰면 어떤 창 크기에서도 비율이 그대로 유지된다. */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10*var(--u)) calc(14*var(--u));z-index:5;pointer-events:none;
  display:grid;grid-template-columns:1fr auto 1fr;gap:calc(16*var(--u));align-items:start}
.side{min-width:0}
.nameRow{display:flex;align-items:baseline;gap:calc(8*var(--u));font-weight:900;
  text-shadow:calc(2*var(--u)) calc(2*var(--u)) 0 #000;margin-bottom:calc(4*var(--u))}
.side.r .nameRow{flex-direction:row-reverse}
.nameRow b{font-size:calc(19*var(--u));letter-spacing:calc(1*var(--u));color:#fff3c4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nameRow i{font-style:normal;font-size:calc(12*var(--u));color:#f0c05a}
.hpTrack{position:relative;height:calc(18*var(--u));padding:calc(2*var(--u));background:#0a0503;
  border:calc(2*var(--u)) solid #c9a86a;box-shadow:inset 0 2px 6px #000,0 2px 0 #000}
.hpLoss{position:absolute;inset:calc(2*var(--u));background:#e8563a;transition:width .45s ease .12s;width:100%}
.hpFill{position:absolute;inset:calc(2*var(--u));background:linear-gradient(#8fe87a,#2f8f45);transition:width .12s linear;width:100%}
.side.r .hpLoss,.side.r .hpFill{right:calc(2*var(--u));left:auto}
.side.r .hpFill{background:linear-gradient(#ffb257,#a8391f)}
.spTrack{height:calc(5*var(--u));margin-top:calc(3*var(--u));background:#0a0503;border:1px solid #6b5734}
.spFill{height:100%;width:100%;background:linear-gradient(90deg,#79d4ff,#f5e08a);transition:width .1s linear}
.side.r .spFill{margin-left:auto;background:linear-gradient(90deg,#f5e08a,#ff9a5c)}
.side.low .spFill{background:linear-gradient(90deg,#ff4a2c,#ff9a45)}

#center{display:grid;justify-items:center;gap:calc(2*var(--u));min-width:calc(88*var(--u));
  padding:calc(3*var(--u)) calc(8*var(--u)) calc(5*var(--u));
  background:#120a04d9;border:calc(2*var(--u)) solid #c9a86a;box-shadow:0 2px 0 #000}
#clock{font-size:calc(32*var(--u));font-weight:900;color:#fff1a8;text-shadow:2px 2px 0 #000;line-height:1}
#hapCount{font-size:calc(13*var(--u));font-weight:900;letter-spacing:calc(2*var(--u));color:#e8c268;text-shadow:1px 1px 0 #000}
#hapCount.flash{animation:hapPop .3s ease}
@keyframes hapPop{0%{transform:scale(1.5);color:#fff}100%{transform:scale(1);color:#e8c268}}

/* ── 중앙 배너(합/패링/KO) ─────────────────────────────────────── */
/* 배너는 인물 위가 아니라 인물보다 위쪽에 — 결정적 순간에 얼굴을 가리면 안 된다 */
#banner{position:absolute;left:0;right:0;top:19%;z-index:6;text-align:center;pointer-events:none;
  font-size:calc(58*var(--u));font-weight:900;letter-spacing:calc(8*var(--u));color:#fff3c4;opacity:0;
  text-shadow:0 0 18px #ff9a2e,4px 5px 0 #3a0f06,-2px -2px 0 #3a0f06,0 0 40px #000}
#banner.show{animation:bannerIn .8s cubic-bezier(.16,1,.3,1)}
@keyframes bannerIn{0%{opacity:0;transform:scale(2.4) rotate(-4deg)}22%{opacity:1;transform:scale(1) rotate(0)}
  72%{opacity:1}100%{opacity:0;transform:scale(1.08)}}

/* 개시 직후 몇 초만 뜨는 조작 안내 — 전투 중 화면에 설명이 하나도 없으면
   플레이어는 무엇을 하는 게임인지 모른 채 얻어맞기만 한다 */
/* 아래쪽 끝에 붙인다 — 위는 개시 배너("일기토")가 쓰고,
   조금만 올려도 서 있는 장수의 다리를 가린다 */
#tip{position:absolute;left:50%;top:calc(126*var(--u));transform:translateX(-50%);z-index:6;
  padding:calc(6*var(--u)) calc(14*var(--u));white-space:nowrap;pointer-events:none;
  background:#0a0604d0;border:calc(2*var(--u)) solid #8a6c3c;
  font-size:calc(14*var(--u));font-weight:900;color:#f0dcb4;text-shadow:1px 1px 0 #000;
  opacity:0;transition:opacity .5s ease}
#tip.show{opacity:1}
#tip b{color:var(--gold)}

/* ── 모바일 조작 패드 ──────────────────────────────────────────── */
/* 세로 배치: 결투 화면(위 60%) 아래의 빈 영역이 조작부다.
   가로일 때처럼 화면 맨 아래에만 붙이면 손가락이 캐릭터를 가린다. */
#pad{position:absolute;left:0;right:0;top:calc(var(--playh) * var(--u));bottom:0;z-index:7;
  padding:calc(14*var(--u)) calc(14*var(--u)) calc(14*var(--u) + var(--safe-b));
  display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#pad.hide{display:none}
.cluster{display:flex;gap:calc(12*var(--u));align-items:center;pointer-events:auto}
/* 공격군은 2×2. 세로 화면 폭(360px)에 버튼 6개를 한 줄로 놓으면 화면 밖으로 나간다. */
.cluster.acts{display:grid;grid-template-columns:repeat(2,auto);gap:calc(10*var(--u));
  justify-items:center;align-items:center}
/* 이동은 십자. 앞뒤(◀▶)에 깊이(▲▼)가 더해져 축이 둘이 된다. */
.cluster.moves{display:grid;grid-template-columns:repeat(3,auto);gap:calc(6*var(--u));
  justify-items:center;align-items:center}
.cluster.moves .up{grid-column:2;grid-row:1}
.cluster.moves .dn{grid-column:2;grid-row:3}
.cluster.moves [data-act="left"]{grid-column:1;grid-row:2}
.cluster.moves [data-act="right"]{grid-column:3;grid-row:2}
.btn{display:grid;place-items:center;border-radius:50%;border:calc(3*var(--u)) solid #ffe8a8;
  background:radial-gradient(circle at 35% 30%,#5b3a1b,#241206);color:#ffe9b0;
  font-weight:900;text-shadow:1px 1px 0 #000;box-shadow:0 4px 0 #0009,inset 0 2px 6px #ffdca033;
  /* 터치 타깃은 --u 로만 줄이면 작은 폰에서 못 누른다 — 56px 하한을 둔다(세로는 자리가 있다) */
  width:max(52px,calc(70*var(--u)));height:max(52px,calc(70*var(--u)));font-size:max(11px,calc(13*var(--u)));
  white-space:nowrap;letter-spacing:-.5px;line-height:1}
.btn:active,.btn.on{transform:translateY(3px);box-shadow:0 1px 0 #0009;background:radial-gradient(circle at 35% 30%,#9c6a2a,#3d2109)}
.btn.big{width:max(60px,calc(82*var(--u)));height:max(60px,calc(82*var(--u)));font-size:max(12px,calc(15*var(--u)))}
.btn.mv{border-color:#a8c8ff;background:radial-gradient(circle at 35% 30%,#1e3a63,#0a1526)}
.btn.mv:active,.btn.mv.on{background:radial-gradient(circle at 35% 30%,#3c6ba8,#122642)}
.btn.gd{border-color:#9de2ff}
.btn.hv{border-color:#ff9a5c}

/* ── 오버레이(시작/결과) ───────────────────────────────────────── */
#overlay{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 45%,#1b0d05e0,#050302f2);overflow-y:auto}
#overlay[hidden]{display:none}
.card{width:min(460px,94%);padding:clamp(18px,3vw,28px);text-align:center;
  border:3px solid var(--gold);outline:3px solid #2a1608;
  background:linear-gradient(180deg,#3a1f0cf2,#14090392);box-shadow:0 18px 60px #000,inset 0 0 0 2px #ffd45c33}
.card h1{margin:0 0 6px;font-size:clamp(26px,5vw,40px);letter-spacing:10px;color:var(--gold);text-shadow:3px 4px 0 #000}
.card p{margin:0 0 16px;font-size:clamp(11px,1.7vw,14px);line-height:1.8;color:#f0dcb4;word-break:keep-all}
.vs{display:flex;justify-content:center;align-items:center;gap:14px;margin:0 0 16px;font-weight:900}
.vs .who{font-size:clamp(15px,2.6vw,21px);color:#fff3c4;text-shadow:2px 2px 0 #000}
.vs .who small{display:block;font-size:11px;color:#e0ac4e;letter-spacing:1px;margin-top:2px}
.vs .x{font-size:clamp(18px,3vw,26px);color:#c9503a;text-shadow:0 0 12px #ff5a2e}
.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pick{min-height:42px;padding:8px 16px;font:inherit;font-weight:900;cursor:pointer;
  border:2px solid #b99450;background:#20120699;color:#e8d3a4}
.pick.on{border-color:var(--gold);background:#7a4a12;color:#fff6d2;box-shadow:0 0 14px #ffb43a66}
.go{min-height:52px;padding:12px 34px;font:inherit;font-size:clamp(14px,2.2vw,18px);font-weight:900;cursor:pointer;
  border:3px solid #fff0ad;background:linear-gradient(#e8ab2c,#a86a10);color:#2a1200;
  box-shadow:0 5px 0 #4a2a06,0 10px 26px #000a;letter-spacing:4px}
.go:active{transform:translateY(4px);box-shadow:0 1px 0 #4a2a06}
.go:disabled{cursor:progress;filter:grayscale(.7) brightness(.62);letter-spacing:1px}
.go:disabled:active{transform:none;box-shadow:0 5px 0 #4a2a06,0 10px 26px #000a}
.go:focus-visible,.pick:focus-visible{outline:3px solid #9de2ff;outline-offset:3px}
#pickWrap{display:grid;gap:8px;margin:14px 0 4px}
.pickRow{display:flex;align-items:center;gap:10px;justify-content:center}
.pickRow span{width:56px;text-align:right;color:#c9a86a;font-size:13px;font-weight:800}
.pickRow select{flex:0 1 180px;font:inherit;font-weight:700;padding:7px 10px;border-radius:6px;
  border:2px solid #6b4f26;background:#241809;color:#f0dcb4}
.keys{margin-top:14px;font-size:clamp(10px,1.5vw,12px);color:#b79a6d;line-height:1.9}
.keys b{color:#ffd45c}

/* ── 우상단 유틸 ───────────────────────────────────────────────── */
#util{position:absolute;right:10px;top:calc(10px + clamp(46px,8vw,64px));z-index:6;display:flex;gap:6px}
#util button{width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:15px;
  border:2px solid #9de2ff;background:#0a1a2ecc;color:#dff1ff}
/* 세로 전용: 결투 영역 오른쪽 위. 하단 중앙은 조작 버튼이 쓴다. */
#util{right:calc(10*var(--u));top:calc(74*var(--u))}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="540" height="1170" aria-label="일기토 결투 화면"></canvas>

  <div id="hud">
    <div class="side l" id="sideL">
      <div class="nameRow"><b id="nameL">조운</b><i id="warL">무력 96</i></div>
      <div class="hpTrack"><div class="hpLoss" id="hpLossL"></div><div class="hpFill" id="hpL"></div></div>
      <div class="spTrack"><div class="spFill" id="spL"></div></div>
    </div>
    <div id="center"><div id="clock">60</div><div id="hapCount">0 합</div></div>
    <div class="side r" id="sideR">
      <div class="nameRow"><b id="nameR">화웅</b><i id="warR">무력 88</i></div>
      <div class="hpTrack"><div class="hpLoss" id="hpLossR"></div><div class="hpFill" id="hpR"></div></div>
      <div class="spTrack"><div class="spFill" id="spR"></div></div>
    </div>
  </div>

  <div id="util"><button id="dummyBtn" aria-label="상대 정지" title="상대 정지(허수아비)">🧍</button><button id="muteBtn" aria-label="소리 끄기" title="소리">🔊</button>
    <button id="btnPause" title="일시정지" aria-label="일시정지">❚❚</button>
    <button id="btnFull" title="전체화면" aria-label="전체화면">⛶</button>
  </div>

  <div id="banner" aria-live="polite"></div>
  <div id="tip"></div>

  <div id="pad">
    <div class="cluster moves">
      <button class="btn mv up" data-act="up" aria-label="안쪽으로">▲</button>
      <button class="btn mv" data-act="left" aria-label="왼쪽">◀</button>
      <button class="btn mv" data-act="right" aria-label="오른쪽">▶</button>
      <button class="btn mv dn" data-act="down" aria-label="앞쪽으로">▼</button>
    </div>
    <div class="cluster acts">
      <button class="btn gd" data-act="guard" aria-label="가드">가드</button>
      <button class="btn" data-act="thrust" aria-label="찌르기">찌르기</button>
      <button class="btn big" data-act="light" aria-label="베기">베기</button>
      <button class="btn big hv" data-act="heavy" aria-label="강베기">강베기</button>
    </div>
  </div>

  <div id="overlay">
    <div class="card">
      <h1 id="ovTitle">일 기 토</h1>
      <div class="vs" id="ovVs">
        <div class="who">조운<small>무력 96</small></div>
        <div class="x">⚔</div>
        <div class="who">화웅<small>무력 88</small></div>
      </div>
      <p id="ovText">칼이 맞부딪는 순간을 읽어라. 강베기는 무겁고 느리다.<br>막기 직전에 가드를 넣으면 <b>저스트가드</b> — 상대가 크게 흐트러진다.</p>
      <div class="row" id="ovDiff">
        <button class="pick" data-diff="easy">쉬움</button>
        <button class="pick on" data-diff="normal">보통</button>
        <button class="pick" data-diff="hard">어려움</button>
      </div>
      <div id="pickWrap">
        <div class="pickRow"><span>내 장수</span><select id="pickP"></select></div>
        <div class="pickRow"><span>상 대</span><select id="pickB"></select></div>
      </div>
      <button class="go" id="ovGo">결 투</button>
      <div class="keys">
        <b>← →</b> 걸음 · <b>← ←</b> 백스텝 · <b>Shift</b> 대시 · <b>↑ ↓</b> 비켜서기<br>
        <b>J</b> 베기 · <b>K</b> 강베기 · <b>L</b> 찌르기 · <b>S</b> 가드 · <b>Esc</b> 일시정지
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════════════════════
//  0. 상수 · 유틸
// ═══════════════════════════════════════════════════════════════════
// 세로 화면. 폭은 540 으로 고정하고 높이는 기기 비율을 따라간다
// (갤럭시 S23 360x780 → H≈1170, 큰 기종 412x915 → H≈1199).
// W 만 고정하면 UI 크기가 기기와 무관하게 일정하고, 남는 세로는 무대와 조작부가 나눠 갖는다.
const W = 540;
let H = 1170;                        // resizeCanvas() 가 매번 다시 잡는다
const GROUND = 430;                  // 월드 지면 y (발끝, z=0 기준)
// 깊이 축 — 오락실 벨트스크롤(천지를 먹다류)의 그 축이다.
// 앞뒤로만 움직이면 결투가 1차원 가위바위보가 된다. 위아래로 비켜설 수 있어야
// '돌아 들어가기 / 축 피하기'가 생기고, 세로 화면의 남는 공간도 그제서야 쓸모가 생긴다.
let Z_MAX = 108;                     // 무대 안쪽 끝 (0 = 화면 앞쪽) — 배경의 다리 폭에서 산출
let zRange = 108;                    // drawBackground 가 매 프레임 계산
// 132 로 잡았더니 캐릭터가 나무 무대를 벗어나 배경 원경 위에 섰다 —
// 먼 산 옆에 사람이 서니 거인처럼 보였다. 깊이는 '무대 안'에서만 움직여야 한다.
const Z_HIT = 34;                    // 이 이상 축이 어긋나면 공격이 빗나간다
const Z_PERSPECTIVE = 0.0013;        // 안쪽으로 갈수록 조금 작게 — 깊이가 읽히게
const STAGE_W = 900;                 // 무대 폭 — 세로는 화면이 좁다. 더 좁혀서 도망칠 곳을 없앤다

const PLAY_RATIO = 0.60;             // 화면 위 60% 가 결투, 아래 40% 가 조작부
const FPS = 60, DT = 1000 / FPS;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
// 깊이를 화면에 반영 — 안쪽(z 큼)일수록 위로 올라가고 살짝 작아진다
const footY = f => GROUND - f.z;
const zScale = f => 1 - f.z * Z_PERSPECTIVE;
const lerp = (a, b, t) => a + (b - a) * t;
const sign = v => v < 0 ? -1 : 1;

// 화면 비율에 맞춰 캔버스 논리 높이를 정한다. 기기마다 세로 비율이 달라서
// 고정 해상도를 쓰면 어딘가에는 검은 여백이 남는다.
function resizeCanvas() {
  const box = canvas.getBoundingClientRect();
  const ratio = (box.height || 1) / (box.width || 1);
  H = Math.round(clamp(W * ratio, 900, 1400));
  SCREEN_GROUND = Math.round(H * PLAY_RATIO);
  canvas.width = W; canvas.height = H;
}

const FULL_POSES = ['idle', 'walk1', 'walk2', 'walk3',
  'slash_windup', 'slash_impact', 'slash_recovery',
  'thrust_windup', 'thrust_impact', 'thrust_recovery',
  'heavy_windup', 'heavy_impact', 'heavy_recovery',
  'guard_ready', 'guard_just', 'hurt_light', 'hurt_heavy',
  'stunned', 'ko_fall', 'ko_down'];

async function loadGeneral(gid, side, opts = {}) {
  const dir = `./assets/arcade_duel/${gid}_states`;
  const pre = 'g' + gid.replace(/[^a-z]/g, '') + '_';
  await Promise.all(FULL_POSES.map(n => new Promise(res => {
    const img = new Image();
    img.onload = img.onerror = () => { A[pre + n] = img; res(); };
    img.src = `${dir}/${n}.webp?v=1`;
    POSE_KEY[pre + n] = n;
  })));
  POSE_SET[side] = {
    idle: pre + 'idle', walk: [pre + 'walk1', pre + 'walk2', pre + 'walk3'],
    guard: pre + 'guard_ready', guardJust: pre + 'guard_just',
    hurtL: pre + 'hurt_light', hurtH: pre + 'hurt_heavy', stunned: pre + 'stunned',
    koFall: pre + 'ko_fall', koDown: pre + 'ko_down',
    light: [pre + 'slash_windup', pre + 'slash_impact', pre + 'slash_recovery'],
    thrust: [pre + 'thrust_windup', pre + 'thrust_impact', pre + 'thrust_recovery'],
    heavy: [pre + 'heavy_windup', pre + 'heavy_impact', pre + 'heavy_recovery'],
  };
  // 창끝 좌표와 실측 몸높이 — 빼먹으면 아우라가 허공에서 나고 덩치가 어긋난다
  try {
    const j = await (await fetch(`${dir}/poses.json?v=1`)).json();
    for (const k in (j.poses || {})) POSE_TIP[pre.charAt(0) + gid + ':' + k] = j.poses[k];
    if (j.bodyH) POSE_BODY_H[side] = j.bodyH;
    TIP_NS[side] = pre.charAt(0) + gid;
  } catch (e) { console.warn(gid + ' 좌표 로드 실패', e); }
  CHAR_SIZE[side] = opts.size || 1.0;
  CHAR_FEET[side] = opts.feet || { cx: STATE_CX, w: 320 };
  return true;
}

    hurt:   { img: 'bHurt', fw: 682, f: [[61,148,571,502,-8,28],[41,143,641,535,-14,0],[0,207,645,469,12,2]] },
    stun:   { img: 'bStun', fw: 682, f: [[80,109,596,545,-20,5],[44,177,553,482,12,0],[12,118,588,537,22,4]] },
  },
};

// 에셋 총량이 11MB대다. 진행 표시 없이 받으면 첫 방문자는 검은 화면만 본다.
// 게다가 전부 기다릴 이유가 없다 — 배경과 양쪽 포즈 시트(3.4MB)만 있으면 결투는 성립하고,
// 상태 포즈는 뒤에서 계속 받는다 — 도착 전 상태는 그림자만 그린다.
const CORE_ASSETS = ['bg', 'pPose', 'bPose'];
let assetsReady = false;
function loadAssets(keys, onProgress) {
  let done = 0;
  return new Promise(resolve => {
    keys.forEach(k => {
      const img = new Image();
      A[k] = img;
      const tick = () => {
        done++;
        onProgress?.(done / keys.length);
        if (done === keys.length) resolve();
      };
      img.onload = tick;
      img.onerror = tick;   // 하나 빠져도 결투는 계속된다(해당 모션만 포즈 시트로 대체)
      img.src = ASSET_SRC[k];
    });
  });
}
const ready = img => !!(img && img.complete && img.naturalWidth);

// ═══════════════════════════════════════════════════════════════════
//  2. 기술표 — 프레임 단위(60fps). 여기 숫자가 곧 손맛이다.
//     startup: 칼이 나가기까지 / active: 판정 / recovery: 후딜
// ═══════════════════════════════════════════════════════════════════
// 사정거리는 '중심 간 거리' 기준. 두 장수가 겹치지 않는 최소 간격(SEPARATE=205)이 하한이라
// 어떤 기술도 그보다 짧으면 영영 닿지 않는다 — 아래 값은 전부 그 위에서 잡았다.
const MOVES = {
  light:  { startup: 8,  active: 4, recovery: 13, dmg: 9,  reach: 240, push: 5,  stam: 8,
            label: '베기',   guardChip: 1.5, stunAdd: 6,  sheet: 'light',  arc: 'wide'  },
  thrust: { startup: 13, active: 5, recovery: 19, dmg: 14, reach: 310, push: 9,  stam: 14,
            label: '찌르기', guardChip: 3,   stunAdd: 10, sheet: 'thrust', arc: 'line'  },
  heavy:  { startup: 21, active: 6, recovery: 26, dmg: 24, reach: 262, push: 22, stam: 24,
            label: '강베기', guardChip: 9,   stunAdd: 22, sheet: 'heavy',  arc: 'heavy',
            crush: true },   // 가드해도 기력을 크게 깎는다 — 계속 막기만 하면 무너진다
};
const GUARD_JUST = 6;        // 가드 입력 후 이 프레임 안에 맞으면 저스트가드
const STUN_MAX = 100;        // 경직 게이지. 꽉 차면 무방비 — 확정타 기회

const DIFF = {
  easy:   { label:'쉬움',   dmgOut:1.15, dmgIn:0.78, react:22, aggro:0.42, guard:0.55, parry:0.06 },
  normal: { label:'보통',   dmgOut:1.00, dmgIn:1.00, react:15, aggro:0.62, guard:0.72, parry:0.16 },
  hard:   { label:'어려움', dmgOut:0.88, dmgIn:1.20, react:10, aggro:0.80, guard:0.86, parry:0.30 },
};
let diff = DIFF.normal;

// 상대를 허수아비로 세워두는 디버그 스위치. 주소에 ?dummy=1 (또는 2) 을 붙이면 켜진다.
// 콘솔에서 DUMMY 를 바꿔도 즉시 먹는다.
let DUMMY = +(new URLSearchParams(location.search).get('dummy') || 0);
window.setDummy = v => { DUMMY = +v || 0; return DUMMY; };

// ═══════════════════════════════════════════════════════════════════
//  3. 파이터
// ═══════════════════════════════════════════════════════════════════
function makeFighter(kind, opts) {
  return {
    kind, name: opts.name, war: opts.war,
    x: opts.x, dir: opts.dir,
    z: opts.z ?? Z_MAX * 0.5,   // 깊이. 0=앞, Z_MAX=안쪽
    vz: 0,
    hp: opts.hp, maxHp: opts.hp,
    stam: 100, maxStam: 100,
    vx: 0,
    state: 'idle',      // idle walk dash backstep windup active recover guard hurt stunned ko
    st: 0,              // 현재 상태 경과 프레임
    move: null,         // 진행 중인 기술
    hitDone: false,
    guardHeld: false, guardT: 0,
    stun: 0, stunTimer: 0,
    inv: 0, hitFlash: 0,
    walkClock: 0,
    lean: 0,
    ai: { t: 0, plan: 'wait', react: 0 },
  };
}

let P, B;                     // player / boss
let cam = { x: STAGE_W / 2, zoom: 1, shakeX: 0, shakeY: 0, punch: 0 };
let frame = 0, hitStop = 0, slowmo = 0;
let hap = 0;                  // 합(合) — 칼이 실제로 맞부딪히거나 유효타가 난 횟수
let clockFrames = 60 * FPS;
let phase = 'title';          // title | fight | paused | over
let fx = [], dust = [];
let stats = { hits: 0, guards: 0, justs: 0, clashes: 0, taken: 0 };

// 선택한 장수 — 시작 화면에서 고른 값. 없으면 기본(조운·화웅).
const SIDE_INFO = {
  player: { name: '조운', war: 96, hp: 120 },
  boss:   { name: '화웅', war: 88, hp: 150 },
};

function resetMatch() {
  const pi = SIDE_INFO.player, bi = SIDE_INFO.boss;
  P = makeFighter('player', { name: pi.name, war: pi.war, x: STAGE_W / 2 - 190, dir: 1, hp: pi.hp });
  B = makeFighter('boss',   { name: bi.name, war: bi.war, x: STAGE_W / 2 + 190, dir: -1, hp: bi.hp });
  cam = { x: STAGE_W / 2, zoom: 1, shakeX: 0, shakeY: 0, punch: 0 };
  frame = 0; hitStop = 0; slowmo = 0; hap = 0; clockFrames = 60 * FPS;
  fx = []; dust = [];
  stats = { hits: 0, guards: 0, justs: 0, clashes: 0, taken: 0 };
  document.getElementById('nameL').textContent = P.name;
  document.getElementById('warL').textContent = '무력 ' + P.war;
  document.getElementById('nameR').textContent = B.name;
  document.getElementById('warR').textContent = '무력 ' + B.war;
  syncHud(true);
}

// 무력차는 데미지에 '은근히' 반영 — 조작으로 뒤집을 수 있는 폭으로만.
const warMul = (a, d) => Math.pow(a.war / d.war, 0.55);

const busy = f => f.state === 'windup' || f.state === 'active' || f.state === 'recover';
const helpless = f => f.state === 'hurt' || f.state === 'stunned' || f.state === 'ko';
const canAct = f => !busy(f) && !helpless(f) && f.state !== 'dash' && f.state !== 'backstep';

// ═══════════════════════════════════════════════════════════════════
//  4. 입력
// ═══════════════════════════════════════════════════════════════════
const keys = new Set();
const tapped = { left: 0, right: 0 };
const pad = { left: false, right: false, up: false, down: false, guard: false };
let bufAttack = null, bufFrames = 0;      // 선입력 버퍼 — 후딜 중에 눌러도 이어진다

const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyX: 'down',
  KeyS: 'guard',
  KeyJ: 'light', KeyK: 'heavy', KeyL: 'thrust',
  Space: 'light', ShiftLeft: 'dash', ShiftRight: 'dash',
};

addEventListener('keydown', e => {
  if (e.code === 'Escape') { togglePause(); e.preventDefault(); return; }
  const act = KEYMAP[e.code];
  if (!act) return;
  e.preventDefault();
  if (keys.has(e.code)) return;           // 리핏 무시
  keys.add(e.code);
  onPress(act);
});
addEventListener('keyup', e => { keys.delete(e.code); });

function onPress(act) {
  if (phase !== 'fight') return;
  if (act === 'left' || act === 'right') {
    // 같은 방향 두 번 = 대시(앞) / 뒤로 두 번 = 백스텝
    const now = frame;
    if (now - tapped[act] < 20) { startDash(P, act === 'left' ? -1 : 1); tapped[act] = -99; }
    else tapped[act] = now;
  } else if (act === 'dash') {
    startDash(P, P.dir);
  } else if (MOVES[act]) {
    bufAttack = act; bufFrames = 8;
  }
}

// 모바일 패드
document.querySelectorAll('#pad .btn').forEach(btn => {
  const act = btn.dataset.act;
  const down = e => {
    e.preventDefault(); btn.classList.add('on');
    if (act === 'left' || act === 'right') { pad[act] = true; onPress(act); }
    else if (act === 'up' || act === 'down') pad[act] = true;
    else if (act === 'guard') pad.guard = true;
    else onPress(act);
  };
  const up = e => {
    e.preventDefault(); btn.classList.remove('on');
    if (act === 'left' || act === 'right' || act === 'up' || act === 'down') pad[act] = false;
    else if (act === 'guard') pad.guard = false;
  };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up);
  btn.addEventListener('pointercancel', up);
  btn.addEventListener('pointerleave', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
});

const held = act => {
  // 주의: ↓ 는 가드가 아니라 깊이(앞으로) 이동이다. 가드는 S / 패드 버튼.
  if (act === 'guard') return pad.guard || keys.has('KeyS');
  if (act === 'left') return pad.left || keys.has('ArrowLeft') || keys.has('KeyA');
  if (act === 'right') return pad.right || keys.has('ArrowRight') || keys.has('KeyD');
  if (act === 'up') return pad.up || keys.has('ArrowUp') || keys.has('KeyW');
  if (act === 'down') return pad.down || keys.has('ArrowDown') || keys.has('KeyX');
  return false;
};

// ═══════════════════════════════════════════════════════════════════
//  5. 행동
// ═══════════════════════════════════════════════════════════════════
function startMove(f, key) {
  const m = MOVES[key];
  snd('swing', key);
  if (!m || !canAct(f)) return false;
  if (f.stam < m.stam) { spendFail(f); return false; }
  f.stam -= m.stam;
  f.state = 'windup'; f.st = 0; f.move = m; f.moveKey = key; f.hitDone = false;
  return true;
}
function spendFail(f) {
  if (f === P) banner('기력 부족', '#ff8a5c', .5);
  puff(f.x, footY(f) - 40, 4, '#ff7a4a');
}
function startDash(f, dir) {
  snd('dash');
  if (!canAct(f) || f.stam < 12) return;
  f.stam -= 12;
  const back = dir !== f.dir;
  f.state = back ? 'backstep' : 'dash'; f.st = 0;
  f.vx = dir * (back ? 8.2 : 10.5);
  for (let i = 0; i < 6; i++) dust.push({ x: f.x, y: footY(f), vx: -dir * (1 + Math.random() * 3), vy: -Math.random() * 1.6, life: 22, r: 3 + Math.random() * 5 });
}

function faceEachOther() {
  if (!busy(P) && !helpless(P)) P.dir = sign(B.x - P.x);
  if (!busy(B) && !helpless(B)) B.dir = sign(P.x - B.x);
}

// ── 판정 ────────────────────────────────────────────────────────────
function activeNow(f) {
  return f.state === 'active' && !f.hitDone;
}
function inReach(att, def) {
  // 깊이가 어긋나면 헛친다 — 이게 있어야 '비켜서기'가 회피 수단이 된다
  if (Math.abs(att.z - def.z) > Z_HIT) return false;
  const dx = (def.x - att.x) * att.dir;
  return dx > 0 && dx <= att.move.reach;
}

function resolveCombat() {
  // 합(合) — 같은 프레임에 서로의 칼이 서로에게 닿으면 부딪힌다
  if (activeNow(P) && activeNow(B) && inReach(P, B) && inReach(B, P)) {
    clash();
    return;
  }
  if (activeNow(P) && inReach(P, B)) applyHit(P, B);
  if (activeNow(B) && inReach(B, P)) applyHit(B, P);
}

function clash() {
  snd('clash');
  P.hitDone = B.hitDone = true;
  P.state = 'recover'; P.st = 0; B.state = 'recover'; B.st = 0;
  P.vx = -P.dir * 7; B.vx = -B.dir * 7;
  const mx = (P.x + B.x) / 2;
  hitStop = 22; cam.punch = 1.0; shake(14);
  sparkBurst(mx, GROUND - 150, 26, '#fff6c8', 9);
  ring(mx, GROUND - 150, 200, '#ffe071');
  hap++; stats.clashes++;
  banner('合', '#fff3c4', 1);
  bumpHap();
}

function applyHit(att, def) {
  att.hitDone = true;
  const m = att.move;
  const hx = att.x + att.dir * (m.reach * 0.78);
  const hy = footY(def) - 165;

  if (def.inv > 0) return;

  // 저스트가드 — 가드를 '눌러둔' 게 아니라 '맞춰 넣은' 경우
  if (def.guardHeld && def.guardT <= GUARD_JUST && !helpless(def)) {
    stats.justs += def === P ? 1 : 0;
    att.state = 'stunned'; att.st = 0; att.stunTimer = 42;
    att.vx = -att.dir * 6;
    def.stam = Math.min(def.maxStam, def.stam + 14);
    hitStop = 18; cam.punch = .85; shake(11);
    sparkBurst(hx, hy, 22, '#9de2ff', 8);
    ring(hx, hy, 170, '#9de2ff');
    snd('just');
    banner(def === P ? '저스트가드!' : '흘렸다', '#9de2ff', .95);
    hap++; bumpHap();
    return;
  }

  // 일반 가드
  if (def.guardHeld && !helpless(def) && !busy(def)) {
    stats.guards += def === P ? 1 : 0;
    const chip = m.guardChip * (def === P ? diff.dmgIn : diff.dmgOut) * 0.6;
    def.hp -= chip;
    def.stam -= m.crush ? 34 : 12;
    def.vx = att.dir * m.push * 0.55;
    hitStop = m.crush ? 12 : 7; shake(m.crush ? 8 : 4);
    snd('guard', !!m.crush);
    sparkBurst(hx, hy, 12, '#cfe6ff', 5);
    if (def.stam <= 0) {                    // 가드 붕괴
      def.stam = 0;
      def.state = 'stunned'; def.st = 0; def.stunTimer = 48;
      def.guardHeld = false;
      snd('stun');
      banner('가드 붕괴!', '#ff9a3c', 1);
      shake(13); cam.punch = .8;
    }
    hap++; bumpHap();
    return;
  }

  // 유효타
  const mul = warMul(att, def) * (att === P ? diff.dmgOut : diff.dmgIn);
  const dmg = Math.max(3, Math.round(m.dmg * mul));
  def.hp -= dmg;
  if (def === P) stats.taken += dmg; else stats.hits++;
  def.vx = (DUMMY && def === B) ? 0 : att.dir * m.push;
  def.state = 'hurt'; def.st = 0; def.inv = 10; def.hitFlash = 14;
  // 강타(가드크러시 기술)나 최대체력 12% 이상이면 크게 젖혀지는 피격 포즈
  def.hurtHeavy = !!m.crush || dmg >= def.maxHp * 0.12;
  def.stun = Math.min(STUN_MAX, def.stun + m.stunAdd);
  def.guardHeld = false;

  snd('hit', !!m.crush);
  hitStop = m.crush ? 16 : 10;
  cam.punch = m.crush ? .9 : .5;
  shake(m.crush ? 12 : 7);
  bloodBurst(hx, hy, m.crush ? 22 : 14);
  // 맞은 자리에서 빛이 터진다 — 히트스톱이 걸린 몇 프레임을 채워 준다
  fx.push({ t: 'burst', x: hx, y: hy, r: m.crush ? 150 : 96,
            life: m.crush ? 16 : 11, max: m.crush ? 16 : 11,
            color: (auraOf(att) || AURA.light).color });
  fx.push({ t: 'shock', x: hx, y: hy, r: m.crush ? 190 : 120,
            life: m.crush ? 22 : 15, max: m.crush ? 22 : 15, dir: att.dir });
  slashArc(att.x + att.dir * 70, hy, att.dir, m.arc);   // 궤적은 '휘두른 사람' 기준
  damageNum(hx, hy - 74, dmg, m.crush);
  hap++; bumpHap();

  if (def.stun >= STUN_MAX) {               // 경직 만땅 → 무방비
    def.stun = 0;
    def.state = 'stunned'; def.st = 0; def.stunTimer = 70;
    snd('stun');
    banner('경직!', '#ffd45c', 1);
  }
  if (def.hp <= 0) knockOut(def);
}

function knockOut(f) {
  snd('ko');
  f.hp = 0; f.state = 'ko'; f.st = 0;
  phase = 'over';
  slowmo = 60; hitStop = 24; shake(20); cam.punch = 1.2;
  bloodBurst(f.x, footY(f) - 170, 34);
  setTimeout(() => showResult(f === B ? 'win' : 'lose'), 1700);
}

// ═══════════════════════════════════════════════════════════════════
//  6. 갱신
// ═══════════════════════════════════════════════════════════════════
function stepFighter(f) {
  f.st++;
  if (f.inv > 0) f.inv--;
  if (f.hitFlash > 0) f.hitFlash--;
  if (f.guardHeld) f.guardT++; else f.guardT = 0;

  // 기력 회복 — 공격/가드 중엔 거의 안 찬다
  const regen = busy(f) ? 0.05 : f.guardHeld ? 0.12 : helpless(f) ? 0.25 : 0.42;
  f.stam = clamp(f.stam + regen, 0, f.maxStam);
  f.stun = Math.max(0, f.stun - 0.14);

  switch (f.state) {
    case 'windup':
      if (f.st >= f.move.startup) {
        // 궤적은 '감았을 때의 칼끝'에서 시작한다 — 넘어가기 직전에 붙잡아 둔다
        f.swingFrom = tipOf(f);
        f.state = 'active'; f.st = 0;
      }
      break;
    case 'active':
      if (f.st >= f.move.active) { f.state = 'recover'; f.st = 0; }
      break;
    case 'recover':
      if (f.st >= f.move.recovery) { f.state = 'idle'; f.st = 0; f.move = null; }
      break;
    case 'dash':
    case 'backstep':
      if (f.st >= 13) { f.state = 'idle'; f.st = 0; }
      break;
    case 'hurt':
      // 20프레임(0.33초)은 피격 자세가 눈에 들어오기도 전에 끝난다.
      // 강타는 더 오래 젖혀져 있어야 '크게 맞았다'가 읽힌다.
      if (f.st >= (f.hurtHeavy ? 27 : 18)) { f.state = 'idle'; f.st = 0; }
      break;
    case 'stunned':
      if (f.st >= f.stunTimer) { f.state = 'idle'; f.st = 0; }
      break;
  }

  // 물리 — 지면 마찰
  if (busy(f) || helpless(f)) f.vz *= 0.5;      // 공격·피격 중엔 축을 못 바꾼다
  f.z = clamp(f.z + f.vz, 0, Z_MAX);
  f.x += f.vx;
  f.vx *= (f.state === 'dash' || f.state === 'backstep') ? 0.90 : 0.80;
  if (Math.abs(f.vx) < 0.05) f.vx = 0;
  f.x = clamp(f.x, 60, STAGE_W - 60);
  f.lean = lerp(f.lean, clamp(f.vx * 0.6, -6, 6), 0.2);
  // 보폭 누적 — 실제로 움직인 만큼만 다리가 움직여야 발이 안 미끄러진다
  const before = f.gait || 0;
  // 앞뒤(vx)만 세면 위아래로만 움직일 때 다리가 멈춘 채 몸만 미끄러진다.
  // 실제 이동 거리로 재야 어느 방향으로 가든 걸음이 붙는다.
  f.gait = before + Math.hypot(f.vx, f.vz);
  // 한 걸음마다 발소리 + 흙먼지. 프레임마다 울리면 소음이 된다 — 보폭 단위로 끊는다.
  if (f.state === 'walk' && Math.floor(f.gait / 51) !== Math.floor(before / 51)) {
    snd('step');
    // 디딜 때마다 먼지가 인다. 없으면 지면을 밟는 게 아니라 떠다니는 것처럼 보인다.
    for (let i = 0; i < 3; i++) {
      dust.push({ x: f.x + (Math.random() - .5) * 26, y: footY(f) + 2,
                  vx: -sign(f.vx || f.dir) * (0.4 + Math.random()), vy: -Math.random() * 0.9,
                  life: 20, r: 2 + Math.random() * 4 });
    }
  }
}

// 몸 반경 — 체격에 비례한다. 예전엔 205 고정이었는데 캐릭터 크기를 바꾸면 어긋난다.
const bodyR = f => 74 * charScale(f);
// 무게 — 체격의 제곱. 큰 쪽이 덜 밀린다. 화웅에게 밀려나는 게 몸으로 느껴져야 한다.
const mass = f => Math.pow(charScale(f), 2);

function separate() {
  if (Math.abs(P.z - B.z) > Z_HIT * 1.4) { P.contact = B.contact = 0; return; }  // 다른 축이면 지나친다
  const d = B.x - P.x, min = bodyR(P) + bodyR(B);
  const overlap = min - Math.abs(d);
  if (overlap <= 0) { P.contact = B.contact = 0; return; }

  const dir = sign(d || 1);
  // 무게 비율로 나눠 민다 — 반씩 밀면 덩치 차이가 안 느껴진다
  const mP = mass(P), mB = mass(B), tot = mP + mB;
  // 한 번에 다 떼지 않고 스프링처럼 밀어낸다. 즉시 분리하면 '순간이동'처럼 보인다.
  const push = Math.min(overlap, 6) * 0.55;
  if (!DUMMY) {
    P.x -= push * (mB / tot) * dir;
    B.x += push * (mP / tot) * dir;
  } else {
    P.x -= push * dir;                       // 허수아비는 안 밀린다
  }
  P.x = clamp(P.x, 60, STAGE_W - 60); B.x = clamp(B.x, 60, STAGE_W - 60);

  // 밀고 들어가는 쪽은 속도가 죽는다 — 벽을 미는 저항감
  if (sign(P.vx) === dir) P.vx *= 0.45;
  if (sign(B.vx) === -dir) B.vx *= 0.45;

  // 접촉 연출 — 처음 닿는 순간에만 소리·먼지, 이후엔 비비는 느낌만 남긴다
  const first = !P.contact;
  P.contact = B.contact = Math.min(1, (P.contact || 0) + 0.25);
  if (first) {
    snd('bump');
    shake(3);
    const cx = (P.x + B.x) / 2;
    for (let i = 0; i < 5; i++)
      dust.push({ x: cx + (Math.random() - .5) * 30, y: footY(P) + 2,
                  vx: (Math.random() - .5) * 2.4, vy: -Math.random() * 1.4,
                  life: 24, r: 3 + Math.random() * 5 });
  } else if (frame % 7 === 0 && (Math.abs(P.vx) > 0.6 || Math.abs(B.vx) > 0.6)) {
    snd('scrape');
    dust.push({ x: (P.x + B.x) / 2, y: footY(P) + 2,
                vx: (Math.random() - .5) * 1.6, vy: -Math.random() * .8,
                life: 16, r: 2 + Math.random() * 3 });
  }
}

function updatePlayer() {
  P.guardHeld = held('guard') && canAct(P);
  if (!P.guardHeld) P.guardT = 0;

  if (bufFrames > 0) {
    bufFrames--;
    if (canAct(P) && startMove(P, bufAttack)) { bufAttack = null; bufFrames = 0; }
  }

  if (canAct(P) && !P.guardHeld) {
    // 깊이 이동 — 앞뒤(x)보다 조금 느리게. 너무 빠르면 축 피하기가 만능이 된다.
    const u = held('up'), dn = held('down');
    const movingZ = u !== dn;
    if (movingZ) P.vz = lerp(P.vz, (u ? 1 : -1) * 2.4, 0.35);
    else P.vz = lerp(P.vz, 0, 0.3);

    const l = held('left'), r = held('right');
    const movingX = l !== r;
    if (movingX) {
      const dir = l ? -1 : 1;
      const forward = dir === P.dir;
      P.vx = dir * (forward ? 3.4 : 2.6);   // 뒷걸음은 조금 느리다
    }
    // 걷는 상태는 **두 축을 합쳐서** 판정한다. 앞뒤만 보면 위아래로만 움직일 때
    // 상태가 idle 로 되돌아가 다리가 멈춘 채 몸만 미끄러진다.
    if (movingX || movingZ) { P.state = 'walk'; P.walkClock++; }
    else if (P.state === 'walk') { P.state = 'idle'; P.st = 0; }
  } else if (P.state === 'walk') P.state = 'idle';
}

// ── AI: 거리 관리 → 견제 → 후딜 처벌 ───────────────────────────────
function updateAI() {
  const ai = B.ai;
  const dist = Math.abs(P.x - B.x);
  B.guardHeld = false;

  if (helpless(B) || busy(B) || B.state === 'dash' || B.state === 'backstep') { ai.t++; return; }
  ai.t++;

  // 디버그: 상대를 가만히 세워둔다. 내 동작만 천천히 보고 싶을 때.
  //   ?dummy=1  가만히 서 있기만 (공격·이동 없음)
  //   ?dummy=2  거리는 유지하되 공격은 안 함
  if (DUMMY) {
    B.vz = 0;
    if (DUMMY >= 2 && dist > MOVES.thrust.reach) { B.vx = B.dir * 2.6; B.state = 'walk'; B.walkClock++; }
    else { B.vx = 0; B.state = 'idle'; }
    return;
  }

  // 플레이어가 후딜에 걸렸다 → 확정 처벌
  if (P.state === 'recover' && dist < 300 && ai.react-- <= 0) {
    if (dist < MOVES.heavy.reach && B.stam > MOVES.heavy.stam && Math.random() < .55) { startMove(B, 'heavy'); return; }
    if (dist < MOVES.thrust.reach) { startMove(B, 'thrust'); return; }
  }
  // 플레이어가 무방비 → 강베기
  if (helpless(P) && dist < MOVES.heavy.reach + 30 && B.stam > MOVES.heavy.stam) { startMove(B, 'heavy'); return; }

  // 플레이어가 칼을 뽑았다 → 막거나 뺀다
  if (P.state === 'windup' && dist < 330) {
    if (ai.react > 0) { ai.react--; }
    else if (Math.random() < diff.guard) {
      B.guardHeld = true;
      if (B.guardT === 0) B.guardT = Math.random() < diff.parry ? 0 : GUARD_JUST + 4;  // 가끔 저스트가드
      B.guardT++;
      return;
    } else if (Math.random() < .25) { startDash(B, -B.dir); return; }
  }

  if (ai.t % 12 === 0) ai.react = diff.react + (Math.random() * 8 | 0);

  // 깊이 정렬 — 축이 어긋나면 아무리 붙어도 안 맞는다.
  // 무조건 즉시 정렬하면 '비켜서기'가 무의미해지므로, 난이도만큼만 빠르게 따라온다.
  const dz = P.z - B.z;
  if (Math.abs(dz) > Z_HIT * 0.55) {
    B.vz = lerp(B.vz, sign(dz) * (1.5 + diff.aggro * 1.3), 0.3);
    // 깊이로 움직이면 그것도 '걷는' 것이다. 이 표시를 빠뜨리면 대기 자세인 채로
    // 미끄러진다 — 다리가 멈춘 그림이 옆으로 이동만 하니 종잇장처럼 보인다.
    B.state = 'walk'; B.walkClock++;
    if (Math.abs(dz) > Z_HIT * 1.6) return;    // 많이 어긋났으면 접근보다 정렬이 먼저
  } else B.vz = lerp(B.vz, 0, 0.35);

  // 거리 관리 — '닿는 거리'가 기준이다.
  // 여유(margin)를 두는 이유: 판정은 active 프레임에 나는데 그 사이 상대가 움직인다.
  const MARGIN = 24;
  const canReach = k => dist <= MOVES[k].reach - MARGIN;
  const inPocket = dist <= MOVES.thrust.reach - MARGIN;   // 가장 긴 기술이 닿는 범위

  if (!inPocket) {
    // 아직 못 닿는다 → 붙는다. 멀면 대시로 거리를 지운다
    if (dist > 420 && B.stam > 22 && Math.random() < diff.aggro * .35) startDash(B, B.dir);
    else { B.vx = B.dir * 3.1; B.state = 'walk'; B.walkClock++; }
    return;
  }
  if (dist < 218) {                       // 너무 붙었다 → 도끼를 휘두를 공간을 만든다
    B.vx = -B.dir * 2.4; B.state = 'walk'; B.walkClock++;
    return;
  }
  // 닿는 거리 — 무엇으로 칠지는 거리가 정한다
  if (ai.t % 9 === 0 && Math.random() < diff.aggro) {
    const roll = Math.random();
    if (canReach('light') && roll < .42) startMove(B, 'light');
    else if (canReach('heavy') && roll < .74 && B.stam > MOVES.heavy.stam + 10) startMove(B, 'heavy');
    else if (canReach('thrust')) startMove(B, 'thrust');
    else if (canReach('light')) startMove(B, 'light');
  } else if (B.state === 'walk') { B.state = 'idle'; }
}

function updateCamera() {
  // 배경이 알려준 다리 폭으로 이동 범위를 맞춘다 — 튀지 않게 서서히
  Z_MAX = lerp(Z_MAX, zRange, 0.15);
  const mid = (P.x + B.x) / 2;
  const dist = Math.abs(P.x - B.x);
  // 가까울수록 당겨 붙는다 — 접근전이 곧 클로즈업.
  // 다만 격투게임은 '두 사람과 그 사이의 간격'이 같이 보여야 읽힌다.
  // 장수 키가 화면의 40%대(먼 거리 37% ~ 붙었을 때 47%)에 오도록 잡은 값.
  // 세로 화면은 가로가 540 뿐이다. '두 장수 + 그 사이'가 항상 들어오도록
  // 필요한 폭에서 역산한다 — 가로처럼 고정 계수로 잡으면 벌어졌을 때 화면 밖으로 나간다.
  let z = clamp(W / (dist + 360), 0.60, 1.15);
  if (hitStop > 0) z *= 1 + cam.punch * 0.05;
  cam.zoom = lerp(cam.zoom, z, 0.07);
  const half = W / (2 * cam.zoom);
  cam.x = lerp(cam.x, clamp(mid, half, STAGE_W - half), 0.10);
  cam.punch = Math.max(0, cam.punch - 0.06);
  cam.shakeX *= 0.86; cam.shakeY *= 0.86;
}
function shake(v) { cam.shakeX = v; cam.shakeY = v * 0.6; }

function update() {
  if (phase !== 'fight' && phase !== 'over') return;

  if (hitStop > 0) { hitStop--; updateCamera(); stepFx(); return; }

  frame++;
  if (phase === 'fight') {
    clockFrames--;
    if (clockFrames <= 0) { clockFrames = 0; timeUp(); return; }
    updatePlayer();
    updateAI();
  }
  faceEachOther();
  stepFighter(P); stepFighter(B);
  separate();
  if (phase === 'fight') resolveCombat();
  updateCamera();
  stepFx();
  syncHud(false);
}

function timeUp() {
  phase = 'over';
  const pr = P.hp / P.maxHp, br = B.hp / B.maxHp;
  banner('시간 종료', '#ffd45c', 1);
  setTimeout(() => showResult(pr > br ? 'win' : pr < br ? 'lose' : 'draw'), 1400);
}

// ═══════════════════════════════════════════════════════════════════
//  7. 이펙트
// ═══════════════════════════════════════════════════════════════════
function sparkBurst(x, y, n, color, speed) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = (0.4 + Math.random()) * speed;
    fx.push({ t: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 16 + Math.random() * 14, color });
  }
}
function bloodBurst(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.6, s = 2 + Math.random() * 7;
    fx.push({ t: 'blood', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 22 + Math.random() * 18, color: '#c22a1c' });
  }
}
function ring(x, y, r, color) { fx.push({ t: 'ring', x, y, r0: r * .25, r, life: 16, max: 16, color }); }
function slashArc(x, y, dir, kind) { fx.push({ t: 'arc', x, y, dir, kind, life: 12, max: 12 }); }
function damageNum(x, y, v, big) { fx.push({ t: 'num', x, y, v, big, life: 42, max: 42 }); }
function puff(x, y, n, color) { for (let i = 0; i < n; i++) fx.push({ t: 'spark', x, y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2, life: 18, color }); }

function stepFx() {
  for (let i = fx.length - 1; i >= 0; i--) {
    const p = fx[i];
    if (p.t === 'spark' || p.t === 'blood') { p.x += p.vx; p.y += p.vy; p.vy += p.t === 'blood' ? .42 : .18; p.vx *= .96; }
    if (p.t === 'num') p.y -= 1.1;
    if (--p.life <= 0) fx.splice(i, 1);
  }
  for (let i = dust.length - 1; i >= 0; i--) {
    const d = dust[i];
    d.x += d.vx; d.y += d.vy; d.vy += .06; d.vx *= .97;
    if (--d.life <= 0) dust.splice(i, 1);
  }
  if (fx.length > 320) fx.splice(0, fx.length - 320);
}

// ═══════════════════════════════════════════════════════════════════
//  8. 렌더
// ═══════════════════════════════════════════════════════════════════
function worldTransform() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const sx = (Math.random() - .5) * cam.shakeX, sy = (Math.random() - .5) * cam.shakeY;
  ctx.translate(W / 2 + sx, SCREEN_GROUND + sy);
  const z = cam.zoom * (1 + cam.punch * 0.045);
  ctx.scale(z, z);
  ctx.translate(-cam.x, -GROUND);
}

function drawBackground() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const bg = A.bg;
  if (!ready(bg)) { ctx.fillStyle = '#1a1008'; ctx.fillRect(0, 0, W, H); return; }
  // 배경은 16:9 가로 그림이다. 세로 캔버스에 높이로 맞추면 좌우가 모자라고,
  // 폭으로 맞추면 지면선이 화면 한참 아래로 내려간다.
  // → 폭 기준으로 키우되, **그림 속 지면선을 SCREEN_GROUND 에 맞춰** 세로 위치를 정한다.
  //   그래야 장수 발밑과 배경 바닥이 붙는다.
  const z = cam.zoom * (1 + cam.punch * .045);
  // 배경 그림에서 '나무 다리'가 차지하는 세로 구간 — 실측값이다.
  //   앞쪽 끝 80.8% / 안쪽 끝 69.6%  (tools 로 픽셀을 세어 구했다)
  // 이 값이 틀리면 캐릭터가 다리 밖으로 걸어 나간다.
  const BG_FRONT = 0.808;              // z=0 일 때 발끝이 놓일 위치
  const BG_BACK  = 0.696;              // z=Z_MAX 일 때 발끝이 놓일 위치
  const BG_GROUND = BG_FRONT;
  // 폭도 채우고 '지면 위 공간'도 채워야 한다. 둘 중 큰 배율을 쓴다 —
  // 안 그러면 결투 영역 위쪽에 검은 띠가 남는다.
  const need = Math.max(W / bg.naturalWidth,
                        SCREEN_GROUND / (bg.naturalHeight * BG_GROUND));
  const scale = need * 1.06 * (1 + (z - 0.85) * 0.22);
  const bw = bg.naturalWidth * scale, bh = bg.naturalHeight * scale;
  const px = (cam.x / STAGE_W - .5) * Math.max(0, bw - W) * 0.9;
  ctx.imageSmoothingEnabled = true;
  const bx = (W - bw) / 2 - px;
  const by = SCREEN_GROUND - bh * BG_GROUND;
  // 그려진 다리 폭에 맞춰 이동 가능한 깊이를 정한다.
  // 상수로 박아두면 배경을 바꿀 때마다 캐릭터가 허공을 걷는다.
  zRange = clamp((bh * (BG_FRONT - BG_BACK)) / Math.max(0.3, z), 40, 200);
  ctx.drawImage(bg, bx, by, bw, bh);
  // 배경이 못 덮는 위/아래는 어둠으로 — 세로가 길어 그림만으로는 화면이 안 찬다
  if (by > 0) { ctx.fillStyle = '#0d0906'; ctx.fillRect(0, 0, W, Math.ceil(by) + 1); }
  const bottom = by + bh;
  if (bottom < H) { ctx.fillStyle = '#150d07'; ctx.fillRect(0, Math.floor(bottom), W, H - bottom + 1); }
  // 상하 비네트 — 인물이 배경에서 뜨게. 조작부 쪽은 더 짙게 눌러 시선을 결투로 모은다
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(6,4,2,.80)'); g.addColorStop(.18, 'rgba(6,4,2,0)');
  g.addColorStop(Math.min(.98, PLAY_RATIO * 0.82), 'rgba(6,4,2,0)');
  g.addColorStop(Math.min(.99, PLAY_RATIO), 'rgba(6,4,2,.55)');
  g.addColorStop(1, 'rgba(6,4,2,.96)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// NOTE: 예전에는 여기에 pickFrame() 이 있었다 — 스프라이트 시트에서 컷을 골라
// 그리는 경로다. 두 장수 모두 새 규격 포즈(+리그)로 옮겨 가면서 통째로 삭제했다.
// 그 경로가 남아 있는 동안엔 '걸을 때만 커지고 공격하면 작아지는' 문제가 계속 났다:
// 시트는 컷 사각형 기준, 새 포즈는 몸 높이 기준이라 크기 기준이 서로 달랐기 때문이다.

// 지금 이 파이터가 써야 할 상태 포즈. 없으면 null.
// 캐릭터마다 가진 포즈가 다르다 — 없는 항목은 리그(rigClipFor)가 메운다.
function statePose(f) {
  const set = POSE_SET[f.kind];
  if (!set) return null;
  const pick = k => { if (!k || !ready(A[k])) return null; f.poseKey = k; return A[k]; };
  const PHASE = { windup: 0, active: 1, recover: 2 };
  const atk = f.move && set[f.move.sheet];
  switch (f.state) {
    case 'windup':
    case 'active':
    case 'recover': return atk ? pick(atk[PHASE[f.state]]) : null;
    case 'hurt':    return pick(f.hurtHeavy ? set.hurtH : set.hurtL);
    case 'stunned': return pick(set.stunned);
    case 'ko':      return pick(f.st < 26 ? set.koFall : set.koDown);
    default:
      // 가드는 상태가 아니라 플래그다. 저스트 유효 프레임 동안은 쳐내는 자세.
      if (f.guardHeld && !busy(f) && !helpless(f))
        return pick(f.guardT <= GUARD_JUST ? (set.guardJust || set.guard) : set.guard);
      if (f.state === 'idle') return pick(set.idle);
      if (f.state === 'walk' || f.state === 'dash' || f.state === 'backstep') {
        // 걷기 컷이 있으면 보폭에 맞춰 넘긴다 — 리그가 필요 없어지는 지점.
        // 발이 미끄러지지 않도록 이동 거리(gait)로 프레임을 고른다.
        if (Array.isArray(set.walk))
          return pick(set.walk[Math.floor((f.gait || 0) / 34) % set.walk.length]);
        return pick(set.walk || set.idle);
      }
      return null;
  }
}

// 접지 그림자 — '하늘에 떠 있는' 느낌을 없애는 건 거의 전적으로 이것이다.
//  · 발밑에 딱 붙은 진한 코어  : 발이 지면에 닿았다는 신호
//  · 그 바깥의 흐린 반그림자   : 부피감
// 예전 값(폭 60~70, 발보다 4px 아래)은 285px 캐릭터 기준이라 지금은 과하게 넓고 떠 있었다.
function drawShadow(f) {
  const s = spriteScale(f) * zScale(f);
  const feet = CHAR_FEET[f.kind] || { cx: STATE_CX, w: 360 };
  // 그림자는 **두 발을 덮어야** 한다. 몸통 중심에 찍으면 안 된다 —
  // 무기까지 포함해 정렬된 탓에 화웅은 발이 중앙에서 85px 벗어나 있고,
  // 좌우 반전까지 겹쳐 그림자가 발 반대쪽에 찍혔다.
  let cx = f.x + f.dir * (feet.cx - STATE_CX) * s;
  let w = (feet.w * 0.5) * s * 1.18;
  let alpha = 1;

  // 자세에 따라 그림자가 변해야 자연스럽다. 고정 타원은 스티커처럼 보인다.
  if (busy(f) && f.move) {
    // 내지르는 동안엔 발이 벌어지고 몸이 앞으로 나간다 → 넓어지고 앞으로 끌린다
    const t = f.state === 'active' ? 1 : f.state === 'recover' ? 0.7 : 0.25;
    w *= 1 + 0.30 * t;
    cx += f.dir * w * 0.18 * t;
    alpha *= 1 - 0.10 * t;
  } else if (f.guardHeld) {
    w *= 0.92;                       // 웅크리면 좁고 진해진다
    alpha *= 1.12;
  } else if (f.state === 'hurt') {
    cx -= f.dir * w * 0.22;          // 밀려난 쪽으로 끌린다
    alpha *= 0.9;
  } else if (f.state === 'ko') {
    // 넘어지는 동안엔 몸이 떠 있다 → 작고 옅게, 바닥에 닿으면 다시 퍼진다
    const air = clamp(1 - Math.abs(f.st - 16) / 16, 0, 1);
    w *= 1 - 0.35 * air; alpha *= 1 - 0.45 * air;
  } else if (f.state === 'idle') {
    alpha *= 1 + Math.sin(frame * 0.042) * 0.05;   // 호흡에 맞춰 아주 미세하게
  }
  // 안쪽으로 갈수록 빛이 약해 그림자도 옅다
  alpha *= 1 - f.z / Z_MAX * 0.18;

  const y = footY(f);
  ctx.save();
  ctx.translate(cx, y);
  ctx.scale(1, 0.34);                // 원근에 눌린 타원
  // 층을 겹쳐 가장자리를 부드럽게 — 단단한 타원 하나면 스티커처럼 보인다.
  // 바깥으로 갈수록 넓고 옅게, 안쪽은 좁고 진하게.
  for (const [rad, a0, a1] of [[1.75, .30, 0], [1.15, .46, 0], [0.66, .58, 0]]) {
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, w * rad);
    g.addColorStop(0, `rgba(0,0,0,${(a0 * alpha).toFixed(3)})`);
    g.addColorStop(0.62, `rgba(0,0,0,${(a0 * alpha * 0.42).toFixed(3)})`);
    g.addColorStop(1, `rgba(0,0,0,${a1})`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, w * rad, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// 지금 그려진 포즈의 창끝을 무대 좌표로 — 발광·궤적이 붙는 지점.
function tipOf(f) {
  const t = POSE_TIP[(TIP_NS[f.kind] || 's') + ':' + POSE_KEY[f.poseKey]];
  if (!t) return null;
  const s = 1;
  const zs = spriteScale(f) * zScale(f);
  return [f.x + f.dir * (t.tipX - STATE_CX) * zs, footY(f) + (t.tipY - STATE_GROUND) * zs];
}

// 상태 포즈는 규격이 통일돼 있어서 컷 좌표 없이 한 줄로 그린다.
function drawStatePose(f, img) {
  const s = spriteScale(f);
  ctx.save();
  ctx.translate(f.x, footY(f));
  ctx.scale(zScale(f), zScale(f));
  // 대기는 그림 한 장이라 가만 두면 마네킹이다 — 숨을 쉬게 한다.
  // 위아래로 띄우지 않고 '눌렀다 폈다' 한다. 발이 지면에서 떨어지면 안 된다.
  if (f.state === 'idle' && !f.guardHeld) {
    const b = Math.sin(frame * 0.042 + (f === B ? 1.7 : 0));
    ctx.scale(1 - b * 0.006, 1 + b * 0.012);
  } else if (f.guardHeld) {
    const b = Math.sin(frame * 0.075);       // 가드 중엔 더 얕고 빠르게
    ctx.scale(1, 1 + b * 0.006);
  }
  ctx.scale(f.dir, 1);                       // 원본은 오른쪽을 본다
  if (f.hitFlash > 0 && f.hitFlash % 4 > 1 && f.state !== 'ko') ctx.globalAlpha = .55;
  ctx.drawImage(img, -STATE_CX * s, -STATE_GROUND * s, STATE_CW * s, STATE_CH * s);
  ctx.restore();
}

// 리그로 그릴 수 있는 상태인가 — 대기와 이동만. 공격은 그린 포즈가 훨씬 낫다.
function rigClipFor(f) {
  const rig = RIGS[f.kind];
  if (!rig) return null;
  const set = POSE_SET[f.kind] || {};
  // 그려진 포즈가 있으면 그림이 언제나 낫다. 리그는 '그림이 없는 상태'를 메운다.
  if (f.state === 'hurt')    return set.hurtL ? null : 'hurt';
  if (f.state === 'stunned') return set.stunned ? null : 'stunned';
  if (f.state === 'ko')      return set.koFall ? null : 'ko';
  // 가드 그림이 없는 캐릭터(화웅)는 리그가 맡는다.
  // 안 그러면 '가드할 때만' 옛 시트로 새서 그 순간 덩치가 바뀐다.
  if (f.guardHeld) return set.guard ? null : 'guard';
  // 그려진 공격 포즈가 없으면 공격도 리그가 흉내낸다(전신 아트만 있는 장수)
  if (busy(f) && f.move && !set[f.move.sheet]) return f.move.sheet;
  if (busy(f) || helpless(f)) return null;
  // 걷기 그림이 있으면 그림이 우선이다. 리그는 어디까지나 '그림이 없을 때'의 대체물.
  if (f.state === 'walk' || f.state === 'dash' || f.state === 'backstep')
    return set.walk ? null : 'walk';
  return null;   // 대기는 그려진 idle 한 장이면 충분하다
}

function drawRigPose(f, clipName) {
  const RIG = RIGS[f.kind];
  const clip = RIGCLIPS.CLIPS[clipName];
  // 걷기는 걸음 속도에, 1회성 동작은 상태 경과 프레임에 맞춘다
  const t = clipName === 'walk' ? (f.gait || 0) * 0.62
          : (clip.loop ? frame : f.st);
  let pose = RIGLIB.samplePose(clip, t);
  // 달리는 방향으로 몸이 기운다 — 대시가 '멈춘 채 미끄러지는' 것처럼 보이지 않게
  const leanX = clamp(f.lean * f.dir, -7, 7);
  // 깊이로 이동할 땐 몸을 눌렀다 펴고 어깨를 튼다.
  // 위아래 이동이 '평행이동'으로만 보이던 이유가 이 반응이 없어서였다.
  const vz = f.vz || 0;
  const zTilt = clamp(-vz * 1.8, -5, 5);
  const zBob = Math.abs(vz) > 0.3 ? Math.sin(f.gait * 0.12) * 2.2 : 0;
  // addPose 는 '더하는' 함수다 — sy 에 1.02 를 넘기면 기본값 1 에 더해져 2배가 된다.
  // 여기 들어가는 값은 전부 **증분**이어야 한다.
  pose = RIGLIB.addPose(pose, {
    root: { rot: leanX + zTilt, y: zBob, sy: Math.abs(vz) * 0.006 },
    upper: zTilt * 0.5, head: -zTilt * 0.7, cape: -vz * 3.2,
  });
  const scale = (RIG_TARGET_H * charScale(f)) / RIG.height;
  RIGLIB.drawRig(ctx, RIG, pose, { x: f.x, y: footY(f), dir: f.dir, scale: scale * zScale(f) });
}

// ── 무기 아우라 ────────────────────────────────────────────────
// 기술마다 색과 세기를 다르게 준다. 색이 다르면 어떤 기술인지 눈으로 구분된다.
const AURA = {
  light:  { color: '#bfe6ff', core: '#ffffff', power: 0.55 },
  thrust: { color: '#9fd0ff', core: '#eaf6ff', power: 0.75 },
  heavy:  { color: '#ffd06a', core: '#fff3c8', power: 1.20 },
};
// 화웅은 도끼다 — 조운의 푸른 기운과 색을 갈라야 누가 뭘 쓰는지 즉시 읽힌다
const AURA_BOSS = {
  light:  { color: '#ffb08a', core: '#fff0e0', power: 0.62 },
  thrust: { color: '#ff9a6a', core: '#ffe6d2', power: 0.80 },
  heavy:  { color: '#ff6a3c', core: '#ffd8a8', power: 1.30 },
};
const auraOf = f => (f.kind === 'boss' ? AURA_BOSS : AURA)[f.move && f.move.sheet];

// 예비동작 동안 창끝에 기가 모인다 — 크게 감을수록 밝아진다.
// 예고(telegraph)가 눈에 보이는 신호로도 바뀌는 셈이라 읽고 대응하기 쉬워진다.
function drawWindupAura(f) {
  if (f.state !== 'windup' || !f.move) return;
  const a = auraOf(f); if (!a) return;
  const tip = tipOf(f); if (!tip) return;
  const t = clamp(f.st / f.move.startup, 0, 1);
  const r = (16 + 30 * t) * a.power;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const g = ctx.createRadialGradient(tip[0], tip[1], 0, tip[0], tip[1], r);
  g.addColorStop(0, a.core); g.addColorStop(.35, a.color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = .30 + .55 * t;
  ctx.beginPath(); ctx.arc(tip[0], tip[1], r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();

  // 주변에서 빨려들어오는 기운 — 정지 프레임에도 '차오르는 중'이 읽힌다
  const n = Math.round(3 + 5 * t);
  for (let i = 0; i < n; i++) {
    const ang = (frame * 0.11 + i * (Math.PI * 2 / n));
    const d = r * (2.6 - 1.7 * ((frame * 0.05 + i * 0.37) % 1));
    ctx.globalAlpha = (.5 + .5 * t) * .5;
    ctx.fillStyle = a.core;
    ctx.fillRect(tip[0] + Math.cos(ang) * d - 2, tip[1] + Math.sin(ang) * d - 2, 4, 4);
  }
  ctx.restore();
}

// 판정 프레임 동안 예비 자세의 창끝 → 지금 창끝을 잇는 궤적.
// 두 점 모두 '실제로 그려진' 칼끝이라, 그림이 바뀌어도 궤적이 저절로 맞는다.
function drawSwingTrail(f) {
  if (f.state !== 'active' || !f.move) return;
  const a = auraOf(f); if (!a) return;
  const to = tipOf(f); if (!to || !f.swingFrom) return;
  const from = f.swingFrom;
  const t = clamp(f.st / f.move.active, 0, 1);
  const fade = 1 - t * 0.65;

  // 두 점을 잇되 바깥으로 부풀린 호 — 직선으로 이으면 찌른 것처럼 보인다
  const mx = (from[0] + to[0]) / 2, my = (from[1] + to[1]) / 2;
  const dx = to[0] - from[0], dy = to[1] - from[1];
  const bow = f.move.sheet === 'thrust' ? 0.05 : 0.34;
  const cx0 = mx - dy * bow * f.dir, cy0 = my + dx * bow * f.dir;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const [w, col, al] of [[26 * a.power, a.color, .32], [11 * a.power, a.core, .75]]) {
    ctx.globalAlpha = al * fade;
    ctx.strokeStyle = col; ctx.lineWidth = w;
    ctx.shadowColor = a.color; ctx.shadowBlur = 22 * a.power;
    ctx.beginPath(); ctx.moveTo(from[0], from[1]);
    ctx.quadraticCurveTo(cx0, cy0, to[0], to[1]); ctx.stroke();
  }
  // 칼끝의 빛덩이
  ctx.globalAlpha = .9 * fade;
  const g = ctx.createRadialGradient(to[0], to[1], 0, to[0], to[1], 34 * a.power);
  g.addColorStop(0, a.core); g.addColorStop(.4, a.color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(to[0], to[1], 34 * a.power, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawFighter(f) {
  const rigClip = rigClipFor(f);
  if (rigClip) {
    drawShadow(f);
    drawRigPose(f, rigClip);
    drawStunGauge(f);
    return;
  }

  const sp = statePose(f);
  if (sp) {
    drawShadow(f);
    drawWindupAura(f);          // 창이 빛을 머금는다 (몸 뒤)
    drawStatePose(f, sp);
    drawSwingTrail(f);          // 휘두른 자취 (몸 앞)
    // 저스트가드 유효 프레임은 포즈만으론 못 읽는다 — 빛나는 테두리를 한 겹 얹는다
    if (f.guardHeld && f.guardT <= GUARD_JUST) {
      ctx.save();
      ctx.globalAlpha = .8; ctx.strokeStyle = '#dff6ff';
      ctx.shadowColor = '#9de2ff'; ctx.shadowBlur = 26; ctx.lineWidth = 9; ctx.lineCap = 'round';
      ctx.translate(f.x + f.dir * 20, footY(f) - 150); ctx.scale(f.dir, 1);
      ctx.beginPath(); ctx.arc(0, 0, 112, -0.95, 0.95); ctx.stroke();
      ctx.restore();
    }
    drawStunGauge(f);
    return;
  }

  // 여기까지 왔다 = 그릴 게 없다(에셋 로딩 중). 그림자만 남겨 자리를 지킨다.
  // 예전엔 이 자리에서 옛 스프라이트 시트로 흘렀고, 그게 크기 튐의 원인이었다.
  drawShadow(f);
}

// 리그·상태 포즈 어느 쪽으로 그렸든 같은 게이지를 쓴다.
function drawStunGauge(f, cx = f.x, bodyH = 285) {
  if (!(f.stun > 6) || f.state === 'ko') return;
  const w = 84, r = f.stun / STUN_MAX, top = footY(f) - bodyH - 16;
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(cx - w / 2, top, w, 8);
  ctx.fillStyle = r > .75 ? '#ff6a3c' : '#ffd45c'; ctx.fillRect(cx - w / 2 + 1, top + 1, (w - 2) * r, 6);
  ctx.restore();
}

function drawFx() {
  for (const p of fx) {
    const a = clamp(p.life / (p.max || 30), 0, 1);
    if (p.t === 'spark') {
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 5, 5);
    } else if (p.t === 'blood') {
      ctx.globalAlpha = a; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 6, 6);
    } else if (p.t === 'burst') {
      // 가산합성 섬광. 히트스톱으로 화면이 멈춘 동안 '터졌다'를 대신 말해 준다.
      const k = 1 - p.life / p.max;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * .95;
      const r = p.r * (0.35 + k * 0.9);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      g.addColorStop(0, '#ffffff'); g.addColorStop(.28, p.color); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
      // 십자 섬광 — 원만 있으면 뭉툭하다
      ctx.globalAlpha = (1 - k) * .8; ctx.fillStyle = '#fff8e0';
      const L = r * 1.9, T = Math.max(2, r * .09 * (1 - k));
      ctx.fillRect(p.x - L, p.y - T / 2, L * 2, T);
      ctx.fillRect(p.x - T / 2, p.y - L * .45, T, L * .9);
      ctx.restore();
    } else if (p.t === 'shock') {
      // 진행 방향으로 눌린 충격파 고리 — 정면 원보다 '밀려났다'가 읽힌다
      const k = 1 - p.life / p.max;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * .55;
      ctx.strokeStyle = '#fff2cf'; ctx.lineWidth = Math.max(1, 9 * (1 - k));
      ctx.translate(p.x, p.y); ctx.scale(1 + k * .5, (1 - k * .35) * .55);
      ctx.beginPath(); ctx.arc(0, 0, p.r * (0.2 + k), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    } else if (p.t === 'ring') {
      const t = 1 - p.life / p.max;
      ctx.globalAlpha = (1 - t) * .9; ctx.strokeStyle = p.color; ctx.lineWidth = 6 * (1 - t) + 1;
      ctx.beginPath(); ctx.arc(p.x, p.y, lerp(p.r0, p.r, t), 0, Math.PI * 2); ctx.stroke();
    } else if (p.t === 'arc') {
      // 초승달 궤적. 선 굵기는 화면 기준으로 고정(줌이 바뀌어도 두께가 튀지 않게)
      const t = 1 - p.life / p.max, k = 1 / cam.zoom;
      ctx.save(); ctx.globalAlpha = (1 - t) * .85; ctx.translate(p.x, p.y); ctx.scale(p.dir, 1);
      ctx.strokeStyle = '#fff8dc'; ctx.lineCap = 'round';
      if (p.kind === 'line') {
        // 찌르기는 균일한 굵기의 선으로 그리면 흰 막대가 화면에 걸린 것처럼 보인다.
        // 뿌리는 두껍고 끝은 뾰족한 방추형으로 — 그래야 '찔러 나간' 방향이 읽힌다.
        const tip = 150 + t * 90, back = -50, half = 7 * k * (1 - t * .55);
        ctx.fillStyle = '#fff8dc';
        ctx.beginPath();
        ctx.moveTo(tip, 0);
        ctx.quadraticCurveTo(back * .3, -half, back, 0);
        ctx.quadraticCurveTo(back * .3, half, tip, 0);
        ctx.fill();
      } else {
        ctx.lineWidth = (p.kind === 'heavy' ? 13 : 9) * k * (1 - t * .5);
        const r = (p.kind === 'heavy' ? 108 : 82) * (0.85 + t * .35);
        ctx.beginPath();
        ctx.arc(-14, -6, r, -1.15 + t * .45, 0.55 + t * .45);
        ctx.stroke();
      }
      ctx.restore();
    } else if (p.t === 'num') {
      // 캐릭터를 줄인 만큼 타격의 쾌감은 숫자가 떠안는다.
      // 튀어나올 때 크게 부풀었다가(pop) 제 크기로 가라앉는다.
      const t = 1 - p.life / p.max, k = 1 / cam.zoom;
      const pop = t < .18 ? 1 + (1 - t / .18) * 0.85 : 1;
      const size = (p.big ? 52 : 38) * k * pop;
      ctx.globalAlpha = clamp(2.2 - t * 2.6, 0, 1);
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate((p.big ? -0.06 : -0.03));
      ctx.font = `900 ${size}px "Malgun Gothic",system-ui`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = size * 0.20; ctx.strokeStyle = '#2a0a04'; ctx.strokeText(p.v, 0, 0);
      ctx.lineWidth = size * 0.09; ctx.strokeStyle = p.big ? '#7a3a00' : '#4a2a10'; ctx.strokeText(p.v, 0, 0);
      const g = ctx.createLinearGradient(0, -size * .6, 0, size * .6);
      if (p.big) { g.addColorStop(0, '#fff6c0'); g.addColorStop(.5, '#ffd045'); g.addColorStop(1, '#ff8a1e'); }
      else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#ffe1a6'); }
      ctx.fillStyle = g; ctx.fillText(p.v, 0, 0);
      ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = 'rgba(120,96,64,.5)';
  for (const d of dust) { ctx.globalAlpha = clamp(d.life / 22, 0, 1) * .5; ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 6.283); ctx.fill(); }
  ctx.globalAlpha = 1;
}

function render() {
  drawBackground();
  worldTransform();
  // ── 결투 무대 바닥 ──────────────────────────────────────────
  // 배경 그림의 바닥에 의존하면 깊이 범위와 절대 안 맞는다(캐릭터가 원경으로 올라간다).
  // 움직일 수 있는 깊이 구간을 그대로 바닥으로 그려서, 어디까지가 무대인지 눈에 보이게 한다.
  const zBack = GROUND - Z_MAX, x0 = cam.x - W, ww = W * 2;
  // 바닥은 배경의 나무 다리가 이미 그려져 있다. 위에 또 칠하면 지저분해지므로
  // 깊이감만 얕게 보강한다 — 안쪽을 살짝 어둡게, 경계에 가는 선.
  const fg = ctx.createLinearGradient(0, zBack, 0, GROUND + 10);
  fg.addColorStop(0, 'rgba(12,7,3,.34)');       // 안쪽은 그늘 — 깊이가 읽힌다
  fg.addColorStop(1, 'rgba(12,7,3,0)');
  ctx.fillStyle = fg;
  ctx.fillRect(x0, zBack, ww, Z_MAX + 12);
  ctx.fillStyle = 'rgba(255,224,150,.10)'; ctx.fillRect(x0, zBack, ww, 1);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(x0, GROUND + 8, ww, 1);
  // 무대 밖 — 다리 아래는 어둡게 눌러 '여기부턴 못 간다'가 보이게
  ctx.fillStyle = 'rgba(10,6,3,.45)';
  ctx.fillRect(x0, GROUND + 16, ww, 200);   // 발밑 그림자를 덮지 않게 조금 내린다
  const order = P.z >= B.z ? [P, B] : [B, P];   // 안쪽(z 큼)을 먼저 = 뒤에 깔린다
  drawFighter(order[0]); drawFighter(order[1]);
  drawFx();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // 히트스톱 순간 화면 플래시
  if (hitStop > 14) { ctx.globalAlpha = (hitStop - 14) / 22; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
}

// ═══════════════════════════════════════════════════════════════════
//  9. HUD · 배너 · 오버레이
// ═══════════════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
function syncHud(force) {
  $('hpL').style.width = clamp(P.hp / P.maxHp, 0, 1) * 100 + '%';
  $('hpR').style.width = clamp(B.hp / B.maxHp, 0, 1) * 100 + '%';
  $('hpLossL').style.width = clamp(P.hp / P.maxHp, 0, 1) * 100 + '%';
  $('hpLossR').style.width = clamp(B.hp / B.maxHp, 0, 1) * 100 + '%';
  $('spL').style.width = clamp(P.stam / P.maxStam, 0, 1) * 100 + '%';
  $('spR').style.width = clamp(B.stam / B.maxStam, 0, 1) * 100 + '%';
  $('sideL').classList.toggle('low', P.stam < 25);
  $('sideR').classList.toggle('low', B.stam < 25);
  const sec = Math.ceil(clockFrames / FPS);
  const clk = $('clock');
  if (force || clk.textContent !== String(sec)) clk.textContent = sec;
}
function bumpHap() {
  const el = $('hapCount');
  el.textContent = hap + ' 합';
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
let bannerT = 0;
function banner(text, color, weight) {
  if (weight < bannerT) return;
  bannerT = weight;
  const el = $('banner');
  el.textContent = text; el.style.color = color;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
  setTimeout(() => { bannerT = 0; }, 700);
}

// 받침 유무로 목적격 조사를 고른다 — "화웅을(를)" 같은 표기를 안 쓰기 위해
function eul(word) {
  const c = word.charCodeAt(word.length - 1);
  if (c < 0xac00 || c > 0xd7a3) return '을';
  return (c - 0xac00) % 28 ? '을' : '를';
}

function showResult(kind) {
  const ov = $('overlay');
  const title = kind === 'win' ? '승 리' : kind === 'lose' ? '패 배' : '무 승 부';
  const line = kind === 'win'
    ? `${hap}합 만에 ${B.name}${eul(B.name)} 베었다.`
    : kind === 'lose' ? `${hap}합을 겨루었으나 ${B.name}에게 당했다.`
    : `${hap}합을 겨루었으나 승부가 나지 않았다.`;
  $('ovTitle').textContent = title;
  $('ovVs').style.display = 'none';
  $('ovText').innerHTML = `${line}<br><br>
    유효타 <b>${stats.hits}</b> · 가드 <b>${stats.guards}</b> · 저스트가드 <b>${stats.justs}</b> · 격돌 <b>${stats.clashes}</b><br>
    받은 피해 <b>${stats.taken}</b> · 남은 체력 <b>${Math.max(0, Math.round(P.hp))}</b>`;
  $('ovGo').textContent = '다 시';
  ov.hidden = false;
  phase = 'result';
}

let touchMode = false;
let tipTimer = 0;
function showTip(html, ms = 4200) {
  const el = $('tip');
  el.innerHTML = html;
  el.classList.add('show');
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function startFight() {
  if (!assetsReady) return;          // 로딩 중엔 시작 금지
  window.__sfx?.resume();            // 사용자 조작 시점에만 오디오가 열린다
  $('overlay').hidden = true;
  $('ovVs').style.display = '';
  resetMatch();
  phase = 'fight';
  banner('일 기 토', '#ffd45c', 1);
  showTip(touchMode
    ? '<b>베기</b>로 두드리고 <b>가드</b>로 막아라 · 맞는 순간 가드 = <b>저스트가드</b>'
    : '<b>J</b> 베기 · <b>K</b> 강베기 · <b>L</b> 찌르기 · <b>S</b> 가드 — 맞는 순간 가드가 <b>저스트가드</b>', 5200);
}

// 난이도 선택
document.querySelectorAll('#ovDiff .pick').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#ovDiff .pick').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    diff = DIFF[b.dataset.diff];
  });
});
// ── 장수 선택 ───────────────────────────────────────────────────
// 20컷 완본은 폴더만 있으면 뜬다. 목록은 generals.json 이 알려준다.
let ROSTER = [];
const DEFAULT_SIDE = { player: 'zhao_yun', boss: 'hua_xiong' };
fetch('./assets/arcade_duel/generals.json?v=1').then(r => r.json()).then(list => {
  ROSTER = list;
  for (const [sel, side] of [['pickP', 'player'], ['pickB', 'boss']]) {
    const el = $(sel);
    el.innerHTML = list.map(g =>
      `<option value="${g.id}"${g.id === DEFAULT_SIDE[side] ? ' selected' : ''}>` +
      `${g.name}${g.full ? '' : ' (부분)'}</option>`).join('');
  }
}).catch(() => { $('pickWrap').style.display = 'none'; });

// 고른 장수를 실제로 불러온다. 완본이 아니면 원래 등록(조운·화웅)을 그대로 쓴다.
async function applyPicks() {
  if (!ROSTER.length) return;
  for (const [sel, side] of [['pickP', 'player'], ['pickB', 'boss']]) {
    const gid = $(sel).value;
    const g = ROSTER.find(x => x.id === gid);
    if (!g || !g.full) continue;                    // 부분 세트는 기존 경로 유지
    await loadGeneral(gid, side, { size: g.size });
    // resetMatch() 가 기본값으로 되돌리므로 여기 저장해 둔다
    SIDE_INFO[side].name = g.name;
    if (g.war) SIDE_INFO[side].war = g.war;
    if (g.hp) SIDE_INFO[side].hp = g.hp;
  }
}

// 오버레이 버튼은 하나 — 문맥(시작/재개/재시작)에 따라 갈린다
$('ovGo').addEventListener('click', async () => {
  if (phase === 'paused') { $('overlay').hidden = true; phase = 'fight'; return; }
  const btn = $('ovGo'), label = btn.textContent;
  btn.disabled = true; btn.textContent = '준비 중';
  try { await applyPicks(); } finally { btn.disabled = false; btn.textContent = label; }
  startFight();
});

function togglePause() {
  if (phase === 'fight') { phase = 'paused'; $('ovTitle').textContent = '일시정지'; $('ovVs').style.display = 'none'; $('ovText').textContent = '숨을 고른다.'; $('ovGo').textContent = '계 속'; $('overlay').hidden = false; }
  else if (phase === 'paused') { $('overlay').hidden = true; phase = 'fight'; }
}
$('btnPause').addEventListener('click', togglePause);
$('btnFull').addEventListener('click', () => {
  const w = document.getElementById('wrap');
  if (document.fullscreenElement) document.exitFullscreen();
  else w.requestFullscreen?.();
});
// 상대를 세워두는 토글 — 동작을 눈으로 확인할 때 쓴다.
// 주소에 ?dummy 를 붙이는 건 매번 번거롭다.
$('dummyBtn').addEventListener('click', () => {
  DUMMY = DUMMY ? 0 : 1;
  const b = $('dummyBtn');
  b.textContent = DUMMY ? '🧍' : '⚔️';
  b.style.borderColor = DUMMY ? '#ffd45c' : '#9de2ff';
  b.title = DUMMY ? '상대 정지 중 — 누르면 다시 싸운다' : '상대 정지(허수아비)';
  banner(DUMMY ? '상대 정지' : '상대 재개', '#9de2ff', .7);
});

$('muteBtn').addEventListener('click', () => {
  const m = window.__sfx; if (!m) return;
  m.resume();
  const off = !m.isMuted();
  m.setMuted(off);
  $('muteBtn').textContent = off ? '🔇' : '🔊';
  $('muteBtn').setAttribute('aria-label', off ? '소리 켜기' : '소리 끄기');
});

// HUD 크기 단위 — 캔버스 설계 해상도 1px 이 실제로 몇 px 인가
const wrapEl = document.getElementById('wrap');
function syncUnit() {
  resizeCanvas();
  // 세로에서는 '폭' 기준이어야 한다. 높이 기준으로 잡으면 길쭉한 기기에서 UI가 거대해진다.
  const u = wrapEl.clientWidth / W;
  document.documentElement.style.setProperty('--u', u.toFixed(4) + 'px');
  document.documentElement.style.setProperty('--playh', (H * PLAY_RATIO).toFixed(1));
}
new ResizeObserver(syncUnit).observe(wrapEl);
syncUnit();

// 조작계 감지는 '실제로 무엇을 썼는가'로 — 로드 시점의 미디어쿼리만 믿으면
// 태블릿·에뮬레이터·터치 가능한 노트북에서 틀린 UI가 뜬다.
const padEl = $('pad'), keysEl = document.querySelector('.keys');
padEl.classList.remove('hide');
function useTouch() { touchMode = true; padEl.classList.remove('hide'); keysEl.style.display = 'none'; }
// 세로 전용이라 패드는 항상 보인다 — 아래 40%가 원래 조작부 자리다.
// 키보드를 쓰더라도 패드를 숨기면 그 영역이 텅 빈 채로 남는다.
function useKeys() { touchMode = false; keysEl.style.display = ''; }
addEventListener('touchstart', useTouch, { passive: true, once: true });
addEventListener('keydown', useKeys, { once: true });
if (matchMedia('(pointer:coarse)').matches) useTouch(); else useKeys();

// ═══════════════════════════════════════════════════════════════════
//  10. 루프
// ═══════════════════════════════════════════════════════════════════
let acc = 0, last = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!last) last = now;
  let elapsed = Math.min(now - last, 100);
  last = now;
  if (slowmo > 0) { slowmo--; elapsed *= 0.32; }
  acc += elapsed;
  let guard = 0;
  while (acc >= DT && guard++ < 5) { update(); acc -= DT; }
  render();
}

// 루프는 '에셋을 기다리지 않고' 먼저 돈다. 예전엔 로드 완료 후에야 시작해서,
// 다 받기 전에 결투를 누르면 phase 만 fight 로 바뀌고 화면은 검은 채 멈췄다.
resetMatch();
requestAnimationFrame(loop);

const goBtn = $('ovGo');
goBtn.disabled = true;
goBtn.textContent = '불러오는 중 0%';
const restAssets = Object.keys(ASSET_SRC).filter(k => !CORE_ASSETS.includes(k));
loadAssets(CORE_ASSETS, p => { goBtn.textContent = '불러오는 중 ' + Math.round(p * 100) + '%'; })
  .then(() => {
    assetsReady = true;
    goBtn.disabled = false;
    goBtn.textContent = '결 투';
    loadAssets(restAssets);          // 나머지는 뒤에서 계속 받는다
  });
</script>
