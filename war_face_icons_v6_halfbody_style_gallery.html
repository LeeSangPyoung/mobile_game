article {

}
.icon {

    linear-gradient(45deg, transparent 75%, rgba(255,255,255,.08) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.08) 75%),
    #17110d;
  background-size:20px 20px;
  background-position:0 0, 0 10px, 10px -10px, -10px 0;
}
.icon img {
  width:100%;
  height:100%;
  object-fit:cover;
}
.badge,.status {
  position:absolute;
  z-index:1;
  padding:3px 7px 4px;
  border-radius:6px;
  background:rgba(13,9,6,.76);
  border:1px solid rgba(255,211,106,.32);
  color:var(--gold);
  font-size:11px;
  font-weight:850;
}
.badge { left:8px; top:8px; }
.status { right:8px; top:8px; }
.done { color:var(--done); }
.wait { color:var(--wait); }
.missing {
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
  padding:14px;
  color:var(--wait);
  font-size:13px;
  font-weight:850;
  text-align:center;
  background:var(--panel2);
}
.meta { padding:10px 11px 12px; }
.name {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  margin:0 0 7px;
  font-size:16px;
  font-weight:850;
}
.name small {
  color:#9e8a67;
  font-size:11px;
  font-weight:750;
}
.note {

  color:var(--muted);
  font-size:12px;
  line-height:1.35;
}
a {

  line-height:1.35;

a:hover { text-decoration:underline; }
@media (max-width:720px) {

function refPath(id) {
  return `${refBase}/${id}_halfbody_redraw_v6.png?v=${version}`;
}

window.GENERALS_200.forEach(([id, ko], index) => {
  const no = String(index + 1).padStart(3, "0");
  const item = completed[id];
  const done = Boolean(item);
  const accepted = done && !item.needsRedraw;
  const article = document.createElement("article");
  article.innerHTML = `
    <div class="pair">
      <div class="art ref">
        <span class="badge">v6 반신</span>
        <img loading="lazy" src="${refPath(id)}" alt="${ko} v6 반신">
      </div>
      <div class="art icon">
        <span class="badge">${done ? item.label : "대기"}</span>
        <span class="status ${accepted ? "done" : "wait"}">${accepted ? "완료" : (done ? "재생성필요" : "미생성")}</span>
        ${done
          ? `<img loading="lazy" src="${item.icon}" alt="${ko} 전쟁 얼굴 아이콘">`
          : `<div class="missing">아이콘 대기</div>`}
      </div>
    </div>
    <div class="meta">
      <p class="name"><span>${ko}</span><small>${no} · ${id}</small></p>
      <p class="note">${done ? item.expression : "배경 없는 cute50 투명 PNG로 생성 예정"}</p>
      <a href="${refPath(id)}">반신 기준: ${refPath(id)}</a>
      ${done ? `<a href="${item.icon}">아이콘: ${item.icon}</a><a href="${item.source}">소스: ${item.source}</a>` : ""}
    </div>`;
  const ref = article.querySelector(".ref img");
  ref.addEventListener("error", () => {
    ref.replaceWith(Object.assign(document.createElement("div"), {
      className: "missing",
      textContent: "반신 없음"
    }));
  }, { once:true });
  grid.appendChild(article);
