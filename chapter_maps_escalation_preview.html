<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chapter Maps Escalation Preview</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #15110d;
      color: #f4dfb4;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 14px 18px;
      background: rgba(21, 17, 13, 0.94);
      border-bottom: 1px solid rgba(244, 223, 180, 0.18);
    }
    h1 { margin: 0; font-size: 18px; }
    .note {
      margin: 5px 0 0;
      color: #cdb98f;
      font-size: 12px;
    }
    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      padding: 16px;
      align-items: start;
    }
    figure {
      margin: 0;
      min-width: 0;
      background: #211913;
      border: 1px solid rgba(244, 223, 180, 0.16);
      border-radius: 8px;
      overflow: hidden;
    }
    figcaption {
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 800;
      line-height: 1.35;
    }
    figcaption span {
      display: block;
      margin-top: 2px;
      color: #cdb98f;
      font-size: 11px;
      font-weight: 700;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #0d0a07;
    }
  </style>
</head>
<body>
  <header>
    <h1>챕터 맵 난이도 상승 버전</h1>
    <p class="note">맑음 → 흐림 → 눈 → 폭우 → 홍수 → 사막 → 태풍 → 화재 → 화산 → 최종 재앙</p>
  </header>
  <main>
    <figure>
      <figcaption>Chapter 1 <span>맑은 봄</span></figcaption>
      <img src="./assets/maps_escalation/chapter1.png" alt="Chapter 1 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 2 <span>먹구름 산길</span></figcaption>
      <img src="./assets/maps_escalation/chapter2.png" alt="Chapter 2 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 3 <span>설원</span></figcaption>
      <img src="./assets/maps_escalation/chapter3.png" alt="Chapter 3 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 4 <span>폭우</span></figcaption>
      <img src="./assets/maps_escalation/chapter4.png" alt="Chapter 4 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 5 <span>홍수</span></figcaption>
      <img src="./assets/maps_escalation/chapter5.png" alt="Chapter 5 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 6 <span>사막</span></figcaption>
      <img src="./assets/maps_escalation/chapter6.png" alt="Chapter 6 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 7 <span>태풍</span></figcaption>
      <img src="./assets/maps_escalation/chapter7.png" alt="Chapter 7 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 8 <span>전쟁 화재</span></figcaption>
      <img src="./assets/maps_escalation/chapter8.png" alt="Chapter 8 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 9 <span>화산과 용암</span></figcaption>
      <img src="./assets/maps_escalation/chapter9.png" alt="Chapter 9 escalation map">
    </figure>
    <figure>
      <figcaption>Chapter 10 <span>최종 재앙 궁성</span></figcaption>
      <img src="./assets/maps_escalation/chapter10.png" alt="Chapter 10 escalation map">
    </figure>
  </main>
</body>
</html>
