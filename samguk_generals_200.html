<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      color-scheme: light;
      --ink: #211816;
      --muted: #74665e;
      --paper: #f6f1e7;
      --line: #ded1bd;
      --red: #aa2d32;
      --teal: #176965;
      --green: #55713a;
      --blue: #315f91;
      --gold: #b88222;
      --dark: #17110e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background:
        linear-gradient(90deg, rgba(33, 24, 22, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(33, 24, 22, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 34px 34px;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    .hero {
      min-height: 260px;
      display: grid;
      align-items: end;
      padding: 40px 22px 26px;
      color: #fff8e8;
      background:
        linear-gradient(120deg, rgba(23, 17, 14, 0.96), rgba(58, 30, 27, 0.9) 48%, rgba(31, 82, 77, 0.84)),
        repeating-linear-gradient(90deg, rgba(255, 248, 232, 0.08) 0 1px, transparent 1px 30px);
      background-size: cover;
      background-position: center 22%;
      border-bottom: 5px solid var(--red);
    }

    .hero-inner,
    .wrap {
      width: min(1160px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 72px);
      line-height: 0.95;
      letter-spacing: 0;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.38);
    }

    .hero-line {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 14px;
      color: #f3d892;
      font-size: 15px;
      font-weight: 800;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      padding: 0 11px;
      border: 1px solid rgba(255, 248, 232, 0.34);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.22);
      color: #fff8e8;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: rgba(246, 241, 231, 0.95);
      backdrop-filter: blur(12px);
    }

    .toolbar-inner {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding: 14px 22px;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffbf2;
      color: var(--ink);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(170, 45, 50, 0.13);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    button {
      height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffbf2;
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button.active {
      border-color: var(--red);
      background: var(--red);
      color: #fff8e8;
    }

    .tabs {
      width: min(1160px, 100%);
      margin: 0 auto;
      padding: 0 22px 14px;
      display: flex;
      gap: 8px;
    }

    .tab {
      min-width: 96px;
      background: #fff4de;
    }

    .tab.active {
      border-color: var(--dark);
      background: var(--dark);
      color: #fff8e8;
    }

    .wrap {
      padding: 22px;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      min-height: 76px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 251, 242, 0.82);
    }

    .stat strong {
      display: block;
      font-size: 26px;
      line-height: 1;
      color: var(--red);
    }

    .stat span {
      display: block;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(174px, 1fr));
      gap: 10px;
    }

    .card {
      min-width: 0;
      min-height: 106px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffbf2;
      box-shadow: 0 8px 18px rgba(33, 24, 22, 0.07);
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .force {
      padding: 3px 7px;
      border-radius: 999px;
      color: #fff;
      line-height: 1;
    }

    .force[data-force="위"] { background: var(--blue); }
    .force[data-force="촉"] { background: var(--green); }
    .force[data-force="오"] { background: var(--teal); }
    .force[data-force="군웅"] { background: var(--gold); }
    .force[data-force="황건"] { background: #8352a0; }
    .force[data-force="기타"] { background: #62564d; }

    .name {
      align-self: center;
      margin: 8px 0;
      font-size: 23px;
      font-weight: 900;
      letter-spacing: 0;
      word-break: keep-all;
    }

    .slug {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty {
      display: none;
      padding: 32px 0 40px;
      color: var(--muted);
      font-weight: 800;
      text-align: center;
    }

    .asset-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px;
    }

    .asset-card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffbf2;
      box-shadow: 0 8px 18px rgba(33, 24, 22, 0.07);
    }

    .asset-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 11px;
      border-bottom: 1px solid var(--line);
    }

    .asset-name {
      min-width: 0;
      font-size: 18px;
      font-weight: 900;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sprite-stage {
      height: 286px;
      display: grid;
      place-items: end center;
      padding: 12px 12px 8px;
      background:
        linear-gradient(90deg, rgba(33, 24, 22, 0.04) 1px, transparent 1px),
        linear-gradient(rgba(33, 24, 22, 0.04) 1px, transparent 1px),
        radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.9), rgba(238, 226, 207, 0.82) 56%, rgba(220, 204, 178, 0.88));
      background-size: 24px 24px, 24px 24px, 100% 100%;
    }

    .sprite-stage img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 13px 11px rgba(33, 24, 22, 0.24));
    }

    .render-pending {
      align-self: center;
      display: grid;
      gap: 8px;
      justify-items: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 900;
      text-align: center;
    }

    .render-pending strong {
      color: var(--red);
      font-size: 18px;
    }

    .asset-meta {
      display: grid;
      gap: 3px;
      padding: 9px 11px 11px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .asset-meta span {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .art-note {
      color: var(--gold);
    }

    .asset-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 0 11px 11px;
    }

    .asset-actions button {
      height: 34px;
      padding: 0 8px;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .hero {
        min-height: 225px;
        padding-top: 34px;
      }

      .toolbar-inner {
        grid-template-columns: 1fr;
      }

      .filters {
        justify-content: flex-start;
      }

      .tabs {
        overflow-x: auto;
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(138px, 1fr));
      }

      .name {
        font-size: 21px;
      }

      .asset-grid {
        grid-template-columns: repeat(auto-fill, minmax(154px, 1fr));
      }

      .sprite-stage {
        height: 236px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <h1>삼국지 장수 200명</h1>
      <div class="hero-line">
        <span class="badge">총 200명</span>
        <span class="badge" id="renderStatus">전신 200/200 완료</span>
        <span class="badge">위 · 촉 · 오 · 군웅 · 황건</span>

    </div>
  </header>

  <nav class="toolbar" aria-label="장수 필터">
    <div class="tabs" role="tablist" aria-label="보기 전환">

      <button class="tab" type="button" data-tab="art" role="tab" aria-selected="false">전신 이미지</button>
    </div>
    <div class="toolbar-inner">
      <input id="search" type="search" placeholder="이름 검색" autocomplete="off">
      <div class="filters" id="filters"></div>
    </div>
  </nav>

  <main class="wrap">

    </section>
    <section class="panel" id="artPanel">
      <section class="asset-grid" id="artGrid" aria-label="장수 200명 전신 이미지"></section>
    </section>
    <p class="empty" id="empty">검색 결과 없음</p>
  </main>

    const forceOrder = ["전체", "위", "촉", "오", "군웅", "황건", "기타"];
    const renderDir = "assets/generals/mobile_fullbody";
    const assetVersion = "20260516_fullbody_200_v2";
    let activeForce = "전체";
    let activeTab = "roster";
    const grid = document.querySelector("#grid");
    const artGrid = document.querySelector("#artGrid");
    const search = document.querySelector("#search");
    const filters = document.querySelector("#filters");
    const summary = document.querySelector("#summary");
    const empty = document.querySelector("#empty");
    const renderStatus = document.querySelector("#renderStatus");
    const tabs = [...document.querySelectorAll(".tab")];
    const panels = {
      roster: document.querySelector("#rosterPanel"),
      art: document.querySelector("#artPanel")
    };

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function renderFilters() {
      filters.innerHTML = forceOrder.map((force) => {
        return `<button type="button" class="${force === activeForce ? "active" : ""}" data-filter="${force}">${force}</button>`;
      }).join("");
    }

    function renderSummary(visible) {
      const total = visible.length;
      const counts = forceOrder.slice(1).map((force) => ({
        force,
        count: visible.filter((general) => general.force === force).length
      }));
      summary.innerHTML = [
        { force: "표시", count: total },
        ...counts.filter((item) => item.count > 0).slice(0, 3)
      ].map((item) => {
        return `<div class="stat"><strong>${item.count}</strong><span>${item.force}</span></div>`;
      }).join("");
    }

    function visibleGenerals() {
      const keyword = search.value.trim().toLowerCase();
      return generals.filter((general) => {
        const matchesForce = activeForce === "전체" || general.force === activeForce;
        const text = `${general.name} ${general.slug} ${general.force}`.toLowerCase();
        return matchesForce && text.includes(keyword);
      });
    }

    function renderGrid(visible) {
      grid.innerHTML = visible.map((general) => {
        const number = generals.indexOf(general) + 1;
        return `
          <article class="card">
            <div class="topline">
              <span>#${String(number).padStart(3, "0")}</span>
              <span class="force" data-force="${general.force}">${general.force}</span>
            </div>
            <div class="name">${general.name}</div>
            <div class="slug">${general.slug}</div>
          </article>
        `;
      }).join("");
    }

    function renderArtGrid(visible) {
      artGrid.innerHTML = visible.map((general) => {
        const number = generals.indexOf(general) + 1;
        const assetPath = `${renderDir}/${general.slug}.png`;
        const src = `${assetPath}?v=${assetVersion}`;
        return `
          <article class="asset-card" data-slug="${escapeHtml(general.slug)}">
            <div class="asset-head">
              <div class="asset-name">${escapeHtml(general.name)}</div>
              <span class="force" data-force="${general.force}">${general.force}</span>
            </div>
            <div class="sprite-stage">
              <img src="${escapeHtml(src)}" alt="${escapeHtml(general.name)} 전신 캐릭터" data-src="${escapeHtml(src)}" data-slug="${escapeHtml(general.slug)}">
            </div>
            <div class="asset-meta">
              <span>#${String(number).padStart(3, "0")} · ${escapeHtml(general.slug)}</span>
              <span>${escapeHtml(assetPath)}</span>
              <span class="art-note">신규 4-5등신 모바일 게임 PNG</span>
            </div>
          </article>
        `;
      }).join("");
      wireRenderImages();
    }

    function wireRenderImages() {
      let failed = 0;
      const updateStatus = () => {
        renderStatus.textContent = `전신 ${generals.length - failed}/${generals.length} 완료`;
      };
      updateStatus();
      artGrid.querySelectorAll("img[data-src]").forEach((img) => {
        img.addEventListener("error", () => {
          failed += 1;
          const stage = img.closest(".sprite-stage");
          stage.innerHTML = `
            <div class="render-pending">
              <strong>렌더 대기</strong>
              <span>${escapeHtml(img.dataset.slug)}.png</span>
            </div>
          `;
          updateStatus();
        }, { once: true });
      });
    }

    function renderViews() {
      const visible = visibleGenerals();
      renderGrid(visible);
      renderArtGrid(visible);
      empty.style.display = visible.length ? "none" : "block";
      renderSummary(visible);
    }

    function switchTab(tabName) {
      activeTab = tabName;
      tabs.forEach((tab) => {
        const selected = tab.dataset.tab === activeTab;
        tab.classList.toggle("active", selected);
        tab.setAttribute("aria-selected", String(selected));
      });
      Object.entries(panels).forEach(([name, panel]) => {
        panel.classList.toggle("active", name === activeTab);
      });
    }

    filters.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-filter]");
      if (!button) return;
      activeForce = button.dataset.filter;
      renderFilters();
      renderViews();
    });

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        location.hash = tab.dataset.tab === "art" ? "art" : "roster";
        switchTab(tab.dataset.tab);
      });
    });

    window.addEventListener("hashchange", () => {
      switchTab(location.hash === "#art" ? "art" : "roster");
    });

    search.addEventListener("input", renderViews);
    renderFilters();
    renderViews();
    switchTab(location.hash === "#art" ? "art" : "roster");
  </script>
