<title>General Halfbody Rework v9/v10</title>
<style>
* { box-sizing:border-box; }
:root {
  color-scheme:dark;
  --bg:#120f0b;
  --panel:#211913;
  --line:rgba(244,223,184,.18);
  --gold:#ffd36a;
  --text:#f4dfb8;
  --muted:#bfa986;
  --wait:#ffb46b;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:5;
  padding:16px 20px 13px;
  background:rgba(18,15,11,.95);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.top {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:14px;
  flex-wrap:wrap;
}
h1 {
  margin:0;
  font-size:22px;
  font-weight:850;
  letter-spacing:0;
}
.count {
  color:var(--muted);
  font-size:13px;
  line-height:1.45;
}
.note {
  margin-top:6px;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
main { padding:18px 20px 28px; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:14px;
}
article {
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:8px;
  background:var(--panel);
  box-shadow:0 10px 22px rgba(0,0,0,.22);
}
.art {
  position:relative;
  display:grid;
  place-items:end center;
  aspect-ratio:4/5;
  overflow:hidden;
  background:
    linear-gradient(45deg, rgba(255,255,255,.055) 25%, transparent 25%),
    linear-gradient(-45deg, rgba(255,255,255,.055) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, rgba(255,255,255,.055) 75%),
    linear-gradient(-45deg, transparent 75%, rgba(255,255,255,.055) 75%),
    #17110d;
  background-size:24px 24px;
  background-position:0 0, 0 12px, 12px -12px, -12px 0;
}
.art img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}
.badge {
  position:absolute;
  z-index:1;
  left:8px;
  top:8px;
  padding:3px 7px 4px;
  border-radius:6px;
  background:rgba(13,9,6,.78);
  border:1px solid rgba(255,211,106,.32);
  color:var(--gold);
  font-size:10px;
  font-weight:850;
}
.missing {
  display:grid;
  place-items:center;
  width:100%;
  height:100%;
  padding:14px;
  color:var(--wait);
  font-size:12px;
  font-weight:850;
  text-align:center;
}
.meta {
  padding:10px 12px 12px;
}
.name {
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  margin:0;
  font-size:16px;
  font-weight:850;
}
.name small {
  color:#9e8a67;
  font-size:11px;
  font-weight:750;
}
@media (max-width:720px) {
  header { padding:14px 12px 12px; }
  main { padding:12px; }
  .grid { grid-template-columns:1fr 1fr; gap:10px; }
  .name { font-size:14px; }
}
</style>
