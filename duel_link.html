<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>일기토 연결 — 전쟁 → 일기토 흐름</title>
<!--
  본편(index.html, 45,743줄)에 바로 손대기 전에 **흐름만** 먼저 세워 보는 화면이다.
  여기서 확정된 것을 그대로 본편으로 옮긴다.

  흐름
    전쟁 진행 중 → (2.5초) 적장이 일기토를 청한다 → 수락 / 거부
      거부 → 아군 사기 하락(병력 -10%) 후 전쟁 계속
      수락 → 내 장수 고르기(스트리트파이터식) → 일기토(iframe) → 결과 반영

  규칙
    · 일기토를 치를 수 있는 내 장수가 하나도 없으면 **신청 자체가 안 들어온다**.
      수락할 수 없는 제안을 띄우면 '거부' 밖에 못 고르는 가짜 선택이 된다.
    · 적장은 본편의 makeEnemyInstance 와 같은 모양이다 — id · stars · lv.
-->
<style>
:root{
  --gold:#ffd45c; --line:rgba(255,205,120,.22);
  --panel:linear-gradient(180deg,rgba(22,15,9,.94),rgba(10,6,4,.96));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a0705;color:#f2e4cf;overflow:hidden;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Malgun Gothic",system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;user-select:none}
#wrap{position:relative;width:100vw;height:100dvh;max-width:560px;margin:0 auto;overflow:hidden}

/* ── 전쟁 화면(가짜) ─────────────────────────────────────── */
#war{position:absolute;inset:0;
  background:
    radial-gradient(120% 80% at 50% 30%,rgba(60,40,20,.5),rgba(6,4,3,.9)),
    url('./assets/arcade_duel/pixel_war_stage_v2.webp') center/cover no-repeat;
  filter:saturate(.85)}
#war::after{content:'';position:absolute;inset:0;background:rgba(6,4,3,.35)}
#warHud{position:absolute;left:0;right:0;top:0;padding:14px 16px;z-index:2;
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  text-shadow:0 2px 0 #000}
#warHud b{font-size:17px;color:var(--gold);letter-spacing:.04em}
#warHud small{display:block;font-size:11.5px;color:#c2a97f;font-weight:600}
.troop{min-width:132px}
.tbar{height:12px;border:2px solid #c9a86a;background:#0a0503;padding:2px;
  box-shadow:inset 0 2px 6px #000}
.tbar i{display:block;height:100%;background:linear-gradient(#8fe87a,#2f8f45);
  transition:width .5s ease}
.tbar.foe i{background:linear-gradient(#ff9b6a,#c0392b)}
#warLog{position:absolute;left:16px;right:16px;bottom:18px;z-index:2;
  font-size:12.5px;color:#d8c39c;text-shadow:0 1px 2px #000;line-height:1.7}
#warLog div{opacity:.55}
#warLog div:last-child{opacity:1;color:#ffe6b0;font-weight:700}


/* ── 적군 사기 붕괴 표시 ────────────────────────────────────
   보상은 눈에 보여야 보상이다. 붉은 띠로 화면 위쪽을 가로질러 놓고,
   게이지가 줄어드는 걸 계속 보여 준다 — "지금 밀어붙여라" 가 읽히게. */
#morale{position:absolute;right:12px;top:78px;z-index:3;width:min(196px,54vw);
  padding:8px 11px 9px;border-radius:12px;text-align:left;
  background:linear-gradient(180deg,rgba(120,18,12,.94),rgba(60,8,6,.96));
  border:1px solid #ff6a4a;
  box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 26px rgba(255,70,40,.35),
             inset 0 1px 0 rgba(255,255,255,.16);
  animation:mIn .3s cubic-bezier(.15,1.3,.4,1) both, mPulse 1s ease-in-out infinite}
#morale[hidden]{display:none}
@keyframes mIn{from{opacity:0;transform:translateY(-10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes mPulse{0%,100%{box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 22px rgba(255,70,40,.28),inset 0 1px 0 rgba(255,255,255,.16)}
  50%{box-shadow:0 8px 24px rgba(0,0,0,.6),0 0 40px rgba(255,90,50,.6),inset 0 1px 0 rgba(255,255,255,.16)}}
#morale .mtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#morale .mtop b{font-size:13.5px;font-weight:900;color:#ffd9cd;letter-spacing:.06em;
  text-shadow:0 2px 0 #3a0703}
#morale .mtop span{font-size:20px;font-weight:900;color:#fff;line-height:1;
  text-shadow:0 2px 0 #3a0703,0 0 14px rgba(255,120,80,.8)}
#morale .mbar{height:9px;margin:6px 0 5px;border-radius:5px;overflow:hidden;
  background:rgba(0,0,0,.55);box-shadow:inset 0 2px 5px rgba(0,0,0,.7)}
#morale .mbar i{display:block;height:100%;width:100%;
  background:linear-gradient(90deg,#ff3a20,#ff9a5c);
  box-shadow:0 0 12px rgba(255,90,40,.9);transition:width .1s linear}
#morale .msub{font-size:11px;color:#ffb9a4;font-weight:700}
#morale .msub b{color:#fff2c0}
/* ── 공통 시트 ──────────────────────────────────────────── */
.sheet{position:absolute;inset:0;z-index:5;display:none;
  background:rgba(6,4,3,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet.on{display:block}

/* ── 일기토 신청 ────────────────────────────────────────── */
#chal{place-items:center;padding:20px}
#chal.on{display:grid}
#chal .card{width:min(420px,92vw);padding:20px 18px 18px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 20px 50px rgba(0,0,0,.7);text-align:center;
  animation:pop .34s cubic-bezier(.15,1.3,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.88) translateY(14px)}to{opacity:1;transform:none}}
#chal .por{width:118px;height:118px;margin:0 auto 10px;border-radius:50%;overflow:hidden;
  border:2px solid #a8763a;box-shadow:0 0 0 4px rgba(0,0,0,.5),0 0 26px rgba(255,140,60,.35)}
#chal .por img{width:100%;height:100%;object-fit:cover;object-position:top}
#chal .who{font-size:13px;color:#c2a97f;font-weight:700}
#chal .nm{font-size:23px;font-weight:900;color:var(--gold);letter-spacing:.04em;margin:2px 0 4px}
#chal .grade{font-size:13px;font-weight:900;letter-spacing:.08em}
#chal .say{margin:12px 0 4px;font-size:15px;font-weight:700;color:#fff3dc}
#chal .warn{font-size:12px;color:#c08a5a;margin-top:8px;line-height:1.5}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn{padding:14px 10px;border:0;border-radius:12px;font:inherit;font-weight:900;
  font-size:16px;letter-spacing:.06em;cursor:pointer}
.btn.ok{background:linear-gradient(#e8ab2c,#a86a10);color:#2a1200;
  box-shadow:0 4px 0 #4a2a06,0 10px 22px rgba(0,0,0,.5)}
.btn.no{background:linear-gradient(#3b3229,#1d1712);color:#e2d3ba;
  border:1px solid rgba(255,205,120,.18);box-shadow:0 4px 0 #120d09}
.btn:active{transform:translateY(3px);box-shadow:none}

/* ── 장수 고르기 ────────────────────────────────────────── */
#pick{overflow:auto;-webkit-overflow-scrolling:touch}
#pick.on{display:block}
#pick .hd{position:sticky;top:0;z-index:2;padding:14px 16px 10px;
  background:linear-gradient(180deg,rgba(10,6,4,.98),rgba(10,6,4,.86));
  border-bottom:1px solid var(--line)}
#pick .hd b{font-size:18px;color:var(--gold);letter-spacing:.06em}
#pick .hd small{display:block;font-size:12px;color:#c2a97f;margin-top:2px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px;padding:14px 14px 96px}
.card2{position:relative;border-radius:12px;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,#1b1109,#0b0705);
  border:1px solid rgba(255,205,120,.16);transition:transform .1s ease}
.card2:active{transform:scale(.96)}
.card2.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 0 22px rgba(255,190,80,.45)}
.card2 .im{aspect-ratio:1/1;overflow:hidden;background:#160e07}
.card2 .im img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.card2 .nm{padding:5px 4px 6px;text-align:center;font-size:12.5px;font-weight:800;color:#ffe6a8}
.card2 .gd{position:absolute;left:4px;top:4px;font-size:11px;font-weight:900;
  text-shadow:0 1px 2px #000;letter-spacing:-.5px}
.card2 .pw{position:absolute;right:4px;top:4px;font-size:10.5px;font-weight:800;
  color:#ffd9a0;background:rgba(0,0,0,.55);border-radius:5px;padding:1px 5px}
#pickBar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(10,6,4,.6),rgba(10,6,4,.98));
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  max-width:560px;margin:0 auto}
#pickInfo{font-size:13px;color:#c2a97f}
#pickInfo b{color:var(--gold)}

/* ── 결과 ───────────────────────────────────────────────── */
#res{place-items:center;padding:20px}
#res.on{display:grid}
#res .card{width:min(400px,92vw);padding:22px 18px;border-radius:16px;text-align:center;
  background:var(--panel);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.7);
  animation:pop .34s cubic-bezier(.15,1.3,.4,1) both}
#res h2{margin:0 0 6px;font-size:30px;letter-spacing:.12em}
#res .eff{margin:12px 0 0;font-size:14px;color:#ffdca6;line-height:1.7}
#res .eff b{color:var(--gold)}

iframe#duel{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:20;
  display:none;background:#000}
iframe#duel.on{display:block}
</style>

<div id="wrap">
  <div id="war"></div>
  <div id="warHud">
    <div class="troop"><b>아군</b><small>1군 · 조운 부대</small>
      <div class="tbar"><i id="myBar" style="width:100%"></i></div></div>
    <div class="troop" style="text-align:right"><b>적군</b><small id="foeCastle">호뢰관</small>
      <div class="tbar foe"><i id="foeBar" style="width:100%"></i></div></div>
  </div>
  <!-- 일기토 승리 보상 — 적군 전체 사기 붕괴. 눈에 안 보이면 보상이 아니다. -->
  <div id="morale" hidden>
    <div class="mtop"><b>적군 사기 붕괴</b><span id="mSec">10</span></div>
    <div class="mbar"><i id="mFill"></i></div>
    <div class="msub">적 공격력 · 방어력 <b>30%</b> 감소</div>
  </div>

  <div id="warLog"></div>

  <div class="sheet" id="chal">
    <div class="card">
      <div class="por"><img id="chalImg" alt=""></div>
      <div class="who">적장</div>
      <div class="nm" id="chalName">—</div>
      <div class="grade" id="chalGrade">—</div>
      <div class="say" id="chalSay">—</div>
      <div class="warn" id="chalWarn">베어 넘기면 <b>적군의 사기가 무너진다</b><br>패하면 사로잡혀 이번 전투에는 나서지 못한다</div>
      <div class="btns">
        <button class="btn no" id="btnNo">거 부</button>
        <button class="btn ok" id="btnYes">수 락</button>
      </div>
    </div>
  </div>

  <div class="sheet" id="pick">
    <div class="hd"><b>누구를 내보낼 것인가</b>
      <small id="pickSub">일기토를 치를 수 있는 장수만 보인다</small></div>
    <div id="grid"></div>
    <div id="pickBar">
      <div id="pickInfo">장수를 고르시오</div>
      <button class="btn ok" id="btnGo" disabled style="opacity:.45">출 전</button>
    </div>
  </div>

  <div class="sheet" id="res">
    <div class="card">
      <h2 id="resTitle">—</h2>
      <div id="resLine" style="color:#d8c39c;font-size:14px"></div>
      <div class="eff" id="resEff"></div>
      <div class="btns" style="grid-template-columns:1fr">
        <button class="btn ok" id="btnBack">전장으로</button>
      </div>
    </div>
  </div>

  <iframe id="duel" allow="autoplay"></iframe>
</div>

<script>
const $ = id => document.getElementById(id);

// 본편 STAR_META 와 같은 값 — 등급 색은 한 군데서만 정해져야 한다
const STAR_META = [null,
  { label:'일반', color:'#f4f7fb' }, { label:'고급', color:'#57f287' },
  { label:'희귀', color:'#4db5ff' }, { label:'영웅', color:'#c77dff' },
  { label:'전설', color:'#ffd36a' }, { label:'다이아몬드', color:'#9fe8ff' }];
const STAR_MULT    = [1,1,1.2,1.4,1.7,2.0,2.5];
const ENHANCE_MULT = [1,1,1.2,1.4,1.6,1.8,2.0];
// 받침이 있으면 '이/을/은', 없으면 '가/를/는'. 한글 코드에서 종성을 직접 본다.
// '유비이(가)' 같은 표기는 어색하다 — 이름은 데이터로 정해져 있으니 골라 쓸 수 있다.
function josa(word, pair) {
  const c = String(word || '').charCodeAt((word || '').length - 1);
  const has = c >= 0xac00 && c <= 0xd7a3 ? (c - 0xac00) % 28 !== 0 : true;
  const [withF, noF] = pair;           // ['이','가'] / ['을','를'] / ['은','는']
  return has ? withF : noF;
}
const 이가 = w => w + josa(w, ['이', '가']);
const 을를 = w => w + josa(w, ['을', '를']);

const gradeText = (st,lv) => (st===6?'◆ 다이아몬드':'★'.repeat(st)) + (lv>1?' +'+(lv-1):'');
const power = (g,st,lv) => Math.round((g.war||80) * STAR_MULT[st] * ENHANCE_MULT[lv]);

let ROSTER = [];      // 일기토 그림이 있는 장수(현재 49명)
let MINE = [];        // 내가 가진 장수 중 일기토 가능한 것
let foe = null, mine = null, myTroops = 100, foeTroops = 100;
let foeAtk = 1;      // 적군 전투력 배수 — 사기가 무너지면 0.7 이 된다

const log = t => {
  const el = $('warLog');
  el.insertAdjacentHTML('beforeend', '<div>' + t + '</div>');
  while (el.children.length > 4) el.removeChild(el.firstChild);
};
const show = (id,on) => $(id).classList.toggle('on', !!on);
const bars = () => { $('myBar').style.width = myTroops+'%'; $('foeBar').style.width = foeTroops+'%'; };
const face = id => './assets/generals/halfbody_v6/' + id + '.webp';

// 주소로 흐름을 조절할 수 있게 — 시연·검증용
//   ?none=1   내 장수가 하나도 없을 때(신청이 안 들어와야 한다)
//   ?delay=5  몇 초 뒤에 신청이 오는가 (기본 2.5)
//   ?own=8    내가 가진 장수 수 (기본 10)
const Q = new URLSearchParams(location.search);

let LINES = { lines: {}, _default: ['이름을 말해라. 기억해 두겠다.','말이 많구나. 칼로 하자.'] };
fetch('./assets/arcade_duel/lines.json').then(r=>r.json()).then(d=>{LINES=d;}).catch(()=>{});

fetch('./assets/arcade_duel/generals.json').then(r=>r.json()).then(list => {
  ROSTER = list;
  const ownN = Q.get('none') === '1' ? 0 : Math.max(0, +(Q.get('own')||10));
  // 시연용 보유 장수 — 본편에서는 SAVE.generals 중 일기토 그림이 있는 것만 고른다
  const sh = list.slice().sort(()=>Math.random()-0.5);
  MINE = sh.slice(0, ownN).map(g => ({
    g, stars: 1 + (Math.random()*5|0), lv: 1 + (Math.random()*4|0),
  })).sort((a,b)=>power(b.g,b.stars,b.lv)-power(a.g,a.stars,a.lv));

  bars();
  log('전투 개시 — 적 성으로 진군한다');
  setTimeout(() => log('성벽에 접근했다'), 1200);
  setTimeout(offerDuel, Math.max(600, (+(Q.get('delay')||2.5))*1000));
});

function offerDuel() {
  // 규칙: 치를 장수가 없으면 신청 자체가 안 들어온다.
  // 수락할 수 없는 제안은 '거부' 밖에 못 고르는 가짜 선택이다.
  if (!MINE.length) {
    log('적장이 이쪽을 살피더니 그대로 물러섰다');
    log('<span style="color:#c08a5a">— 내보낼 장수가 없어 일기토가 성립하지 않는다</span>');
    return;
  }
  const g = ROSTER[Math.random()*ROSTER.length|0];
  foe = { g, stars: 1 + (Math.random()*5|0), lv: 1 + (Math.random()*4|0) };
  const m = STAR_META[foe.stars];
  $('chalImg').src = face(g.id);
  $('chalName').textContent = g.name;
  $('chalGrade').textContent = gradeText(foe.stars, foe.lv) + ' · ' + m.label;
  $('chalGrade').style.color = m.color;
  // 그 장수가 실제로 하는 말을 쓴다 — 49명분을 이미 써 뒀다.
  const line = (LINES.lines || {})[g.id] || LINES._default || [];
  $('chalSay').textContent = '「' + (line[0] || (이가(g.name) + ' 앞을 막아선다.')) + '」';
  show('chal', true);
}

// 거부에는 대가가 없다. 대가는 '수락해서 이겼을 때만 얻는 것' 쪽에 둔다 —
// 지는 쪽을 벌하면 약한 장수뿐인 사람은 아예 안 하게 되고, 그러면
// 일기토를 만든 목적(수집·강화 동기)과 정반대가 된다.
$('btnNo').onclick = () => {
  show('chal', false);
  log('일기토를 거부했다 — 적장이 코웃음을 치며 물러선다');
  setTimeout(offerDuel, 6000);   // 적은 다시 청할 수 있다
};

$('btnYes').onclick = () => { show('chal', false); openPick(); };

function openPick() {
  const grid = $('grid');
  grid.innerHTML = MINE.map((o,i) => {
    const m = STAR_META[o.stars];
    return '<div class="card2" data-i="'+i+'">'
      + '<div class="im"><img loading="lazy" src="'+face(o.g.id)+'" alt=""></div>'
      + '<div class="gd" style="color:'+m.color+'">'+gradeText(o.stars,o.lv)+'</div>'
      + '<div class="pw">'+power(o.g,o.stars,o.lv)+'</div>'
      + '<div class="nm">'+o.g.name+'</div></div>';
  }).join('');
  $('pickSub').textContent = '보유 ' + MINE.length + '명 · 상대는 '
    + foe.g.name + ' (' + gradeText(foe.stars,foe.lv) + ')';
  mine = null; $('btnGo').disabled = true; $('btnGo').style.opacity = .45;
  $('pickInfo').textContent = '장수를 고르시오';
  grid.querySelectorAll('.card2').forEach(el => el.onclick = () => {
    grid.querySelectorAll('.card2').forEach(x=>x.classList.remove('sel'));
    el.classList.add('sel');
    mine = MINE[+el.dataset.i];
    $('btnGo').disabled = false; $('btnGo').style.opacity = 1;
    $('pickInfo').innerHTML = '<b>'+mine.g.name+'</b> 출전 — 전투력 '
      + power(mine.g,mine.stars,mine.lv) + ' vs ' + power(foe.g,foe.stars,foe.lv);
  });
  show('pick', true);
}

$('btnGo').onclick = () => { if (mine) { show('pick', false); openDuel(); } };

function openDuel() {
  const q = new URLSearchParams({
    embed: '1',
    p: mine.g.id, b: foe.g.id,
    pStar: mine.stars, pLv: mine.lv, bStar: foe.stars, bLv: foe.lv,
  });
  const fr = $('duel');
  fr.src = './duel_v2.html?' + q.toString();
  fr.classList.add('on');
}

let lastResult = null;
addEventListener('message', e => {
  const d = e.data;
  if (!d || d.src !== 'duel') return;
  if (d.type === 'result') lastResult = d;
  if (d.type === 'close') {
    $('duel').classList.remove('on');
    $('duel').src = 'about:blank';
    applyResult(lastResult);
    lastResult = null;
  }
});

// ── 일기토 결과를 전장에 반영한다 ──────────────────────────
// 규칙은 두 줄뿐이다. 계산할 게 없어야 플레이어가 납득한다.
//   이기면 → 적군 **전체**의 사기가 무너진다(공격력·방어력 30% 감소, 10초)
//   지면   → 내 장수가 이번 전투에서 빠진다
// 병력 수는 어느 쪽도 건드리지 않는다. 성마다 병력이 10~40명으로 제각각이라
// 인원이나 비율로 주면 '누구는 더 받았다'가 생긴다. 배수는 어디서나 같다.
const MORALE_CUT = 0.30, MORALE_SEC = 10;
let moraleT = 0;

function startMoraleBreak() {
  const el = $('morale'), fill = $('mFill'), sec = $('mSec');
  el.hidden = false;
  const t0 = performance.now();
  clearInterval(moraleT);
  moraleT = setInterval(() => {
    const left = MORALE_SEC - (performance.now() - t0) / 1000;
    if (left <= 0) {
      clearInterval(moraleT); el.hidden = true;
      foeAtk = 1; log('적군이 전열을 되찾았다');
      return;
    }
    fill.style.width = (left / MORALE_SEC * 100) + '%';
    sec.textContent = Math.ceil(left);
  }, 100);
  foeAtk = 1 - MORALE_CUT;
}

function applyResult(r) {
  const kind = r ? r.kind : 'draw';
  const t = $('resTitle'), eff = $('resEff');
  if (kind === 'win') {
    t.textContent = '승 리'; t.style.color = '#ffd45c';
    $('resLine').textContent = r.hap + '합 만에 ' + 을를(foe.g.name) + ' 사로잡았다.';
    eff.innerHTML = '적군 전체의 사기가 무너진다<br>'
      + '<b>10초간</b> 적 공격력 · 방어력 <b>30%</b> 감소<br>'
      + '<span style="color:#9fe8ff">사로잡은 ' + foe.g.name + ', 전투가 끝나면 휘하로 들일 수 있다</span>';
    log('일기토 승리 — ' + 을를(foe.g.name) + ' 사로잡았다');
    startMoraleBreak();
  } else if (kind === 'lose') {
    t.textContent = '패 배'; t.style.color = '#ff8a5c';
    $('resLine').textContent = r.hap + '합을 겨루었으나 사로잡혔다.';
    eff.innerHTML = '<b>' + mine.g.name + '</b>, 사로잡혀 이번 전투에는 나서지 못한다<br>'
      + '<span style="color:#c2a97f">병력은 그대로다</span>';
    // 진 장수는 이번 전투 동안 못 쓴다 — 목록에서 뺀다
    MINE = MINE.filter(o => o !== mine);
    log('일기토 패배 — ' + 이가(mine.g.name) + ' 사로잡혔다');
  } else {
    t.textContent = '무 승 부'; t.style.color = '#d8c39c';
    $('resLine').textContent = '승부가 나지 않았다.';
    eff.innerHTML = '양쪽 모두 물러섰다 — <b>변화 없음</b>';
    log('일기토 무승부');
  }
  bars();
  show('res', true);
}

$('btnBack').onclick = () => {
  show('res', false);
  log('전투를 재개한다');
};
</script>
