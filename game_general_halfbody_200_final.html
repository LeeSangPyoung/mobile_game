<style>
:root{color-scheme:dark;--bg:#08111c;--panel:#101d2c;--panel2:#132338;--line:#2a405c;--text:#edf4ff;--muted:#b7c6d9;--gold:#d9b55d;--ok:#75d485;--wait:#8796aa;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(8,17,28,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
h1{margin:0;font-size:20px;letter-spacing:0;white-space:nowrap}
.stat{color:var(--muted);font-size:13px;white-space:nowrap}
.search{margin-left:auto;min-width:220px;width:min(420px,34vw);background:#0c1725;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;outline:none}
main{padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.stage{height:280px;position:relative;background-color:#07111d;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:32px 32px;display:flex;align-items:flex-end;justify-content:center}
.stage img{width:100%;height:100%;object-fit:contain;object-position:center bottom;display:block}
.empty{height:100%;display:flex;align-items:center;justify-content:center;color:var(--wait);font-weight:800;font-size:15px}
.meta{padding:13px 14px 14px;background:var(--panel2);min-height:118px}
.name{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:21px;line-height:1.2}
.no{color:var(--gold);font-size:16px;min-width:42px}
code{display:block;margin-top:12px;color:var(--muted);font:600 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
small{display:block;margin-top:10px;color:var(--muted);font-size:13px;line-height:1.4}
.done small.status{color:var(--ok)}
.waiting small.status{color:var(--wait)}
.hidden{display:none}
@media(max-width:680px){header{align-items:stretch;flex-wrap:wrap}h1{width:100%}.search{margin-left:0;width:100%}main{padding:12px}.grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.stage{height:220px}.meta{min-height:108px;padding:11px}.name{font-size:18px}}
</style>

const stat=document.getElementById('stat');
async function exists(src){try{const r=await fetch(src,{method:'HEAD',cache:'no-store'});return r.ok;}catch(e){return false;}}
function card(item){
 const el=document.createElement('article');
 el.className='card waiting';
 el.dataset.q=`${item.no} ${item.ko} ${item.id}`.toLowerCase();
 const src=`assets/generals/halfbodies/${item.id}.png?v=${version}`;
 el.innerHTML=`<div class="stage"><div class="empty">생성 대기</div></div><div class="meta"><div class="name"><span class="no">${String(item.no).padStart(3,'0')}.</span><span>${item.ko}</span></div><code>${item.id}</code><small class="status">halfbody pending</small></div>`;
 exists(src).then(ok=>{if(ok){el.classList.remove('waiting');el.classList.add('done');el.querySelector('.stage').innerHTML=`<img loading="lazy" src="${src}" alt="${item.ko}">`;el.querySelector('.status').textContent='halfbody ready';updateStat();}});
 return el;
}
const cards=roster.map(card);cards.forEach(el=>grid.appendChild(el));
function updateStat(){const done=document.querySelectorAll('.card.done').length;stat.textContent=`반신 PNG · 640x768 · ${done} / ${roster.length} 완료`;}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();cards.forEach(el=>el.classList.toggle('hidden',q&&!el.dataset.q.includes(q)));});
updateStat();
