<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일기토 액션 테스트</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;background:#070604;color:#ffe9b0;font-family:"Malgun Gothic","Noto Sans KR",system-ui,sans-serif}
body{display:grid;place-items:center}
#wrap{position:relative;width:min(100vw,960px);height:min(100dvh,540px);background:#000;box-shadow:0 0 0 2px #2a1c10,0 18px 60px #000;overflow:hidden}
#wrap:fullscreen,#wrap:-webkit-full-screen{width:100vw;height:100dvh;max-width:none;max-height:none}
canvas{display:block;width:100%;height:100%;image-rendering:auto;background:#1b120a;touch-action:none}
#hud{position:absolute;left:14px;right:14px;top:10px;display:grid;grid-template-columns:1fr 74px 1fr;gap:8px;align-items:start;pointer-events:none;filter:drop-shadow(0 4px 0 #000b)}
.bar{position:relative;height:50px;padding:6px 10px 8px;border:3px solid #55a9e8;border-radius:2px;background:linear-gradient(180deg,#0b57a2 0%,#073271 45%,#04143b 100%);box-shadow:inset 0 0 0 2px #9de2ff55,inset 0 -13px #0009,0 0 0 2px #031024,0 0 18px #000d}
.bar,.name,.name span{min-width:0}
.bar.low{border-color:#ffb347;box-shadow:inset 0 0 0 2px #fff1a833,inset 0 -13px #0009,0 0 0 2px #031024,0 0 16px #ff9b3280}
.bar.critical{border-color:#ff6b62;box-shadow:inset 0 0 0 2px #ffd0ca44,inset 0 -13px #0009,0 0 0 2px #260607,0 0 18px #ff352b99}.bar.enemy.critical{border-color:#ff8b4f;box-shadow:inset 0 0 0 2px #ffe0ba44,inset 0 -13px #0009,0 0 0 2px #260b04,0 0 18px #ff5c2b99}
.bar.exhausted{border-color:#ff5b3d;box-shadow:inset 0 0 0 2px #fff1a833,inset 0 -13px #0009,0 0 0 2px #031024,0 0 18px #ff2e1f88}
.bar.pressure{border-color:#fff06a;box-shadow:inset 0 0 0 2px #fff1a833,inset 0 -13px #0009,0 0 0 2px #031024,0 0 20px #ffe76699}
.bar:before{content:"";position:absolute;left:8px;right:8px;bottom:7px;height:16px;border:2px solid #020713;background:#061326;box-shadow:inset 0 2px 5px #000}
.bar.enemy{text-align:right}
.name{position:relative;z-index:2;display:flex;justify-content:space-between;gap:10px;align-items:center;height:16px;font-weight:900;font-size:14px;color:#fff4b8;text-shadow:2px 2px 0 #000,0 0 6px #000;letter-spacing:.2px}.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name small{font-size:10px;color:#f8cf62;text-transform:uppercase}.enemy .name{flex-direction:row-reverse}
.hp{position:absolute;z-index:1;left:11px;right:11px;bottom:9px;height:13px;border:1px solid #000;background:#120805;overflow:hidden}
.hp i{display:block;height:100%;width:100%;background:repeating-linear-gradient(90deg,#77f257 0 8px,#56d83b 8px 13px,#163712 13px 15px);transition:width .10s linear;box-shadow:inset 0 2px #fff8,0 0 10px #5cff39aa}
.enemy .hp i{margin-left:auto;background:linear-gradient(90deg,#d32720 0%,#ff7b29 28%,#ffd33e 58%,#fff06a 100%)}
.sp{position:absolute;z-index:2;left:11px;right:11px;bottom:3px;height:3px;background:#020202;overflow:hidden}
.sp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#76d7ff,#f3e278);transition:width .10s linear}
.bar.low .sp i{background:linear-gradient(90deg,#ff9a32,#ffe06a)}
.bar.exhausted .sp i{background:linear-gradient(90deg,#ff352a,#ff9a45)}
.bar.pressure .sp i{background:linear-gradient(90deg,#ffd43b,#ff6a28)}
#round{height:50px;display:grid;place-items:center;border:3px solid #55a9e8;border-radius:2px;background:linear-gradient(180deg,#0b57a2,#04143b);box-shadow:inset 0 0 0 2px #9de2ff55,0 0 0 2px #031024,0 0 18px #000c;color:#fff1a8;font-size:13px;font-weight:900;text-shadow:2px 2px 0 #000;letter-spacing:2px;white-space:nowrap}
#help{position:absolute;left:10px;right:10px;bottom:8px;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 10px;border:2px solid #55a9e8;background:#061226dd;outline:2px solid #031024;font-size:12px;font-weight:900;text-shadow:0 2px #000;pointer-events:none}
#help b{color:#ffd15d}#msg{color:#fff0c2;text-align:right}
#loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#05080eef;color:#fff0b8;font-size:16px;font-weight:900;letter-spacing:1px;text-shadow:0 2px #000;transition:opacity .24s ease}
#loading[hidden]{display:none}#loading.ready{opacity:0;pointer-events:none}#loading.error{color:#ffb59f}
#loading>div{display:grid;gap:14px;place-items:center;text-align:center}.loading-progress{width:min(360px,82%);padding:18px;border:2px solid #55a9e8;background:#061226;box-shadow:0 12px 40px #000}.load-track{width:100%;height:12px;padding:2px;border:1px solid #9de2ff;background:#020713}.load-track i{display:block;width:0;height:100%;background:linear-gradient(90deg,#55a9e8,#ffe071);transition:width .15s ease}#loading.error>div{width:min(360px,90%);padding:20px;border:3px solid #d76a5b;outline:3px solid #260a04;background:#160b10;box-shadow:0 16px 50px #000}#loading button{min-height:44px;padding:9px 18px;border:2px solid #fff0ad;background:#d28b18;color:#241000;font-weight:900;cursor:pointer}#loading button:focus-visible{outline:3px solid #9de2ff;outline-offset:4px}
#session{position:absolute;inset:0;z-index:18;display:grid;place-items:safe center;padding:24px;overflow-y:auto;background:linear-gradient(#02060bd9,#120703e8);text-align:center}
#session[hidden]{display:none}.session-card{width:min(430px,92%);padding:24px 22px;border:3px solid #55a9e8;outline:3px solid #031024;background:linear-gradient(180deg,#0b3c70ee,#061226f5);box-shadow:0 16px 50px #000, inset 0 0 0 2px #9de2ff44}
#session h1{margin:0 0 8px;color:#ffe071;font-size:30px;letter-spacing:5px;text-shadow:3px 3px #000}#session p{margin:0 0 18px;color:#d9ecff;font-size:13px;line-height:1.7;word-break:keep-all}
#sessionText .result-rank{display:block;margin:4px 0 7px;color:#ffe071;font-size:34px;font-weight:900;line-height:1;text-shadow:3px 3px #000}#sessionText .result-stats{display:block;line-height:1.8}#sessionText .result-tip{display:block;margin-top:5px;color:#bfe8ff;font-weight:900}
#sessionText .result-record{display:inline-block;margin:0 0 7px;padding:3px 9px;border:1px solid #ffe071;background:#713f0d;color:#fff1a8;font-size:11px;font-weight:900;letter-spacing:1px}
#sessionText .score-breakdown{display:block;margin:7px 0;padding:7px 9px;border:1px solid #4d789d;background:#031024aa;color:#aed8f5;font-size:10px;line-height:1.6}
#sessionText .pause-stats{display:block;margin-bottom:4px;color:#fff1a8;font-weight:900}#sessionText .pause-hint{display:block;color:#a9d4f2;font-size:11px;line-height:1.45}
#session[data-kind="ended"] .session-card{padding-block:15px}#session[data-kind="ended"] p{margin-bottom:14px}#session[data-kind="ended"] #difficulty{margin-bottom:14px}
#session[data-outcome="lose"] .session-card{border-color:#d76a5b;box-shadow:0 16px 50px #000,inset 0 0 0 2px #ffb29a44}#session[data-outcome="lose"] h1{color:#ff9a7d}
#session[data-outcome="draw"] .session-card{border-color:#9c74d6;box-shadow:0 16px 50px #000,inset 0 0 0 2px #dabfff44}#session[data-outcome="draw"] h1{color:#d9b8ff}
#sessionAction{min-width:150px;padding:11px 20px;border:2px solid #fff0ad;background:linear-gradient(#ffe27a,#d28b18);color:#241000;font:900 15px inherit;cursor:pointer;box-shadow:0 4px 0 #6f3c08}#sessionAction:active{transform:translateY(3px);box-shadow:0 1px 0 #6f3c08}#sessionAction:focus-visible{outline:3px solid #9de2ff;outline-offset:4px}
#sessionRestart{margin-left:8px;padding:10px 16px;border:2px solid #d28c75;background:#35131a;color:#ffd9c8;font:900 13px inherit;cursor:pointer;box-shadow:0 4px 0 #16070a}#sessionRestart[hidden]{display:none}#sessionRestart:active{transform:translateY(3px);box-shadow:0 1px 0 #16070a}#sessionRestart:focus-visible{outline:3px solid #ffb594;outline-offset:4px}
#difficultyCaption{margin:-5px 0 5px;color:#9de2ff;font-size:10px;font-weight:900;letter-spacing:1px}#difficultyCaption[hidden]{display:none}#difficulty{display:flex;justify-content:center;gap:6px;margin:0 0 18px}#difficulty[hidden]{display:none}#difficulty button{min-width:72px;padding:6px 9px;border:1px solid #6b9bc1;background:#071a31;color:#bad7ef;font:900 12px inherit;cursor:pointer}#difficulty button.active{border-color:#ffe071;background:#184c75;color:#fff1a8;box-shadow:inset 0 0 0 1px #ffe07155}#difficulty button:focus-visible{outline:2px solid #ffe071}
#recordSummary{margin:-10px 0 16px;color:#9de2ff;font-size:11px;font-weight:900}#recordSummary[hidden]{display:none}
#sessionSettings{display:flex;justify-content:center;gap:7px;margin:-7px 0 13px}#sessionSettings button{min-width:104px;min-height:44px;padding:6px 9px;border:1px solid #74bde9;background:#071b35;color:#dff5ff;font:900 10px inherit;cursor:pointer}#sessionSettings button[aria-pressed="false"]{color:#b7bec8;border-color:#667383;background:#101722}#sessionSettings button:focus-visible{outline:3px solid #ffe071;outline-offset:2px}#session[data-kind="ended"] #sessionSettings{display:none}
#sound,#pause,#haptic,#fullscreen{position:absolute;z-index:12;top:70px;width:38px;height:32px;border:2px solid #55a9e8;background:#061226dd;color:#fff0b8;font-size:17px;cursor:pointer;box-shadow:0 3px 0 #031024}#pause{right:146px}#sound{right:102px}#haptic{right:58px}#fullscreen{right:14px}#sound:focus-visible,#pause:focus-visible,#haptic:focus-visible,#fullscreen:focus-visible{outline:3px solid #ffe071}
#touch{position:absolute;inset:0;display:none;pointer-events:none}
.pad{position:absolute;bottom:52px;width:132px;height:132px;border:2px solid #e1c17d;background:#08070699;pointer-events:auto;transition:opacity .14s ease,filter .14s ease}.pad.occluded{opacity:.68;filter:saturate(.88)}
.pad.left{left:14px}.pad.right{right:14px;width:96px;height:96px;border-radius:50%}.pad.jump{right:124px;width:72px;height:72px;border-radius:50%;bottom:64px}
.pad button{position:absolute;border:1px solid #8bb4d5;background:#123656cc;color:#e8f5ff;font-weight:900;touch-action:none;transition:filter .06s,transform .06s}.pad button.pressed{filter:brightness(1.45);transform:scale(.92);box-shadow:0 0 14px #9de2ff99}
.pad.left button{width:44px;height:44px}.up{left:44px;top:0}.down{left:44px;bottom:0}.leftBtn{left:0;top:44px}.rightBtn{right:0;top:44px}
.atk{inset:14px;border-radius:50%;font-size:28px;color:#2b1305!important;background:linear-gradient(#ffe27a,#d28b18)!important;border-color:#fff0ad!important}
.jmp{inset:10px;border-radius:50%;font-size:22px;color:#08220f!important;background:linear-gradient(#b9ff8a,#3eaa40)!important;border-color:#e4ffd0!important}
@media(max-width:720px){#wrap{width:100vw;height:100dvh}#hud{left:calc(6px + var(--safe-left));right:calc(6px + var(--safe-right));top:calc(6px + var(--safe-top));grid-template-columns:minmax(0,1fr) 58px minmax(0,1fr);gap:4px}.bar{height:44px;padding:5px 7px}.bar:before{left:6px;right:6px;height:15px}.name{gap:4px;font-size:11px}.name small{display:block;font-size:8px;letter-spacing:0}.hp,.sp{left:7px;right:7px}.hp{bottom:8px;height:10px}#round{height:44px;font-size:10px;letter-spacing:0}#help{left:calc(10px + var(--safe-left));right:calc(10px + var(--safe-right));font-size:10px;bottom:calc(5px + var(--safe-bottom));padding:7px 8px}#help span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#msg{display:none}#msg.active{display:block;position:absolute;right:0;bottom:calc(100% + 8px);max-width:min(76vw,360px);padding:7px 10px;border:2px solid #ffe071;background:#071426ee;color:#fff4bd;font-size:11px;font-weight:900;line-height:1.3;text-align:right;white-space:normal;box-shadow:0 3px 0 #020813,0 0 14px #000b}#touch{display:block}#sound,#pause,#haptic,#fullscreen{top:calc(56px + var(--safe-top));width:44px;height:44px}#pause{right:calc(158px + var(--safe-right))}#sound{right:calc(108px + var(--safe-right))}#haptic{right:calc(58px + var(--safe-right))}#fullscreen{right:calc(8px + var(--safe-right))}}
@media(pointer:coarse){#touch{display:block}}
@media(pointer:coarse) and (orientation:landscape) and (max-height:520px){#hud{left:calc(6px + var(--safe-left));right:calc(6px + var(--safe-right));top:calc(6px + var(--safe-top));grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);gap:5px}.bar{height:44px;padding:5px 8px}.bar:before{left:7px;right:7px;height:14px}.name{font-size:12px}.hp,.sp{left:8px;right:8px}.hp{bottom:8px;height:10px}#round{height:44px;font-size:11px;letter-spacing:1px}#sound,#pause,#haptic,#fullscreen{top:calc(56px + var(--safe-top));width:44px;height:44px}#pause{right:calc(158px + var(--safe-right))}#sound{right:calc(108px + var(--safe-right))}#haptic{right:calc(58px + var(--safe-right))}#fullscreen{right:calc(8px + var(--safe-right))}#help{left:calc(10px + var(--safe-left));right:calc(10px + var(--safe-right));bottom:calc(5px + var(--safe-bottom));padding:7px 8px;font-size:10px}#msg{display:none}#msg.active{display:block;position:fixed;left:50%;top:calc(108px + var(--safe-top));right:auto;bottom:auto;transform:translateX(-50%);max-width:min(58vw,420px);padding:7px 10px;border:2px solid #ffe071;background:#071426ee;color:#fff4bd;font-size:11px;font-weight:900;line-height:1.3;text-align:center;white-space:normal;box-shadow:0 3px 0 #020813,0 0 14px #000b}.pad{bottom:calc(52px + var(--safe-bottom));background:#08070655}.pad.left{left:calc(14px + var(--safe-left))}.pad.right{right:calc(14px + var(--safe-right))}.pad.jump{right:calc(124px + var(--safe-right));bottom:calc(64px + var(--safe-bottom))}}
@media(pointer:coarse) and (orientation:landscape) and (max-height:520px){#session{padding:8px max(8px,calc(var(--safe-right) + 4px)) 8px max(8px,calc(var(--safe-left) + 4px))}#session[data-kind="ended"] .session-card{width:min(520px,92%);padding:8px 16px}#session[data-kind="ended"] h1{margin-bottom:2px;font-size:23px;letter-spacing:3px}#session[data-kind="ended"] p{margin-bottom:7px;font-size:10px;line-height:1.38}#session[data-kind="ended"] .result-rank{margin:1px 0 3px;font-size:25px}#session[data-kind="ended"] .result-record{margin-bottom:3px;padding:2px 7px}#session[data-kind="ended"] .score-breakdown{margin:3px 0;padding:3px 6px;font-size:10px;line-height:1.3}#session[data-kind="ended"] #difficultyCaption{margin:0 0 3px}#session[data-kind="ended"] #difficulty{margin-bottom:7px}#session[data-kind="ended"] #difficulty button{padding:4px 8px}#session[data-kind="ended"] #sessionAction{padding:8px 16px}}
@media(pointer:coarse) and (orientation:landscape) and (max-height:520px){#session{padding:max(8px,calc(var(--safe-top) + 4px)) max(8px,calc(var(--safe-right) + 4px)) max(8px,calc(var(--safe-bottom) + 4px)) max(8px,calc(var(--safe-left) + 4px))}}
@media(orientation:portrait){#wrap{width:100vw;height:100dvh;max-width:none;max-height:none}#help span:first-child{font-size:0}#help span:first-child:after{content:'이동 · 두 탭 대시 · ↓ 가드 · ↑ 점프 · D 베기';font-size:10px}#msg.active{position:fixed;top:calc(108px + var(--safe-top));right:calc(10px + var(--safe-right));bottom:auto}.pad{bottom:calc(58px + var(--safe-bottom))}.pad.left{left:calc(12px + var(--safe-left));width:132px;height:132px}.pad.right{right:calc(12px + var(--safe-right));width:88px;height:88px;bottom:calc(64px + var(--safe-bottom))}.pad.jump{right:calc(112px + var(--safe-right));width:68px;height:68px;bottom:calc(74px + var(--safe-bottom))}}
@media(max-width:360px) and (max-height:600px){#session{padding:8px}#session[data-kind="ready"] .session-card{width:96%;padding:12px 10px}#session[data-kind="ready"] h1{margin-bottom:6px;font-size:26px}#session[data-kind="ready"] p{margin-bottom:8px;font-size:10px;line-height:1.35}#session[data-kind="ready"] #difficultyCaption{font-size:9px}#session[data-kind="ready"] #difficulty{margin:5px 0 7px}#session[data-kind="ready"] #difficulty button{min-width:66px;padding:5px 7px}#session[data-kind="ready"] #recordSummary{margin:0 0 8px;font-size:9px}#session[data-kind="ready"] #sessionSettings{margin:0 0 8px}#session[data-kind="ready"] #sessionAction{padding:9px 16px}#session[data-kind="ended"] .session-card{width:96%;padding:10px 9px}#session[data-kind="ended"] h1{margin-bottom:3px;font-size:24px;letter-spacing:3px}#session[data-kind="ended"] p{margin-bottom:9px;font-size:11px;line-height:1.45}#session[data-kind="ended"] .result-rank{margin:2px 0 4px;font-size:27px}#session[data-kind="ended"] .result-record{margin-bottom:4px;padding:2px 7px}#session[data-kind="ended"] .score-breakdown{margin:4px 0;padding:4px 6px;font-size:10px;line-height:1.4}#session[data-kind="ended"] #difficulty{margin:5px 0 9px}#session[data-kind="ended"] #difficulty button{min-width:66px;padding:5px 7px}#session[data-kind="ended"] #sessionAction{padding:9px 16px}}
@media(max-width:360px) and (max-height:600px){#pause{right:auto;left:calc(50% - 97px)}#sound{right:auto;left:calc(50% - 47px)}#haptic{right:auto;left:calc(50% + 3px)}#fullscreen{right:auto;left:calc(50% + 53px)}}
@media(max-width:360px) and (max-height:600px) and (orientation:portrait){.pad.jump{right:calc(102px + var(--safe-right))}.pad.right{right:calc(6px + var(--safe-right))}}
@media(max-width:720px),(pointer:coarse) and (orientation:landscape) and (max-height:520px){#msg.active[data-kind="combat"]{border-color:#ff9b75;background:#28101bee;color:#fff5ef;box-shadow:0 3px 0 #080208,0 0 16px #ff4b3d55}}
@media(prefers-reduced-motion:reduce){.hp i,.sp i,#loading,.load-track i,.pad,.pad button{transition:none!important}}
</style>
</head>
<body>
<div id="wrap" tabindex="0">
  <canvas id="game" width="960" height="540" role="img" aria-label="조운과 화웅의 일기토 전투 화면"></canvas>
  <div id="loading" role="status" aria-live="polite">장수를 불러오는 중 · 0%</div>
  <div id="session" role="dialog" aria-modal="true" aria-labelledby="sessionTitle" aria-describedby="sessionText" hidden><div class="session-card"><h1 id="sessionTitle">일기토</h1><p id="sessionText">화웅의 공격을 읽고 가드와 반격으로 쓰러뜨려라.<br>Esc 또는 P로 언제든 멈출 수 있습니다.</p><div id="difficultyCaption">난이도 선택</div><div id="difficulty" role="group" aria-label="난이도 선택"><button type="button" data-difficulty="easy">쉬움</button><button type="button" data-difficulty="normal">보통</button><button type="button" data-difficulty="hard">어려움</button></div><div id="recordSummary" aria-live="polite"></div><div id="sessionSettings" role="group" aria-label="결투 설정"><button id="sessionSound" type="button">효과음 켜짐</button><button id="sessionHaptic" type="button">진동 켜짐</button></div><button id="sessionAction" type="button">결투 시작</button><button id="sessionRestart" type="button" hidden>처음부터</button></div></div>
  <button id="pause" type="button" aria-label="일시정지" aria-pressed="false">Ⅱ</button>
  <button id="sound" type="button" aria-label="효과음 끄기" aria-pressed="false">🔊</button>
  <button id="haptic" type="button" aria-label="진동 끄기" aria-pressed="true">≋</button>
  <button id="fullscreen" type="button" aria-label="전체화면 시작" aria-pressed="false">⛶</button>
  <div id="hud">
    <div class="bar"><div class="name"><span>조운</span><small>기력</small></div><div class="hp"><i id="pHp"></i></div><div class="sp"><i id="pSp"></i></div></div>
    <div id="round">일기토</div>
    <div class="bar enemy"><div class="name"><span>화웅</span><small>경직</small></div><div class="hp"><i id="bHp"></i></div><div class="sp"><i id="bSp"></i></div></div>
  </div>
  <div id="help"><span>방향키 이동 · 두 번 탭 대시 · <b>↓ 가드</b> · <b>D 베기</b> · Space 점프</span><span id="msg" aria-hidden="true">거리 잡고 베어라</span></div><span id="announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>

 wrap.setAttribute('aria-busy','true');loading.hidden=false;loading.setAttribute('role','status');loading.setAttribute('aria-live','polite');loading.classList.remove('ready','error');loading.textContent='';showLoadingProgress(loading,0);
 const waitForImage=img=>{if(img.complete)return Promise.resolve(!!img.naturalWidth);return new Promise(resolve=>{const finish=ok=>{img.removeEventListener('load',loaded);img.removeEventListener('error',errored);resolve(ok)},loaded=()=>finish(true),errored=()=>finish(false);img.addEventListener('load',loaded,{once:true});img.addEventListener('error',errored,{once:true})})};
 const settled=images.map(async img=>{let ok=await waitForImage(img);if(!ok&&/\.webp(?:$|\?)/i.test(img.src)){showLoadingProgress(loading,done/images.length*100,'호환 그림으로 다시 불러오는 중');img.src=img.src.replace(/\.webp(?=$|\?)/i,'.png');ok=await waitForImage(img)}done++;if(!ok)failed++;showLoadingProgress(loading,done/images.length*100)});
 return Promise.all(settled).then(()=>{
  if(failed){showLoadingError(loading,failed);return new Promise(()=>{})}
  showLoadingProgress(loading,100,'결투 준비 완료');wrap.setAttribute('aria-busy','false');loading.classList.add('ready');return new Promise(resolve=>setTimeout(()=>{loading.hidden=true;resolve()},300));
 });
}
hpBar();requestAnimationFrame(loop);loadAssets().then(()=>{showSession('ready')});
