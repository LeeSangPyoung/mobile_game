<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 반신 200명 v6 실제 진행</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg:#130f0b;
  --panel:#211913;
  --line:rgba(244,223,184,.18);
  --gold:#ffd36a;
  --text:#f4dfb8;
  --muted:#bfa986;
  --done:#6ee7a8;
  --miss:#ffb46b;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:5;
  padding:16px 20px 13px;
  background:rgba(20,16,12,.95);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.top {
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
}
h1 {
  margin:0;
  font-size:22px;
  font-weight:850;
  letter-spacing:0;
}
.note {
  color:#cbb894;
  font-size:13px;
  line-height:1.45;
}
main { padding:18px 20px 28px; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
  gap:16px;
}
article {
  overflow:hidden;
  border:1px solid rgba(244,223,184,.17);
  border-radius:8px;
  background:var(--panel);
  box-shadow:0 10px 22px rgba(0,0,0,.22);
}
.pair {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:rgba(244,223,184,.16);
}
.art {
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  background:#0f0c09;
}
.art img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}
.full img {
  object-fit:cover;
  object-position:center 42%;
}
.missing {
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  color:var(--miss);
  font-size:13px;
  font-weight:850;
}
.badge,.status {
  position:absolute;
  z-index:1;
  padding:3px 7px 4px;
  border-radius:6px;
  background:rgba(13,9,6,.76);
  border:1px solid rgba(255,211,106,.32);
  color:var(--gold);
  font-size:11px;
  font-weight:850;
}
.badge { left:8px; top:8px; }
.status { right:8px; top:8px; }
.status.done { color:var(--done); }
.status.miss { color:var(--miss); }
.meta { padding:10px 11px 12px; }
.name {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin:0 0 7px;
  font-size:16px;
  font-weight:850;
}
.name small {
  color:#9e8a67;
  font-size:11px;
  font-weight:700;
}
a {
  display:block;
  overflow-wrap:anywhere;
  color:var(--gold);
  font-size:11px;
  line-height:1.35;
  text-decoration:none;
}
a:hover { text-decoration:underline; }
@media (max-width:720px) {
  main { padding:12px; }
  .grid { grid-template-columns:1fr; gap:12px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>신규 반신 200명 v6 실제 진행</h1>
    <div class="note">진짜 신규 v6 생성본만 표시. 진행: <span id="count">0/200</span></div>
  </div>
</header>
<main><section id="grid" class="grid"></section></main>
<script src="./assets/generals/roster_200.js"></script>
<script>
const version = "true-v6-progress-20260525";
const grid = document.getElementById("grid");
const count = document.getElementById("count");
let done = 0;

function updateCount() {
  count.textContent = `${done}/${window.GENERALS_200.length}`;
}

window.GENERALS_200.forEach(([id, ko], index) => {
  const no = String(index + 1).padStart(3, "0");
  const full = `./assets/generals/new_characters/front_gaze_200_v10_scale_audit/${id}_front_gaze_v1.png?v=${version}`;
  const half = `./assets/generals/new_characters/upper_body_200_redraw_v6_above_navel/${id}_halfbody_redraw_v6.png?v=${version}`;
  const el = document.createElement("article");
  el.innerHTML = `
    <div class="pair">
      <div class="art full"><span class="badge">전신 파이널</span><img loading="lazy" src="${full}" alt="${ko} 전신"></div>
      <div class="art half">
        <span class="badge">신규 반신</span>
        <span class="status">확인중</span>
        <img loading="lazy" src="${half}" alt="${ko} 신규 반신">
      </div>
    </div>
    <div class="meta">
      <p class="name"><span>${ko}</span><small>${no} · ${id}</small></p>
      <a href="${half}">${half}</a>
    </div>`;
  const img = el.querySelector(".half img");
  const status = el.querySelector(".status");
  img.addEventListener("load", () => {
    status.textContent = "v6 신규";
    status.className = "status done";
    done += 1;
    updateCount();
  }, { once:true });
  img.addEventListener("error", () => {
    status.textContent = "미생성";
    status.className = "status miss";
    img.replaceWith(Object.assign(document.createElement("div"), {
      className: "missing",
      textContent: "미생성"
    }));
  }, { once:true });
  grid.appendChild(el);
});
updateCount();
</script>
</body>
</html>
