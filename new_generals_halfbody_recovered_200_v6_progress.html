<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 반신 200명 v6 실제 진행</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg:#130f0b;
  --panel:#211913;
  --line:rgba(244,223,184,.18);
  --gold:#ffd36a;
  --text:#f4dfb8;
  --muted:#bfa986;
  --done:#6ee7a8;
  --miss:#ffb46b;
  --temp:#8ed3ff;
  --review:#ff8a9a;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:5;
  padding:16px 20px 13px;
  background:rgba(20,16,12,.95);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
.top {
  display:flex;
  align-items:baseline;
  gap:14px;
  flex-wrap:wrap;
}
h1 {
  margin:0;
  font-size:22px;
  font-weight:850;
  letter-spacing:0;
}
.note {
  color:#cbb894;
  font-size:13px;
  line-height:1.45;
}
main { padding:18px 20px 28px; }
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
  gap:16px;
}
article {
  overflow:hidden;
  border:1px solid rgba(244,223,184,.17);
  border-radius:8px;
  background:var(--panel);
  box-shadow:0 10px 22px rgba(0,0,0,.22);
}
.pair {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1px;
  background:rgba(244,223,184,.16);
}
.art {
  position:relative;
  aspect-ratio:4/5;
  overflow:hidden;
  background:#0f0c09;
}
.art img {
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center bottom;
}
.full img {
  object-fit:cover;
  object-position:center 42%;
}
.missing {
  display:flex;
  align-items:center;
  justify-content:center;
  width:100%;
  height:100%;
  color:var(--miss);
  font-size:13px;
  font-weight:850;
}
.badge,.status {
  position:absolute;
  z-index:1;
  padding:3px 7px 4px;
  border-radius:6px;
  background:rgba(13,9,6,.76);
  border:1px solid rgba(255,211,106,.32);
  color:var(--gold);
  font-size:11px;
  font-weight:850;
}
.badge { left:8px; top:8px; }
.status { right:8px; top:8px; }
.status.done { color:var(--done); }
.status.miss { color:var(--miss); }
.status.temp { color:var(--temp); }
.status.review { color:var(--review); }
.meta { padding:10px 11px 12px; }
.name {
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  gap:8px;
  margin:0 0 7px;
  font-size:16px;
  font-weight:850;
}
.name small {
  color:#9e8a67;
  font-size:11px;
  font-weight:700;
}
a {
  display:block;
  overflow-wrap:anywhere;
  color:var(--gold);
  font-size:11px;
  line-height:1.35;
  text-decoration:none;
}
a:hover { text-decoration:underline; }
@media (max-width:720px) {
  main { padding:12px; }
  .grid { grid-template-columns:1fr; gap:12px; }
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>신규 반신 200명 v6 실제 진행</h1>
    <div class="note">전신 파이널과 포즈/표정이 다르고 얼굴/두상 비율이 유지된 신규 반신만 완료로 계산. 복구 신규는 재제작 대상으로 계산. 진행: <span id="count">0/200</span></div>
  </div>
</header>
<main><section id="grid" class="grid"></section></main>
<script src="./assets/generals/roster_200.js"></script>
<script>
const version = "true-v6-redraw-progress-20260529-final-review-strict-belt-v10";
const strictRegeneratedIds = new Set(window.GENERALS_200.slice(63).map(([id]) => id));
const recoveredNeedsRedrawIds = new Set([
  "xu_sheng", "ding_feng", "han_dang", "cheng_pu", "zhou_tai", "jiang_qin",
  "ling_tong", "lu_su", "zhang_zhao", "zhang_hong", "zhu_huan", "zhu_ran",
  "bu_zhi", "kan_ze", "yu_fan", "he_qi", "pan_zhang", "quan_cong",
  "sun_jian", "sun_shao", "sun_huan", "ma_zhong_wu", "guan_ping", "guan_xing", "zhang_bao",
  "liu_feng", "ma_su", "ma_liang", "jiang_wei", "wei_yan", "fa_zheng",
  "jian_yong", "mi_zhu", "mi_fang", "sun_qian", "liao_hua", "ma_dai",
  "yan_yan", "li_yan", "fei_yi", "dong_yun", "jiang_wan", "huang_quan",
  "chen_dao", "meng_da", "li_hui", "huo_jun", "zhuge_zhan", "zhuge_jin",
  "zhuge_dan", "zhang_yi_shu", "dong_jue", "xin_pi", "gongsun_zan",
  "gongsun_du", "gongsun_kang", "liu_biao", "liu_zhang", "liu_yao",
  "tao_qian", "kong_rong", "zhang_lu", "zhang_ren", "ma_teng", "han_sui",
  "dong_cheng", "he_jin", "zhang_rang", "wang_yun", "li_jue", "guo_si",
  "zhang_ji", "zhang_xiu", "hua_xiong", "li_ru", "yuan_shu", "liu_xun"
]);
const grid = document.getElementById("grid");
const count = document.getElementById("count");
const totals = {
  done: 0,
  recoveredPending: 0,
  provisionalPending: 0
};

function updateCount() {
  const pending = totals.recoveredPending + totals.provisionalPending;
  count.textContent = `완료 ${totals.done}/${window.GENERALS_200.length} · 남음 ${pending} · 복구 재제작 ${totals.recoveredPending} · 임시 재제작 ${totals.provisionalPending}`;
}

window.GENERALS_200.forEach(([id, ko], index) => {
  const isBaseTrue = index < 63;
  const isStrictRegenerated = strictRegeneratedIds.has(id);
  const needsRecoveredRedraw = recoveredNeedsRedrawIds.has(id);
  const isDone = isBaseTrue || isStrictRegenerated;
  if (isDone) {
    totals.done += 1;
  } else if (needsRecoveredRedraw) {
    totals.recoveredPending += 1;
  } else {
    totals.provisionalPending += 1;
  }
  const no = String(index + 1).padStart(3, "0");
  const full = `./assets/generals/new_characters/front_gaze_200_v10_scale_audit/${id}_front_gaze_v1.png?v=${version}`;
  const half = `./assets/generals/new_characters/upper_body_200_redraw_v6_above_navel/${id}_halfbody_redraw_v6.png?v=${version}`;
  const badge = isStrictRegenerated
    ? "엄격 재생성"
    : isBaseTrue
      ? "신규 반신"
      : needsRecoveredRedraw
        ? "복구 재제작"
        : "임시 재제작";
  const el = document.createElement("article");
  el.innerHTML = `
    <div class="pair">
      <div class="art full"><span class="badge">전신 파이널</span><img loading="lazy" src="${full}" alt="${ko} 전신"></div>
      <div class="art half">
        <span class="badge">${badge}</span>
        <span class="status">확인중</span>
        <img loading="lazy" src="${half}" alt="${ko} 신규 반신">
      </div>
    </div>
    <div class="meta">
      <p class="name"><span>${ko}</span><small>${no} · ${id}</small></p>
      <a href="${half}">${half}</a>
    </div>`;
  const img = el.querySelector(".half img");
  const status = el.querySelector(".status");
  img.addEventListener("load", () => {
    if (isDone) {
      status.textContent = isStrictRegenerated ? "엄격 통과" : "v6 신규";
      status.className = "status done";
    } else if (needsRecoveredRedraw) {
      status.textContent = "새로 제작 필요";
      status.className = "status review";
    } else {
      status.textContent = "재작업 필요";
      status.className = "status temp";
    }
  }, { once:true });
  img.addEventListener("error", () => {
    status.textContent = "미생성";
    status.className = "status miss";
    img.replaceWith(Object.assign(document.createElement("div"), {
      className: "missing",
      textContent: "미생성"
    }));
  }, { once:true });
  grid.appendChild(el);
});
updateCount();
</script>
</body>
</html>
