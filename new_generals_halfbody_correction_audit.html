<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신규 반신 200명 보정 후보 감사</title>
<style>
* { box-sizing: border-box; }
:root {
  color-scheme: dark;
  --bg:#130f0b;
  --panel:#211913;
  --line:rgba(244,223,184,.17);
  --gold:#ffd36a;
  --text:#f4dfb8;
  --muted:#bfa986;
  --high:#ffb46b;
  --mid:#d8c37b;
  --watch:#8ed3ff;
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
header {
  position:sticky;
  top:0;
  z-index:5;
  padding:16px 20px 13px;
  background:rgba(20,16,12,.96);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(10px);
}
h1 {
  margin:0 0 7px;
  font-size:22px;
  font-weight:850;
  letter-spacing:0;
}
.note {
  max-width:1080px;
  margin:0;
  color:#cbb894;
  font-size:13px;
  line-height:1.5;
}
main { padding:18px 20px 30px; }
.summary {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
  margin:0 0 18px;
}
.metric {
  padding:11px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#1d1711;
}
.metric b {
  display:block;
  margin-bottom:4px;
  color:var(--gold);
  font-size:18px;
}
.metric span {
  color:var(--muted);
  font-size:12px;
  line-height:1.4;
}
section {
  margin:0 0 24px;
  border-top:1px solid var(--line);
  padding-top:16px;
}
.section-head {
  max-width:1080px;
  margin:0 0 12px;
}
.level {
  display:inline-block;
  margin:0 0 8px;
  padding:3px 7px 4px;
  border-radius:6px;
  color:#15110d;
  font-size:12px;
  font-weight:850;
}
.high .level { background:var(--high); }
.medium .level { background:var(--mid); }
.watch .level { background:var(--watch); }
h2 {
  margin:0 0 7px;
  font-size:18px;
  font-weight:850;
  letter-spacing:0;
}
.section-head p {
  margin:0 0 7px;
  color:#d2c09d;
  font-size:13px;
  line-height:1.5;
}
.fix {
  color:#f1cf85;
}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px;
}
article {
  overflow:hidden;
  border:1px solid rgba(244,223,184,.15);
  border-radius:8px;
  background:var(--panel);
}
.art {
  position:relative;
  aspect-ratio:4/5;
  background:#0f0c09;
}
.art img {
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
}
.badge {
  position:absolute;
  left:7px;
  top:7px;
  padding:2px 6px 3px;
  border-radius:5px;
  background:rgba(13,9,6,.72);
  border:1px solid rgba(255,211,106,.28);
  color:var(--gold);
  font-size:10px;
  font-weight:850;
}
.meta {
  padding:8px 9px 10px;
}
strong {
  display:block;
  font-size:14px;
  line-height:1.25;
}
small {
  display:block;
  margin-top:2px;
  color:#a99778;
  font-size:11px;
}
a {
  display:block;
  margin-top:7px;
  overflow-wrap:anywhere;
  color:var(--gold);
  font-size:10px;
  line-height:1.35;
  text-decoration:none;
}
a:hover { text-decoration:underline; }
@media (max-width:720px) {
  main { padding:12px; }
  .grid { grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:10px; }
}
</style>
</head>
<body>
<header>
  <h1>신규 반신 200명 보정 후보 감사</h1>
  <p class="note">현재 200/200으로 채운 반신 세트 기준입니다. 이미지 파일은 수정하지 않았고, 유사도와 눈검수로 보정 후보만 묶었습니다.</p>
</header>
<main>
  <div class="summary">
    <div class="metric"><b>200/200</b><span>누락 없음. 모든 roster 항목에 반신 파일이 있습니다.</span></div>
    <div class="metric"><b>001-051</b><span>새 v6 생성/검수 이미지. 질감과 해상도가 더 높습니다.</span></div>
    <div class="metric"><b>052-200</b><span>기존 상반신 세트로 채운 구간. 안정적이지만 일부 군집 유사도가 높습니다.</span></div>
    <div class="metric"><b>4군</b><span>우선 보정 후보: 황건, 공손가, 후반 군벌형, 도사/의원 계열.</span></div>
  </div>
  <div id="audit"></div>
</main>
<script src="./assets/generals/roster_200.js"></script>
<script>
const version = "halfbody-correction-audit-20260527";
const imgBase = "./assets/generals/new_characters/upper_body_200_redraw_v6_above_navel";
const roster = new Map(window.GENERALS_200.map(([id, ko], index) => [id, { no:index + 1, id, ko }]));

const groups = [
  {
    level:"우선",
    cls:"high",
    title:"황건 계열",
    reason:"노란 머리띠, 금색 갑옷, 거친 수염, 정면 창/지팡이 실루엣이 반복됩니다.",
    fix:"관해, 장만성, 등무 중 2명 이상은 색/투구/무기 실루엣을 크게 바꾸는 편이 좋습니다.",
    ids:["zhang_jiao","zhang_bao_yellow","zhang_liang_yellow","bo_cai","cheng_yuanzhi","deng_mao","guan_hai","pei_yuanshao","zhang_man_cheng","han_zhong"]
  },
  {
    level:"우선",
    cls:"high",
    title:"공손가 계열",
    reason:"공손도와 공손강은 검은 중갑, 털 장식, 수염, 자세가 가깝고 공손연도 같은 축으로 보입니다.",
    fix:"공손강은 젊은 후계자형, 공손도는 노장 군벌형, 공손연은 화려한 북방 귀족형으로 분리하면 좋습니다.",
    ids:["gongsun_zan","gongsun_du","gongsun_kang","gongsun_yuan"]
  },
  {
    level:"우선",
    cls:"high",
    title:"후반 군벌형 중갑 장수",
    reason:"성의, 양봉, 진란, 뇌박, 한섬은 어두운 중갑과 거친 산적형 얼굴이 많이 겹칩니다.",
    fix:"진란/뇌박/한섬은 무기와 갑옷 색을 분리하고, 성의/양봉은 실루엣 차이를 키우는 편이 좋습니다.",
    ids:["cheng_yin","yang_feng","chen_lan","lei_bo","han_xian","zhang_xun","qiao_rui"]
  },
  {
    level:"우선",
    cls:"high",
    title:"도사/의원 계열",
    reason:"화타, 좌자, 우길은 흰 머리와 장포, 지팡이/부채 계열 소품이 가까워 한 화면에서 구분력이 낮습니다.",
    fix:"화타는 의술 소품, 좌자는 신선/부적, 우길은 도교 의례 장식으로 갈라주는 게 좋습니다.",
    ids:["hua_tuo","zuo_ci","yu_ji"]
  },
  {
    level:"중간",
    cls:"medium",
    title:"녹색 문관/원로 계열",
    reason:"유우, 도겸, 공융, 장로, 유표, 유장은 녹색 도포와 두루마리/지팡이 조합이 반복됩니다.",
    fix:"유표/유장은 지역 군주 느낌을 더하고, 도겸/유우는 노신 관복 방향으로 분리하면 좋습니다.",
    ids:["liu_yao","liu_yu","tao_qian","kong_rong","zhang_lu","liu_biao","liu_zhang"]
  },
  {
    level:"중간",
    cls:"medium",
    title:"관우가 녹색 계열",
    reason:"관평, 관흥, 관색, 관은병, 주창은 의도된 진영 통일감은 좋지만 초록 갑옷 실루엣이 일부 겹칩니다.",
    fix:"관색/관은병은 젊고 민첩한 색, 주창은 거친 산악 호위 느낌으로 더 밀면 좋습니다.",
    ids:["guan_ping","guan_xing","guan_suo","guan_yinping","zhou_cang"]
  },
  {
    level:"관찰",
    cls:"watch",
    title:"청회색 위 장수 계열",
    reason:"조진, 곽회, 장윤, 등애, 하후패, 한호, 이통은 청회색 갑옷과 창/도 실루엣이 가까운 편입니다.",
    fix:"필수 보정은 아니지만, 등애/곽회/장윤은 얼굴 나이와 무기 실루엣을 더 갈라주면 좋습니다.",
    ids:["cao_zhen","guo_huai","zhang_yun","deng_ai","xiahou_ba","han_hao","li_tong"]
  },
  {
    level:"관찰",
    cls:"watch",
    title:"녹색 장수 계열",
    reason:"장익, 동궐, 마대, 이엄, 유봉, 진도는 녹색 망토와 비슷한 중갑 톤이 반복됩니다.",
    fix:"장익/동궐은 촉 후반 관료형, 마대/진도는 전투형으로 분리하면 안정적입니다.",
    ids:["zhang_yi_shu","dong_jue","ma_dai","li_yan","liu_feng","chen_dao"]
  },
  {
    level:"관찰",
    cls:"watch",
    title:"웃는 문관/상인형",
    reason:"유선, 미축, 미방, 손건, 간옹은 둥근 얼굴과 녹색 도포 인상이 비슷합니다.",
    fix:"유선은 군주/소년성, 미축은 부호 상인, 손건/간옹은 사절/담판가 방향으로 나누면 좋습니다.",
    ids:["liu_shan","mi_zhu","mi_fang","sun_qian","jian_yong"]
  }
];

function card(id) {
  const item = roster.get(id);
  if (!item) return "";
  const no = String(item.no).padStart(3, "0");
  const src = `${imgBase}/${id}_halfbody_redraw_v6.png?v=${version}`;
  return `<article>
    <div class="art"><span class="badge">${no}</span><img loading="lazy" src="${src}" alt="${item.ko}"></div>
    <div class="meta">
      <strong>${item.ko}</strong>
      <small>${id}</small>
      <a href="${src}">${src}</a>
    </div>
  </article>`;
}

document.getElementById("audit").innerHTML = groups.map(group => `
  <section class="${group.cls}">
    <div class="section-head">
      <p class="level">${group.level}</p>
      <h2>${group.title}</h2>
      <p>${group.reason}</p>
      <p class="fix">${group.fix}</p>
    </div>
    <div class="grid">${group.ids.map(card).join("")}</div>
  </section>
`).join("");
</script>
</body>
</html>
