<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신규 장수 70명 이미지 세트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px;
    background: #17110b;
    color: #f7d56e;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
  }
  h1 { margin: 0 0 8px; font-size: 30px; }
  .sub { margin: 0 0 18px; color: #c5a86b; font-size: 15px; }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 0 16px;
    background: linear-gradient(180deg, #17110b 70%, rgba(23,17,11,0));
  }
  input {
    width: min(420px, 100%);
    height: 40px;
    padding: 0 14px;
    border: 1px solid #7b5724;
    border-radius: 8px;
    background: #24190f;
    color: #ffe188;
    font-size: 15px;
    outline: none;
  }
  .stat { color: #a98a50; font-size: 14px; font-weight: 800; white-space: nowrap; }
  .audit { margin-left: auto; color: #d2b36b; font-size: 14px; font-weight: 800; }
  .audit.ok { color: #8fd48a; }
  .audit.bad { color: #ff8f75; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
    gap: 18px;
  }
  .row {
    border: 1px solid #79551f;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(180deg, #24190f, #110b07);
  }
  .name {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid #664719;
    color: #ffe188;
    font-size: 18px;
    font-weight: 800;
  }
  .name small { color: #a98a50; font-size: 13px; }
  .sets { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .panel { min-width: 0; border-right: 1px solid #4d3616; }
  .panel:last-child { border-right: 0; }
  .label {
    padding: 8px 10px;
    border-bottom: 1px solid #3d2a12;
    background: #1a120b;
    color: #c5a86b;
    font-size: 12px;
    font-weight: 800;
  }
  .art {
    height: 260px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding: 12px;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      radial-gradient(circle at 50% 18%, rgba(255,212,91,0.16), transparent 44%),
      #21170e;
    background-size: 28px 28px, 28px 28px, 100% 100%, 100% 100%;
  }
  .art.face, .art.battle { align-items: center; }
  img {
    display: block;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 14px 16px rgba(0,0,0,0.62));
  }
  .battle img { transform: scale(1.02); }
  .file {
    padding: 8px 10px 10px;
    border-top: 1px solid #3d2a12;
    color: #f7d56e;
    font-size: 12px;
    word-break: break-all;
  }
  .missing .art {
    align-items: center;
    color: #ff9a7a;
    font-size: 13px;
    font-weight: 900;
    text-align: center;
  }
  .missing .file { color: #ff9a7a; }
  @media (max-width: 720px) {
    body { padding: 18px; }
    h1 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
    .sets { grid-template-columns: 1fr; }
    .panel { border-right: 0; border-bottom: 1px solid #4d3616; }
    .panel:last-child { border-bottom: 0; }
    .art { height: 240px; }
  }
</style>
</head>
<body>
<h1>신규 장수 70명 이미지 세트</h1>
<p class="sub">31번부터 100번까지 새로 추가한 장수만 모았습니다. 전신, 얼굴, 전투신 3종 세트를 한 번에 검수합니다.</p>
<div class="toolbar">
  <input id="search" type="search" placeholder="이름 또는 파일명 검색">
  <div class="stat" id="count"></div>
  <div class="audit" id="audit">검수 중...</div>
</div>
<main class="grid" id="grid"></main>

<script src="assets/generals/roster_200.js"></script>
<script>
const existingIds = new Set([
  'liu_bei',
  'guan_yu',
  'zhang_fei',
  'zhao_yun',
  'lu_bu',
  'xiahou_dun',
  'cao_cao',
  'cao_xing',
  'taishi_ci',
  'zhuge_liang',
  'huang_zhong',
  'huang_gai',
  'yan_liang',
  'dong_zhuo',
  'sima_yi',
  'gan_ning',
  'yuan_shao',
  'sun_quan',
  'zhou_yu',
  'ma_chao',
  'sun_ce',
  'lu_xun',
  'pang_tong',
  'guo_jia',
  'dian_wei',
  'xu_chu',
  'zhang_liao',
  'xu_huang',
  'wen_chou',
  'meng_huo',
]);

const generals = window.GENERALS_200
  .filter(([id]) => !existingIds.has(id))
  .slice(0, 70);
const grid = document.getElementById('grid');
const count = document.getElementById('count');
const search = document.getElementById('search');
const audit = document.getElementById('audit');
let loaded = 0;
let failed = 0;
const expectedImages = generals.length * 3;

function panel(id, name, type, label, className = '') {
  const file = `${id}.png`;
  const src = `assets/generals/${type}/${file}?v=new70-20260510`;
  return `
    <div class="panel ${className}">
      <div class="label">${label}</div>
      <div class="art ${className}"><img src="${src}" alt="${name} ${label}" data-type="${type}"></div>
      <div class="file">${type}/${file}</div>
    </div>
  `;
}

function card([id, name], index) {
  const row = document.createElement('section');
  row.className = 'row';
  row.dataset.key = `${id} ${name}`.toLowerCase();
  row.innerHTML = `
    <div class="name">
      <span>${index + 31}. ${name}</span>
      <small>${id}.png</small>
    </div>
    <div class="sets">
      ${panel(id, name, 'busts', '전신')}
      ${panel(id, name, 'faces', '얼굴', 'face')}
      ${panel(id, name, 'battle_faces', '전투신', 'battle')}
    </div>
  `;
  return row;
}

const rows = generals.map(card);
rows.forEach(row => grid.appendChild(row));

function updateAudit() {
  audit.textContent = failed
    ? `이미지 ${loaded}/${expectedImages}, 누락 ${failed}`
    : `이미지 ${loaded}/${expectedImages}`;
  audit.className = `audit ${loaded === expectedImages ? 'ok' : failed ? 'bad' : ''}`;
}

grid.querySelectorAll('img').forEach(img => {
  img.addEventListener('load', () => {
    loaded++;
    updateAudit();
  });
  img.addEventListener('error', () => {
    failed++;
    const panelEl = img.closest('.panel');
    panelEl.classList.add('missing');
    img.closest('.art').textContent = '누락';
    updateAudit();
  });
});
updateAudit();

function filterRows() {
  const q = search.value.trim().toLowerCase();
  let shown = 0;
  rows.forEach(row => {
    const ok = !q || row.dataset.key.includes(q);
    row.style.display = ok ? '' : 'none';
    if (ok) shown++;
  });
  count.textContent = `${shown} / ${generals.length}`;
}

search.addEventListener('input', filterRows);
filterRows();
</script>
</body>
</html>
