<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>기존 30장수 + 신규 후보 3명</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b111c;
      --panel: #101927;
      --line: #2a3a50;
      --text: #eef4ff;
      --muted: #aebbd0;
      --gold: #f5cf66;
      --ok: #9ee6b1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      padding: 22px 24px 18px;
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0 0 8px;
      color: #ffe49a;
      font-size: 26px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }
    main { padding: 18px 24px 36px; }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat, .panel, .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .stat {
      padding: 13px 14px;
      min-width: 0;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .stat strong {
      display: block;
      margin-top: 3px;
      color: var(--gold);
      font-size: 24px;
    }
    .panel {
      margin: 14px 0;
      overflow: hidden;
    }
    .panel h2 {
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      color: #fff3c4;
      font-size: 16px;
    }
    .body {
      padding: 14px;
      color: #e8eef8;
      line-height: 1.7;
      font-size: 14px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    .card { overflow: hidden; min-width: 0; }
    .stage {
      height: 214px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 24px 24px;
      background-color: #08101a;
    }
    .stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .meta { padding: 9px 10px 12px; }
    .meta b { display: block; font-size: 15px; }
    .meta code {
      display: block;
      margin-top: 3px;
      color: #9fb0c6;
      font-size: 12px;
    }
    .meta small {
      display: block;
      margin-top: 5px;
      color: #b7c4d5;
      line-height: 1.45;
    }
    .ok { color: var(--ok); font-weight: 700; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      padding: 8px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    th {
      color: #ffecaa;
      background: #121d2c;
      position: sticky;
      top: 0;
    }
    td { color: #d9e3f2; }
    tbody tr:hover { background: #142033; }
    @media (max-width: 1200px) {
      .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 820px) {
      main { padding: 14px; }
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats { grid-template-columns: 1fr; }
      th, td { white-space: normal; }
    }
  </style>
</head>
<body>
  <header>
    <h1>기존 30장수 + 신규 후보 3명</h1>
    <p>유비부터 맹획까지 기존 30명은 그대로 두고, 새 로블록스풍 삼국지 장수 후보 3명을 31-33번으로 붙였습니다.</p>
  </header>
  <main>
    <section class="stats">
      <div class="stat"><span>기존 장수</span><strong>30</strong></div>
      <div class="stat"><span>신규 후보</span><strong>#31-33</strong></div>
      <div class="stat"><span>파일 규격</span><strong>640x768</strong></div>
      <div class="stat"><span>판정</span><strong id="okCount">0/33</strong></div>
    </section>
    <section class="panel">
      <h2>비교 기준</h2>
      <div class="body">
        기존 30명과 같은 캔버스 기준으로 정규화했습니다. 신규 후보 3명은 전신만 있으며, 반신/얼굴 컷은 아직 만들지 않았습니다.
      </div>
    </section>
    <section class="panel">
      <h2>전신 목록</h2>
      <div class="body"><div id="grid" class="grid"></div></div>
    </section>
    <section class="panel">
      <h2>수치</h2>
      <table>
        <thead><tr><th>#</th><th>장수</th><th>ID</th><th>area</th><th>여백</th><th>center</th><th>판정</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
  </main>
  <script>
    const roster = [
      ["liu_bei", "유비"], ["guan_yu", "관우"], ["zhang_fei", "장비"], ["zhao_yun", "조운"], ["lu_bu", "여포"],
      ["xiahou_dun", "하후돈"], ["cao_cao", "조조"], ["cao_xing", "조흥"], ["taishi_ci", "태사자"], ["zhuge_liang", "제갈량"],
      ["huang_zhong", "황충"], ["huang_gai", "황개"], ["yan_liang", "안량"], ["dong_zhuo", "동탁"], ["sima_yi", "사마의"],
      ["gan_ning", "감녕"], ["yuan_shao", "원소"], ["sun_quan", "손권"], ["zhou_yu", "주유"], ["ma_chao", "마초"],
      ["sun_ce", "손책"], ["lu_xun", "육손"], ["pang_tong", "방통"], ["guo_jia", "곽가"], ["dian_wei", "전위"],
      ["xu_chu", "허저"], ["zhang_liao", "장료"], ["xu_huang", "서황"], ["wen_chou", "문추"], ["meng_huo", "맹획"],
      ["new_supply_commander_candidate", "신규 보급장"],
      ["new_teal_spear_captain", "신규 창방장"],
      ["new_banner_axe_commander", "신규 기부장"]
    ];
    const metrics = {
      liu_bei: [0.821, "L38 T27 R37 B27", 0.501], guan_yu: [0.767, "L56 T27 R56 B27", 0.500],
      zhang_fei: [0.820, "L25 T58 R25 B27", 0.500], zhao_yun: [0.809, "L42 T27 R41 B27", 0.501],
      lu_bu: [0.841, "L25 T38 R27 B27", 0.498], xiahou_dun: [0.850, "L28 T27 R27 B27", 0.501],
      cao_cao: [0.813, "L40 T27 R40 B27", 0.500], cao_xing: [0.771, "L54 T27 R55 B27", 0.499],
      taishi_ci: [0.793, "L47 T27 R47 B27", 0.500], zhuge_liang: [0.780, "L52 T27 R51 B27", 0.501],
      huang_zhong: [0.786, "L50 T27 R49 B27", 0.501], huang_gai: [0.847, "L26 T34 R25 B27", 0.501],
      yan_liang: [0.830, "L33 T29 R33 B28", 0.500], dong_zhuo: [0.806, "L42 T27 R43 B27", 0.499],
      sima_yi: [0.834, "L33 T27 R33 B27", 0.500], gan_ning: [0.809, "L27 T64 R25 B28", 0.502],
      yuan_shao: [0.820, "L25 T56 R26 B28", 0.499], sun_quan: [0.837, "L32 T27 R32 B27", 0.500],
      zhou_yu: [0.798, "L27 T73 R26 B27", 0.501], ma_chao: [0.845, "L29 T27 R29 B27", 0.500],
      sun_ce: [0.807, "L42 T27 R42 B28", 0.500], lu_xun: [0.827, "L36 T27 R35 B27", 0.501],
      pang_tong: [0.764, "L57 T27 R57 B27", 0.500], guo_jia: [0.761, "L58 T27 R58 B27", 0.500],
      dian_wei: [0.793, "L26 T77 R26 B28", 0.500], xu_chu: [0.836, "L30 T29 R31 B29", 0.499],
      zhang_liao: [0.758, "L59 T27 R59 B27", 0.500], xu_huang: [0.824, "L26 T51 R26 B28", 0.500],
      wen_chou: [0.852, "L26 T29 R25 B28", 0.501], meng_huo: [0.855, "L25 T27 R25 B29", 0.500],
      new_supply_commander_candidate: [0.835, "L32 T27 R33 B27", 0.499],
      new_teal_spear_captain: [0.783, "L60 T1 R60 B27", 0.500],
      new_banner_axe_commander: [0.788, "L10 T116 R10 B27", 0.500]
    };
    const grid = document.querySelector("#grid");
    const rows = document.querySelector("#rows");
    grid.innerHTML = roster.map(([id, name], i) => {
      const [area, margin, center] = metrics[id];
      return `
        <article class="card">
          <div class="stage"><img src="assets/generals/busts/${id}.png?v=candidate33" alt="${name}"></div>
          <div class="meta">
            <b>${String(i + 1).padStart(2, "0")}. ${name}</b>
            <code>${id}</code>
            <small>area ${area.toFixed(3)} · ${margin} · center ${center.toFixed(3)}</small>
            <small class="ok">정상</small>
          </div>
        </article>
      `;
    }).join("");
    rows.innerHTML = roster.map(([id, name], i) => {
      const [area, margin, center] = metrics[id];
      return `<tr><td>${String(i + 1).padStart(2, "0")}</td><td>${name}</td><td><code>${id}</code></td><td>${area.toFixed(3)}</td><td>${margin}</td><td>${center.toFixed(3)}</td><td class="ok">정상</td></tr>`;
    }).join("");
    document.querySelector("#okCount").textContent = `${roster.length}/${roster.length}`;
  </script>
</body>
</html>
